        // Detección de gestos swipe para abrir o cerrar el menú lateral en pantallas táctiles
        function manejarInicioToque(evento) {
          const toque = evento.touches?.[0];
          if (toque) {
            toqueInicioRef.current = { x: toque.clientX, y: toque.clientY, tiempo: Date.now() };
          }
        }

        function manejarFinToque(evento) {
          if (!toqueInicioRef.current) return;
          const toque = evento.changedTouches?.[0];
          if (!toque) return;
          const dx = toque.clientX - toqueInicioRef.current.x;
          const dy = toque.clientY - toqueInicioRef.current.y;
          const dt = Date.now() - toqueInicioRef.current.tiempo;
          const inicioX = toqueInicioRef.current.x;
          toqueInicioRef.current = null;

          if (dt > 600) return;
          // Gesto de deslizamiento (swipe) horizontal predominante
          if (Math.abs(dx) > 60 && Math.abs(dx) > Math.abs(dy) * 1.4) {
            if (dx > 0 && inicioX < 50 && !menuLateralAbierto) {
              // Deslizamiento desde el borde izquierdo hacia la derecha: abrir menú

            } else if (dx < 0 && menuLateralAbierto) {

              cerrarMenuLateral();
            }

      /** Divide el texto de lectura reconociendo marcadores de página o en bloques cómodos de palabras. */
      function dividirEnBloques(texto, palabrasPorBloque = 220) {
        const contenido = String(texto || "").trim();
        if (!contenido) {
          return [{ pagina: 1, titulo: "Página 1", texto: "El contenido de este libro todavía no está disponible." }];
        }

        // 1. Detectar marcadores explícitos de página/capítulo:
        // Ejemplos: "--- PÁGINA 1: Título ---", "=== PÁGINA 1 ===", "--- PÁGINA 1 ---"
        const regexMarcador = /(?:^|\n)(?:---|\=\=\=)\s*(?:PÁGINA|PAGINA|Página|PAG|CAPÍTULO|CAPITULO|Capítulo)\s*(\d+)?(?::\s*([^\n\r]+?))?\s*(?:---|\=\=\=)/gi;
        const coincidencias = [];
        let match;

        while ((match = regexMarcador.exec(contenido)) !== null) {
          coincidencias.push({
            indice: match.index,
            longitud: match[0].length,
            numero: match[1] || String(coincidencias.length + 1),
            titulo: match[2] ? match[2].trim() : `Página ${match[1] || coincidencias.length + 1}`
          });
        }

        if (coincidencias.length > 0) {
          const partes = [];
          // Si había texto introductorio antes del primer marcador
          const textoPrevio = contenido.slice(0, coincidencias[0].indice).trim();
          if (textoPrevio) {
            partes.push({
              pagina: 1,
              titulo: "Introducción / Prólogo",
              texto: textoPrevio,
            });
          }

          for (let i = 0; i < coincidencias.length; i++) {
            const actual = coincidencias[i];
            const inicioTexto = actual.indice + actual.longitud;
            const finTexto = i + 1 < coincidencias.length ? coincidencias[i + 1].indice : contenido.length;
            const textoPagina = contenido.slice(inicioTexto, finTexto).trim();
            partes.push({
              pagina: partes.length + 1,
              titulo: actual.titulo,
              texto: textoPagina || "(Página sin texto)",
            });
          }
          return partes;
        }

        // 2. Si no hay marcadores explícitos, dividir en bloques cómodos de lectura (~220 palabras)
        const palabras = contenido.split(/\s+/u).filter(Boolean);
        if (palabras.length <= palabrasPorBloque) {
          return [{
            pagina: 1,
            titulo: "Página 1",
            texto: contenido,
          }];
        }

        const bloques = [];
        let num = 1;
        for (let indice = 0; indice < palabras.length; indice += palabrasPorBloque) {
          bloques.push({
            pagina: num,
            titulo: `Página ${num}`,
            texto: palabras.slice(indice, indice + palabrasPorBloque).join(" "),
          });
          num++;
        }
        return bloques;
      }

      /** Modal con el índice interactivo de contenidos del libro para saltar directamente a cualquier página o capítulo. */
      function ModalIndiceLectura({ abierto, alCerrar, bloques, indiceActual, alSeleccionarPagina, tituloLibro }) {
        const [filtro, establecerFiltro] = React.useState("");

        if (!abierto) return null;

        const bloquesFiltrados = bloques.filter((b) => {
          if (!filtro.trim()) return true;
          const termino = filtro.toLowerCase();
          return (
            b.titulo?.toLowerCase().includes(termino) ||
            b.texto?.toLowerCase().includes(termino) ||
            String(b.pagina).includes(termino)
          );
        });

        return (
          <div className="modal-indice-overlay" onClick={alCerrar} role="dialog" aria-modal="true" aria-label="Índice de contenidos">
            <div className="modal-indice-caja" onClick={(e) => e.stopPropagation()}>
              <div className="modal-indice-cabecera">
                <h3><Icono nombre="lista" tamano={17} /> Índice de contenidos — {tituloLibro}</h3>
                <button className="boton boton-mini" type="button" onClick={alCerrar} aria-label="Cerrar índice">
                  <Icono nombre="cerrar" tamano={14} />
                </button>
              </div>
              <div className="modal-indice-filtro">
                <input
                  autoFocus
                  type="search"
                  placeholder="Buscar capítulo, palabra o número de página..."
                  value={filtro}
                  onChange={(e) => establecerFiltro(e.target.value)}
                />
              </div>
              <div className="modal-indice-lista">
                {bloquesFiltrados.length === 0 ? (
                  <p style={{ textAlign: "center", color: "#888", padding: "20px" }}>No se encontraron páginas con "{filtro}".</p>
                ) : (
                  bloquesFiltrados.map((bloque) => {
                    const esActual = bloque.pagina - 1 === indiceActual;
                    return (
                      <button
                        key={bloque.pagina}
                        className={`modal-indice-item ${esActual ? "actual" : ""}`}
                        type="button"
                        onClick={() => {
                          alSeleccionarPagina(bloque.pagina - 1);
                          alCerrar();
                        }}
                      >
                        <span className="modal-indice-badge-pag">Pág. {bloque.pagina}</span>
                        <div className="modal-indice-info">
                          <div className="modal-indice-titulo">
                            {bloque.titulo} {esActual && <span style={{ color: "var(--dorado)", fontSize: "11px", fontWeight: "normal" }}>● Leyendo ahora</span>}
                          </div>
                          <div className="modal-indice-preview">
                            {bloque.texto?.slice(0, 95)}...
                          </div>
                        </div>
                        <Icono nombre="flecha" tamano={13} />
                      </button>
                    );
                  })
                )}
              </div>
            </div>
          </div>
        );
      }

      /** Modal de asistencia en traducción al español */
      function ModalTraduccionLectura({ abierto, alCerrar, textoPagina, reproductor, tituloLibro, numPagina }) {
        const notificar = React.useContext(ContextoNotificaciones);
        const [traduciendo, establecerTraduciendo] = React.useState(false);
        const [textoTraducido, establecerTextoTraducido] = React.useState("");

        if (!abierto) return null;

        const enlaceGoogle = `https://translate.google.com/?sl=auto&tl=es&text=${encodeURIComponent(textoPagina?.slice(0, 1800) || "")}&op=translate`;

        async function traducirEnPagina() {
          if (!textoPagina) return;
          establecerTraduciendo(true);
          try {
            const respuesta = await fetch(`https://api.mymemory.translated.net/get?q=${encodeURIComponent(textoPagina.slice(0, 480))}&langpair=autodetect|es`);
            const datos = await respuesta.json();
            if (datos.responseData?.translatedText) {
              establecerTextoTraducido(datos.responseData.translatedText);
              notificar("Traducción completada.");
            } else {
              throw new Error("No se pudo obtener la traducción automática.");
            }
          } catch (e) {
            notificar("No se pudo traducir directamente. Usa el enlace de Google Traductor para ver la traducción completa.", "error");
          } finally {
            establecerTraduciendo(false);
          }
        }

        return (
          <div className="modal-indice-overlay" onClick={alCerrar} role="dialog" aria-modal="true" aria-label="Traducción en español">
            <div className="modal-traduccion-caja" onClick={(e) => e.stopPropagation()}>
              <div className="modal-indice-cabecera" style={{ padding: "0 0 16px 0", marginBottom: "16px" }}>
                <h3><Icono nombre="traduccion" tamano={18} /> Traducción y lectura en español (Pág. {numPagina})</h3>
                <button className="boton boton-mini" type="button" onClick={alCerrar}>
                  <Icono nombre="cerrar" tamano={14} />
                </button>
              </div>

              <label style={{ fontSize: "11px", fontWeight: "700", color: "#666", marginBottom: "6px", display: "block" }}>
                Texto original de esta página:
              </label>
              <div className="caja-texto-original">
                {textoPagina || "Sin contenido en esta página."}
              </div>

              {textoTraducido && (
                <>
                  <label style={{ fontSize: "11px", fontWeight: "700", color: "#856404", marginBottom: "6px", display: "block" }}>
                    ✓ Traducción en español:
                  </label>
                  <div className="caja-texto-traducido">
                    {textoTraducido}
                  </div>
                </>
              )}

              <div className="acciones-traduccion">
                <a
                  className="boton boton-primario"
                  href={enlaceGoogle}
                  target="_blank"
                  rel="noopener noreferrer"
                  style={{ textDecoration: "none", display: "inline-flex", alignItems: "center", gap: "6px" }}
                >
                  <Icono nombre="traduccion" tamano={14} /> Abrir traducción en Google Traductor
                </a>
                <button
                  type="button"
                  className="boton"
                  onClick={traducirEnPagina}
                  disabled={traduciendo}
                >
                  {traduciendo ? <><span className="indicador-carga-mini" /> Traduciendo…</> : "⚡ Traducir aquí"}
                </button>
                <button
                  type="button"
                  className="boton"
                  onClick={() => {
                    const textoALeer = textoTraducido || textoPagina;
                    reproductor.alternar(textoALeer, `lectura-traducida-${numPagina}`, null, {
                      titulo: `${tituloLibro} (Pág. ${numPagina})`,
                      autor: "Traducción en español"
                    });
                  }}
                  disabled={!reproductor.disponible}
                >
                  <Icono nombre="altavoz" tamano={14} /> Escuchar en voz alta
                </button>
              </div>
            </div>
          </div>
        );
      }

      /** Pestaña de lectura con paginación real, índice interactivo, temas y persistencia del avance. */
      function PestañaLectura({ libro, reproductor, alCambiarProgreso }) {
        const notificar = React.useContext(ContextoNotificaciones);
        const bloques = React.useMemo(
          () => dividirEnBloques(libro.contenidoCompleto),
          [libro.contenidoCompleto],
        );
        const totalBloques = Math.max(1, bloques.length);
        const totalPaginasLibro = Math.max(1, Number(libro.totalPaginas) || totalBloques);
        const paginaGuardada = Number(libro.progresoLectura?.paginaActual) || 0;
        const indiceInicial = Math.min(
          totalBloques - 1,
          Math.max(0, Math.floor((paginaGuardada / totalPaginasLibro) * totalBloques)),
        );
        const [indicePagina, establecerIndicePagina] = React.useState(indiceInicial);
        const [paginaEntrada, establecerPaginaEntrada] = React.useState(String(indiceInicial + 1));
        const [progreso, establecerProgreso] = React.useState(
          libro.progresoLectura || { porcentaje: 0, paginaActual: 0 },
        );
        const [guardando, establecerGuardado] = React.useState(false);
        const [error, establecerError] = React.useState("");

        // Modales de Índice y Traducción
        const [modalIndiceAbierto, establecerModalIndiceAbierto] = React.useState(false);
        const [modalTraduccionAbierto, establecerModalTraduccionAbierto] = React.useState(false);

        // Búsqueda manual dentro del PDF / libro
        const [buscadorVisible, establecerBuscadorVisible] = React.useState(false);
        const [terminoBusqueda, establecerTerminoBusqueda] = React.useState("");

        // Ajustes de lectura personalizados (temas y tamaño de letra)
        const [temaLectura, establecerTemaLectura] = React.useState("claro");
        const [tamanoFuente, establecerTamanoFuente] = React.useState("16px");

        React.useEffect(() => {
          const pag = Number(libro.progresoLectura?.paginaActual) || 0;
          const idx = Math.min(
            totalBloques - 1,
            Math.max(0, Math.floor((pag / totalPaginasLibro) * totalBloques)),
          );
          establecerIndicePagina(idx);
          establecerPaginaEntrada(String(idx + 1));
          establecerProgreso(libro.progresoLectura || { porcentaje: 0, paginaActual: 0 });
        }, [libro.progresoLectura, totalBloques, totalPaginasLibro]);

        /** Traduce la página simulada a una página del total guardado del libro. */
        async function cambiarPagina(indiceSolicitado) {
          const indiceSeguro = Math.min(totalBloques - 1, Math.max(0, indiceSolicitado));
          establecerPaginaEntrada(String(indiceSeguro + 1));
          if (indiceSeguro === indicePagina) return;

          if (reproductor.origen?.startsWith(`lectura-${libro.id}-`)) {
            reproductor.detener();
          }

          establecerIndicePagina(indiceSeguro);
          establecerError("");
          establecerGuardado(true);
          const paginaFisica = Math.max(
            1,
            Math.min(
              totalPaginasLibro,
              Math.round(((indiceSeguro + 1) / totalBloques) * totalPaginasLibro),
            ),
          );

          try {
            const progresoActualizado = await serviciosApi.actualizarProgreso(
              libro.id,
              paginaFisica,
            );
            establecerProgreso(progresoActualizado);
            alCambiarProgreso(libro.id, progresoActualizado);
          } catch (fallo) {
            const mensaje = fallo.message || "No se pudo guardar el progreso.";
            establecerError(mensaje);
            notificar(mensaje, "error");
          } finally {
            establecerGuardado(false);
          }
        }

        const paginasEncontradas = React.useMemo(() => {
          const query = terminoBusqueda.trim().toLowerCase();
          if (!query || query.length < 2) return [];
          const resultados = [];
          bloques.forEach((b, idx) => {
            const texto = ((b.titulo || "") + " " + (b.texto || b || "")).toLowerCase();
            if (texto.includes(query)) {
              resultados.push({
                indice: idx,
                numero: idx + 1,
                titulo: b.titulo || `Pág. ${idx + 1}`
              });
            }
          });
          return resultados;
        }, [bloques, terminoBusqueda]);

        const bloqueActual = bloques[indicePagina] || { pagina: 1, titulo: "Página 1", texto: "El contenido de este libro todavía no está disponible." };
        const textoPaginaActual = bloqueActual.texto || bloqueActual;

        /** Lee la página seleccionada y pide confirmación antes de avanzar. */
        function alternarVozPagina(indice) {
          const b = bloques[indice] || { texto: "El contenido de este libro todavía no está disponible." };
          const texto = b.texto || b;
          const identificador = `lectura-${libro.id}-${indice}`;
          reproductor.alternar(texto, identificador, () => {
            if (indice >= totalBloques - 1) return;
            const continuar = window.confirm(
              "Terminó esta página. ¿Deseas continuar con la siguiente?",
            );
            if (continuar) {
              cambiarPagina(indice + 1).then(() => alternarVozPagina(indice + 1));
            }
          }, {
            titulo: `${libro.titulo} (${b.titulo || `Pág. ${indice + 1}`})`,
            autor: libro.autor || "BiblioTeca Digital"
          });
        }

        function irAPagina() {
          const paginaSolicitada = Number(paginaEntrada);
          if (!Number.isInteger(paginaSolicitada) || paginaSolicitada < 1 || paginaSolicitada > totalBloques) {
            establecerError(`Ingresa una página entre 1 y ${totalBloques}.`);
            return;
          }
          cambiarPagina(paginaSolicitada - 1);
        }

        const identificadorPagina = `lectura-${libro.id}-${indicePagina}`;
        const vozEnPagina = reproductor.origen === identificadorPagina;
        const iconoVoz = vozEnPagina && reproductor.estado === "reproduciendo"
          ? "pausa"
          : "play";
        const etiquetaVoz = vozEnPagina && reproductor.estado === "reproduciendo"
          ? "Pausar lectura"
          : vozEnPagina && reproductor.estado === "pausada"
            ? "Reanudar lectura"
            : "Leer esta página";
        const rangoPagina = reproductor.rango?.origen === identificadorPagina
          ? reproductor.rango
          : null;

        // Gestos de deslizamiento táctil (swipe) para avanzar o retroceder páginas
        const toqueLecturaRef = React.useRef(null);
        function manejarInicioToqueLectura(evento) {
          const t = evento.touches?.[0];
          if (t) toqueLecturaRef.current = { x: t.clientX, y: t.clientY, tiempo: Date.now() };
        }
        function manejarFinToqueLectura(evento) {
          if (!toqueLecturaRef.current) return;
          const t = evento.changedTouches?.[0];
          if (!t) return;
          const dx = t.clientX - toqueLecturaRef.current.x;
          const dy = t.clientY - toqueLecturaRef.current.y;
          const dt = Date.now() - toqueLecturaRef.current.tiempo;
          toqueLecturaRef.current = null;
          if (dt > 600) return;
          if (Math.abs(dx) > 60 && Math.abs(dx) > Math.abs(dy) * 1.4) {
            if (dx < 0 && indicePagina < totalBloques - 1) {
              cambiarPagina(indicePagina + 1);
            } else if (dx > 0 && indicePagina > 0) {
              cambiarPagina(indicePagina - 1);
            }
          }
        }

        /** Las flechas cambian de página, pero dejan intactos los controles de texto. */
        function manejarTecladoLectura(evento) {
          if (evento.altKey || evento.ctrlKey || evento.metaKey) return;
          if (evento.target.closest?.("input, textarea, select, [contenteditable='true']")) return;
          if (evento.key === "ArrowLeft" && indicePagina > 0) {
            evento.preventDefault();
            cambiarPagina(indicePagina - 1);
          }
          if (evento.key === "ArrowRight" && indicePagina < totalBloques - 1) {
            evento.preventDefault();
            cambiarPagina(indicePagina + 1);
          }
        }

        return (
          <section
            className={`panel-lectura tema-${temaLectura}`}
            aria-label="Contenido del libro. Usa deslizar con el dedo o las flechas para cambiar de página."
            tabIndex="0"
            onKeyDown={manejarTecladoLectura}
            onTouchStart={manejarInicioToqueLectura}
            onTouchEnd={manejarFinToqueLectura}
          >
            {/* Cabecera de la página actual */}
            <div className="lectura-meta">
              <div>
                <h3 className="lectura-meta-titulo">{bloqueActual.titulo || "Lectura del libro"}</h3>
                <span className="lectura-paginas">Página {indicePagina + 1} de {totalBloques}</span>
              </div>
              <button
                className="boton boton-mini boton-indice-abrir"
                type="button"
                onClick={() => establecerModalIndiceAbierto(true)}
                title="Abrir índice interactivo de contenidos"
              >
                <Icono nombre="lista" tamano={14} /> <span>📖 Índice ({totalBloques} págs)</span>
              </button>
            </div>

            {/* Barra de herramientas: Temas, Tamaño de letra y Traductor */}
            <div className="barra-herramientas-lectura">
              <div className="grupo-herramientas">
                <button
                  className={`boton-herramienta ${temaLectura === "claro" ? "activo" : ""}`}
                  type="button"
                  onClick={() => establecerTemaLectura("claro")}
                  title="Modo Día (Fondo blanco)"
                >
                  <Icono nombre="sol" tamano={13} /> Día
                </button>
                <button
                  className={`boton-herramienta ${temaLectura === "sepia" ? "activo" : ""}`}
                  type="button"
                  onClick={() => establecerTemaLectura("sepia")}
                  title="Modo Sepia (Lectura cálida y descansada)"
                >
                  📜 Sepia
                </button>
                <button
                  className={`boton-herramienta ${temaLectura === "oscuro" ? "activo" : ""}`}
                  type="button"
                  onClick={() => establecerTemaLectura("oscuro")}
                  title="Modo Noche (Fondo oscuro)"
                >
                  <Icono nombre="luna" tamano={13} /> Noche
                </button>
              </div>

              <div className="grupo-herramientas">
                <button
                  className={`boton-herramienta ${tamanoFuente === "14px" ? "activo" : ""}`}
                  type="button"
                  onClick={() => establecerTamanoFuente("14px")}
                  title="Letra compacta"
                >
                  A-
                </button>
                <button
                  className={`boton-herramienta ${tamanoFuente === "16px" ? "activo" : ""}`}
                  type="button"
                  onClick={() => establecerTamanoFuente("16px")}
                  title="Letra normal"
                >
                  A
                </button>
                <button
                  className={`boton-herramienta ${tamanoFuente === "19px" ? "activo" : ""}`}
                  type="button"
                  onClick={() => establecerTamanoFuente("19px")}
                  title="Letra grande"
                >
                  A+
                </button>
                <button
                  className={`boton-herramienta ${tamanoFuente === "22px" ? "activo" : ""}`}
                  type="button"
                  onClick={() => establecerTamanoFuente("22px")}
                  title="Letra extra grande"
                >
                  A++
                </button>
              </div>

              <div className="grupo-herramientas">
                <button
                  className="boton-herramienta"
                  type="button"
                  onClick={() => establecerModalTraduccionAbierto(true)}
                  title="Traducir texto o consultar traducción al español"
                >
                  <Icono nombre="traduccion" tamano={13} /> <span>🌐 Traducir</span>
                </button>
                <button
                  className={`boton-herramienta ${buscadorVisible ? "activo" : ""}`}
                  type="button"
                  onClick={() => establecerBuscadorVisible((prev) => !prev)}
                  title="Buscar texto, palabras clave o temas dentro de este PDF/libro"
                >
                  <Icono nombre="buscar" tamano={13} /> <span>🔍 Buscar en PDF</span>
                </button>
              </div>
            </div>

            {/* Barra de búsqueda interactiva en el libro/PDF */}
            {buscadorVisible && (
              <div className="barra-busqueda-lector">
                <div className="barra-busqueda-lector-input">
                  <Icono nombre="buscar" tamano={16} />
                  <input
                    type="search"
                    autoFocus
                    placeholder="Escribe una palabra o frase para buscar en las páginas del PDF..."
                    value={terminoBusqueda}
                    onChange={(e) => establecerTerminoBusqueda(e.target.value)}
                  />
                  {terminoBusqueda && (
                    <button
                      type="button"
                      style={{ background: "none", border: "none", cursor: "pointer", fontSize: "14px", color: "var(--texto-suave)" }}
                      onClick={() => establecerTerminoBusqueda("")}
                      title="Limpiar búsqueda"
                    >
                      ✕
                    </button>
                  )}
                </div>
                {terminoBusqueda.trim().length >= 2 && (
                  <div className="chips-paginas-busqueda">
                    <span style={{ fontWeight: 600, color: "var(--azul-oscuro)" }}>
                      {paginasEncontradas.length > 0
                        ? `${paginasEncontradas.length} coincidencia${paginasEncontradas.length > 1 ? "s" : ""} encontrada${paginasEncontradas.length > 1 ? "s" : ""}:`
                        : "No se encontraron coincidencias."}
                    </span>
                    {paginasEncontradas.map((item) => (
                      <button
                        key={item.indice}
                        type="button"
                        className={`chip-pagina ${item.indice === indicePagina ? "actual" : ""}`}
                        onClick={() => cambiarPagina(item.indice)}
                        title={`Ir a ${item.titulo}`}
                      >
                        Pág. {item.numero}
                      </button>
                    ))}
                  </div>
                )}
              </div>
            )}

            {/* Controles de lectura en voz alta */}
            <div className="controles-voz" aria-label="Controles de lectura en voz alta">
              <div className="voz-botones">
                <button
                  className={`boton boton-voz ${vozEnPagina && reproductor.estado !== "inactiva" ? "activo" : ""}`}
                  type="button"
                  disabled={!reproductor.disponible}
                  aria-label={etiquetaVoz}
                  aria-pressed={vozEnPagina}
                  onClick={() => alternarVozPagina(indicePagina)}
                >
                  <span className="iconos-voz">
                    <Icono nombre="altavoz" tamano={16} />
                    <Icono nombre={iconoVoz} tamano={12} />
                  </span>
                  {etiquetaVoz}
                </button>
                <button
                  className="boton boton-voz"
                  type="button"
                  disabled={!reproductor.origen}
                  aria-label="Detener lectura en voz alta"
                  onClick={reproductor.detener}
                >
                  <Icono nombre="detener" tamano={14} /> Detener
                </button>
              </div>
              <div className="voz-ajustes">
                <label className="voz-ajuste">
                  Velocidad
                  <select
                    className="voz-selector"
                    value={reproductor.velocidad}
                    disabled={!reproductor.disponible || reproductor.estado !== "inactiva"}
                    onChange={(evento) => reproductor.establecerVelocidad(Number(evento.target.value))}
                  >
                    <option value="0.5">0.5x</option>
                    <option value="0.75">0.75x</option>
                    <option value="1">1x</option>
                    <option value="1.25">1.25x</option>
                    <option value="1.5">1.5x</option>
                  </select>
                </label>
                <label className="voz-ajuste">
                  Voz en español
                  <select
                    className="voz-selector voz-selector-voz"
                    value={reproductor.vozSeleccionada}
                    disabled={!reproductor.disponible || !reproductor.voces.length || reproductor.estado !== "inactiva"}
                    onChange={(evento) => reproductor.seleccionarVoz(evento.target.value)}
                  >
                    {reproductor.voces.length === 0 && <option value="">Voz predeterminada</option>}
                    {reproductor.voces.map((voz) => (
                      <option key={voz.voiceURI} value={voz.voiceURI}>{voz.name} ({voz.lang})</option>
                    ))}
                  </select>
                </label>
              </div>
            </div>
            {!reproductor.disponible ? (
              <p className="estado-voz" role="status">Este navegador no admite lectura en voz alta.</p>
            ) : reproductor.voces.length === 0 ? (
              <p className="estado-voz" role="status">No se encontraron voces en español; se usará la voz predeterminada del navegador.</p>
            ) : null}

            {/* Texto de la página actual con tamaño configurable */}
            <article className="lectura-texto" style={{ fontSize: tamanoFuente, lineHeight: "1.9" }}>

                texto={textoPaginaActual}

            <div className="lectura-progreso">
              <IndicadorProgreso porcentaje={progreso.porcentaje} />

            <div className="lectura-controles">

                type="button"

                <Icono nombre="atras" tamano={14} /> Anterior

                <label htmlFor="pagina-destino">Ir a</label>
                <input

                <button className="boton boton-mini" type="button" disabled={guardando} onClick={irAPagina}>Ir</button>
              </div>
              <button
                className="boton boton-control"
                type="button"
                disabled={indicePagina >= totalBloques - 1 || guardando}

              </button>

            {guardando && <p className="mensaje-error-detalle" role="status"><span className="indicador-carga-mini" /> Guardando progreso…</p>}
            {error && <p className="mensaje-error-detalle" role="alert">{error}</p>}

            {/* Modales integrados del lector */}
            <ModalIndiceLectura
              abierto={modalIndiceAbierto}
              alCerrar={() => establecerModalIndiceAbierto(false)}

              alSeleccionarPagina={cambiarPagina}

              abierto={modalTraduccionAbierto}
              alCerrar={() => establecerModalTraduccionAbierto(false)}
