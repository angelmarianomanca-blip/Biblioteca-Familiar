              reproductor={reproductor}
              tituloLibro={libro.titulo}
              numPagina={indicePagina + 1}
            />
          </section>
        );
      }

      /** Selector de capítulos que presenta el resumen elegido completo. */
      function PestañaResumenes({ resumenes, reproductor, libro }) {
        const notificar = React.useContext(ContextoNotificaciones);
        const [listaResumenes, establecerListaResumenes] = React.useState(resumenes);
        const [resumenId, seleccionarResumen] = React.useState(resumenes[0]?.id ?? null);
        const [formularioAbierto, establecerFormularioAbierto] = React.useState(false);
        const [resumenEditandoId, establecerResumenEditandoId] = React.useState(null);
        const [capitulo, establecerCapitulo] = React.useState("");
        const [tituloCapitulo, establecerTituloCapitulo] = React.useState("");
        const [contenidoResumen, establecerContenidoResumen] = React.useState("");
        const [guardandoResumen, establecerGuardadoResumen] = React.useState(false);
        const [errorResumen, establecerErrorResumen] = React.useState("");
        const [descargandoPdf, establecerDescargaPdf] = React.useState(false);
        const [errorPdf, establecerErrorPdf] = React.useState("");

        // La consulta al montar recupera cambios hechos antes de volver a esta pestaña.
        React.useEffect(() => {
          let cancelado = false;
          serviciosApi.obtenerResumenes(libro.id)
            .then((resultado) => {
              if (cancelado) return;
              establecerListaResumenes(resultado);
              seleccionarResumen((actual) => resultado.some((elemento) => elemento.id === actual)
                ? actual
                : resultado[0]?.id ?? null);
            })
            .catch((fallo) => {
              if (!cancelado) {
                establecerErrorResumen(fallo.message);
                notificar(fallo.message, "error");
              }
            });
          return () => { cancelado = true; };
        }, [libro.id]);

        const resumen = listaResumenes.find((elemento) => elemento.id === resumenId);
        const identificadorResumen = resumen ? `resumen-${resumen.id}` : "";
        const rangoResumen = reproductor.rango?.origen === identificadorResumen
          ? reproductor.rango
          : null;

        /** Limpia los campos y prepara el editor en modo de creación. */
        function agregarResumen() {
          establecerResumenEditandoId(null);
          establecerCapitulo(String(listaResumenes.length + 1));
          establecerTituloCapitulo("");
          establecerContenidoResumen("");
          establecerErrorResumen("");
          establecerFormularioAbierto(true);
        }

        /** Copia el capítulo seleccionado a los controles del formulario. */
        function editarResumen(elemento) {
          establecerResumenEditandoId(elemento.id);
          establecerCapitulo(String(elemento.capitulo));
          establecerTituloCapitulo(elemento.tituloCapitulo);
          establecerContenidoResumen(elemento.contenido);
          establecerErrorResumen("");
          establecerFormularioAbierto(true);
        }

        /** Envía el resumen nuevo o editado y refleja la fila devuelta por la API. */
        async function guardarResumen(evento) {
          evento.preventDefault();
          establecerGuardadoResumen(true);
          establecerErrorResumen("");
          const datos = {
            capitulo: Number(capitulo),
            tituloCapitulo,
            contenido: contenidoResumen,
            orden: Number(capitulo),
          };
          try {
            const guardado = resumenEditandoId === null
              ? await serviciosApi.crearResumen(libro.id, datos)
              : await serviciosApi.actualizarResumen(libro.id, resumenEditandoId, datos);
            const listaActualizada = [
              ...listaResumenes.filter((elemento) => elemento.id !== guardado.id),
              guardado,
            ].sort((primero, segundo) => primero.capitulo - segundo.capitulo || primero.orden - segundo.orden);
            establecerListaResumenes(listaActualizada);
            seleccionarResumen(guardado.id);
            establecerFormularioAbierto(false);
            notificar(resumenEditandoId === null ? "Resumen agregado." : "Resumen actualizado.");
          } catch (fallo) {
            const mensaje = fallo.message || "No se pudo guardar el resumen.";
            establecerErrorResumen(mensaje);
            notificar(mensaje, "error");
          } finally {
            establecerGuardadoResumen(false);
          }
        }

        /** Elimina el resumen solo después de confirmar la cascada de capítulos. */
        async function borrarResumen(elemento) {
          const confirmar = window.confirm(
            `¿Eliminar el resumen del capítulo ${elemento.capitulo}? También se eliminarán su mapa conceptual y su examen.`,
          );
          if (!confirmar) return;
          establecerErrorResumen("");
          try {
            await serviciosApi.eliminarResumen(libro.id, elemento.id);
            const listaActualizada = listaResumenes.filter((actual) => actual.id !== elemento.id);
            establecerListaResumenes(listaActualizada);
            if (resumenId === elemento.id) seleccionarResumen(listaActualizada[0]?.id ?? null);
            if (resumenEditandoId === elemento.id) establecerFormularioAbierto(false);
            notificar("Resumen eliminado.");
          } catch (fallo) {
            const mensaje = fallo.message || "No se pudo eliminar el resumen.";
            establecerErrorResumen(mensaje);
            notificar(mensaje, "error");
          }
        }

        /** Genera la portada, el índice y los capítulos del libro en un archivo. */
        function descargarPdf() {
          establecerDescargaPdf(true);
          establecerErrorPdf("");
          try {
            descargarResumenesPdf(libro, listaResumenes);
          } catch (fallo) {
            establecerErrorPdf(fallo.message || "No se pudo generar el PDF de resúmenes.");
          } finally {
            establecerDescargaPdf(false);
          }
        }

        return (
          <section className="gestion-contenido" aria-label="Gestión de resúmenes">
            <div className="barra-gestion-contenido">
              <button className="boton boton-primario" type="button" onClick={agregarResumen}>
                <Icono nombre="brillo" tamano={14} /> Agregar Resumen
              </button>
              <button className="boton boton-mini" type="button" disabled={!listaResumenes.length || descargandoPdf} onClick={descargarPdf}>
                <Icono nombre="descargar" tamano={14} /> {descargandoPdf ? "Preparando PDF…" : "Descargar PDF"}
              </button>
            </div>
            {errorPdf && <p className="error-descarga-pdf" role="alert">{errorPdf}</p>}
            {errorResumen && <p className="mensaje-error-detalle" role="alert">{errorResumen}</p>}
            {formularioAbierto && (
              <form className="editor-inline editor-resumen" onSubmit={guardarResumen}>
                <div className="editor-inline-fila editor-resumen-cabecera">
                  <label className="campo-admin">Capítulo<input type="number" min="1" step="1" required value={capitulo} onChange={(evento) => establecerCapitulo(evento.target.value)} /></label>
                  <label className="campo-admin">Título<input required maxLength="220" value={tituloCapitulo} onChange={(evento) => establecerTituloCapitulo(evento.target.value)} /></label>
                </div>
                <label className="campo-admin">Contenido<textarea required rows="6" value={contenidoResumen} onChange={(evento) => establecerContenidoResumen(evento.target.value)} /></label>
                <div className="acciones-formulario-admin">
                  <button className="boton boton-primario" type="submit" disabled={guardandoResumen}><Icono nombre="guardar" tamano={14} /> {guardandoResumen ? <><span className="indicador-carga-mini" /> Guardando…</> : "Guardar"}</button>
                  <button className="boton boton-mini" type="button" disabled={guardandoResumen} onClick={() => establecerFormularioAbierto(false)}><Icono nombre="cerrar" tamano={14} /> Cancelar</button>
                </div>
              </form>
            )}
            {listaResumenes.length ? (
              <section className="panel-resumen" aria-label="Resúmenes por capítulo">
                <nav className="lista-resumenes" aria-label="Capítulos resumidos">
                  <p className="lista-resumenes-etiqueta">Capítulos</p>
                  {listaResumenes.map((elemento) => (
                    <div className="fila-enlace-resumen" key={elemento.id}>
                      <button
                        className={`enlace-resumen ${elemento.id === resumenId ? "activo" : ""}`}
                        type="button"
                        aria-current={elemento.id === resumenId ? "true" : undefined}
                        onClick={() => seleccionarResumen(elemento.id)}
                      >
                        <span className="numero-capitulo">Cap. {elemento.capitulo}</span>
                        <span className="enlace-resumen-texto">{elemento.tituloCapitulo}</span>
                      </button>
                      <div className="acciones-fila-admin">
                        <Boton icono="editar" etiqueta={`Editar resumen del capítulo ${elemento.capitulo}`} onClick={() => editarResumen(elemento)} />
                        <Boton icono="papelera" etiqueta={`Eliminar resumen del capítulo ${elemento.capitulo}`} onClick={() => borrarResumen(elemento)} />
                      </div>
                      <BotonVozInline
                        texto={elemento.contenido}
                        identificador={`resumen-${elemento.id}`}
                        etiqueta={`el resumen del capítulo ${elemento.capitulo}`}
                        reproductor={reproductor}
                      />
                    </div>
                  ))}
                </nav>
                {resumen && (
                  <article className="contenido-resumen">
                    <header className="resumen-cabecera">
                      <span className="numero-capitulo">Capítulo {resumen.capitulo}</span>
                      <h3 className="resumen-titulo">{resumen.tituloCapitulo}</h3>
                    </header>
                    <div className="resumen-texto"><TextoConResaltado texto={resumen.contenido} rango={rangoResumen} /></div>
                  </article>
                )}
              </section>
            ) : (
              <div className="detalle-vacio" role="status"><p>Este libro todavía no tiene resúmenes.</p></div>
            )}
          </section>
        );
      }

      /** Lista términos desde la API y filtra en vivo mediante su búsqueda. */
      function PestañaLexico({ libro, reproductor }) {
        const notificar = React.useContext(ContextoNotificaciones);
        const libroId = libro.id;
        const [busqueda, establecerBusqueda] = React.useState("");
        const [terminos, establecerTerminos] = React.useState([]);
        const [cargando, establecerCarga] = React.useState(true);
        const [error, establecerError] = React.useState("");
        const [errorEdicion, establecerErrorEdicion] = React.useState("");
        const [formularioAbierto, establecerFormularioAbierto] = React.useState(false);
        const [terminoEditandoId, establecerTerminoEditandoId] = React.useState(null);
        const [terminoFormulario, establecerTerminoFormulario] = React.useState("");
        const [definicionFormulario, establecerDefinicionFormulario] = React.useState("");
        const [ejemploFormulario, establecerEjemploFormulario] = React.useState("");
        const [guardandoTermino, establecerGuardadoTermino] = React.useState(false);
        const [versionLista, establecerVersionLista] = React.useState(0);
        const [descargandoPdf, establecerDescargaPdf] = React.useState(false);
        const [errorPdf, establecerErrorPdf] = React.useState("");

        /** Prepara campos vacíos para una nueva entrada de glosario. */
        function agregarTermino() {
          establecerTerminoEditandoId(null);
          establecerTerminoFormulario("");
          establecerDefinicionFormulario("");
          establecerEjemploFormulario("");
          establecerErrorEdicion("");
          establecerFormularioAbierto(true);
        }

        /** Precarga los campos del término elegido para editarlo. */
        function editarTermino(termino) {
          establecerTerminoEditandoId(termino.id);
          establecerTerminoFormulario(termino.termino);
          establecerDefinicionFormulario(termino.definicion);
          establecerEjemploFormulario(termino.ejemplo || "");
          establecerErrorEdicion("");
          establecerFormularioAbierto(true);
        }

        /** Envía los tres campos del glosario y solicita de nuevo la lista filtrada. */
        async function guardarTermino(evento) {
          evento.preventDefault();
          establecerGuardadoTermino(true);
          establecerErrorEdicion("");
          const datos = {
            termino: terminoFormulario,
            definicion: definicionFormulario,
            ejemplo: ejemploFormulario.trim() || null,
          };
          try {
            if (terminoEditandoId === null) {
              await serviciosApi.crearTermino(libroId, datos);
            } else {
              await serviciosApi.actualizarTermino(libroId, terminoEditandoId, datos);
            }
            establecerFormularioAbierto(false);
            establecerVersionLista((actual) => actual + 1);
            notificar(terminoEditandoId === null ? "Término agregado al léxico." : "Término actualizado.");
          } catch (fallo) {
            const mensaje = fallo.message || "No se pudo guardar el término.";
            establecerErrorEdicion(mensaje);
            notificar(mensaje, "error");
          } finally {
            establecerGuardadoTermino(false);
          }
        }

        /** Pide confirmación y elimina el término por las rutas del libro. */
        async function borrarTermino(termino) {
          if (!window.confirm(`¿Eliminar el término «${termino.termino}» del léxico?`)) return;
          establecerErrorEdicion("");
          try {
            await serviciosApi.eliminarTermino(libroId, termino.id);
            if (terminoEditandoId === termino.id) establecerFormularioAbierto(false);
            establecerVersionLista((actual) => actual + 1);
            notificar("Término eliminado del léxico.");
          } catch (fallo) {
            const mensaje = fallo.message || "No se pudo eliminar el término.";
            establecerErrorEdicion(mensaje);
            notificar(mensaje, "error");
          }
        }

        /** Consulta el glosario entero para que el filtro visible no limite el PDF. */
        async function descargarPdf() {
          establecerDescargaPdf(true);
          establecerErrorPdf("");
          try {
            const terminosCompletos = await serviciosApi.obtenerLexico(libroId);
            descargarLexicoPdf(libro, terminosCompletos);
          } catch (fallo) {
            establecerErrorPdf(fallo.message || "No se pudo generar el PDF del glosario.");
          } finally {
            establecerDescargaPdf(false);
          }
        }

        React.useEffect(() => {
          let cancelado = false;
          establecerCarga(true);
          establecerError("");
          serviciosApi.obtenerLexico(libroId, busqueda)
            .then((resultado) => {
              if (cancelado) return;
              establecerTerminos(
                [...resultado].sort((primero, segundo) =>
                  primero.termino.localeCompare(segundo.termino, "es", { sensitivity: "base" }),
                ),
              );
            })
            .catch((fallo) => { if (!cancelado) establecerError(fallo.message); })
            .finally(() => { if (!cancelado) establecerCarga(false); });
          return () => { cancelado = true; };
        }, [libroId, busqueda, versionLista]);

        return (
          <section className="panel-lexico" aria-label="Glosario del libro">
            {errorPdf && <p className="error-descarga-pdf" role="alert">{errorPdf}</p>}
            <div className="barra-gestion-contenido">
              <button className="boton boton-primario" type="button" onClick={agregarTermino}>
                <Icono nombre="brillo" tamano={14} /> Agregar término
              </button>
              <button className="boton boton-mini" type="button" disabled={descargandoPdf} onClick={descargarPdf}>
                <Icono nombre="descargar" tamano={14} /> {descargandoPdf ? "Preparando PDF…" : "Descargar PDF"}
              </button>
            </div>
            {errorEdicion && <p className="mensaje-error-detalle" role="alert">{errorEdicion}</p>}
            {formularioAbierto && (
              <form className="editor-inline editor-lexico" onSubmit={guardarTermino}>
                <div className="editor-inline-fila editor-lexico-cabecera">
                  <label className="campo-admin">Término<input required maxLength="180" value={terminoFormulario} onChange={(evento) => establecerTerminoFormulario(evento.target.value)} /></label>
                  <label className="campo-admin">Ejemplo<input value={ejemploFormulario} onChange={(evento) => establecerEjemploFormulario(evento.target.value)} /></label>
                </div>
                <label className="campo-admin">Definición<textarea required rows="4" value={definicionFormulario} onChange={(evento) => establecerDefinicionFormulario(evento.target.value)} /></label>
                <div className="acciones-formulario-admin">
                  <button className="boton boton-primario" type="submit" disabled={guardandoTermino}><Icono nombre="guardar" tamano={14} /> {guardandoTermino ? <><span className="indicador-carga-mini" /> Guardando…</> : "Guardar"}</button>
                  <button className="boton boton-mini" type="button" disabled={guardandoTermino} onClick={() => establecerFormularioAbierto(false)}><Icono nombre="cerrar" tamano={14} /> Cancelar</button>
                </div>
              </form>
            )}
            <BarraBusqueda
              valor={busqueda}
              alCambiar={establecerBusqueda}
              alLimpiar={() => establecerBusqueda("")}
              placeholder="Buscar un término..."
            />
            {error ? (
              <p className="mensaje-error-detalle" role="alert">{error}</p>
            ) : cargando ? (
              <div className="detalle-cargando" role="status" aria-label="Cargando mapas conceptuales"><div className="indicador-carga" /></div>
            ) : terminos.length === 0 ? (
              <div className="detalle-vacio" role="status"><p>No hay términos que coincidan con esta búsqueda.</p></div>
            ) : (
              <div className="lista-terminos">
                {terminos.map((termino) => (
                  <article className="entrada-lexico" key={termino.id}>
                    <div className="termino-cabecera">
                      <h3 className="termino-lexico">{termino.termino}</h3>
                      <div className="acciones-fila-admin">
                        <Boton icono="editar" etiqueta={`Editar término ${termino.termino}`} onClick={() => editarTermino(termino)} />
                        <Boton icono="papelera" etiqueta={`Eliminar término ${termino.termino}`} onClick={() => borrarTermino(termino)} />
                        <BotonVozInline
                          texto={termino.definicion}
                          identificador={`lexico-${termino.id}`}
                          etiqueta={`la definición de ${termino.termino}`}
                          reproductor={reproductor}
                        />
                      </div>
                    </div>
                    <p className="definicion-lexico">
                      <TextoConResaltado
                        texto={termino.definicion}
                        rango={reproductor.rango?.origen === `lexico-${termino.id}` ? reproductor.rango : null}
                      />
                    </p>
                    {termino.ejemplo && <p className="ejemplo-lexico">“{termino.ejemplo}”</p>}
                  </article>
                ))}
              </div>
            )}
          </section>
        );
      }

      /** Distribuye nodos en una cuadrícula para ubicar cajas y conectores. */
      function ubicarNodos(nodos) {
        const columnas = Math.max(1, Math.min(3, Math.ceil(Math.sqrt(nodos.length))));
        const filas = Math.ceil(nodos.length / columnas);
        return nodos.map((nodo, indice) => {
          const columna = indice % columnas;
          const fila = Math.floor(indice / columnas);
          return {
            nodo,
            x: ((columna + 1) / (columnas + 1)) * 100,
            y: ((fila + 1) / (filas + 1)) * 100,
          };
        });
      }

      /** Selector y diagrama SVG de nodos y relaciones de un mapa conceptual. */
      function PestañaMapa({ mapas, resumenes, libro }) {
        const notificar = React.useContext(ContextoNotificaciones);
        const [listaMapas, establecerListaMapas] = React.useState(mapas);
        const [listaResumenes, establecerListaResumenes] = React.useState(resumenes);
        const [mapaId, seleccionarMapa] = React.useState(mapas[0]?.id ?? "");
        const [cargandoMapas, establecerCargaMapas] = React.useState(true);
        const [guardandoMapa, establecerGuardadoMapa] = React.useState(false);
        const [cambiosPendientes, establecerCambiosPendientes] = React.useState(false);
        const [errorMapa, establecerErrorMapa] = React.useState("");
        const [nodoSeleccionadoId, establecerNodoSeleccionadoId] = React.useState(null);
        const [conexionSeleccionada, establecerConexionSeleccionada] = React.useState(null);
        const [conectandoDesde, establecerConectandoDesde] = React.useState(null);
        const [punteroConexion, establecerPunteroConexion] = React.useState(null);
        const [nodoEditandoId, establecerNodoEditandoId] = React.useState(null);
        const [textoNodoEditando, establecerTextoNodoEditando] = React.useState("");
        const [etiquetaOriginalNodo, establecerEtiquetaOriginalNodo] = React.useState("");
        const [descargandoPdf, establecerDescargaPdf] = React.useState(false);
        const [errorPdf, establecerErrorPdf] = React.useState("");

        // Se consultan mapas y capítulos al entrar para reflejar cambios guardados.
        React.useEffect(() => {
          let cancelado = false;
          establecerCargaMapas(true);
          Promise.all([serviciosApi.obtenerMapas(libro.id), serviciosApi.obtenerResumenes(libro.id)])
            .then(([mapasActualizados, resumenesActualizados]) => {
              if (cancelado) return;
              establecerListaMapas(mapasActualizados);
              establecerListaResumenes(resumenesActualizados);
              seleccionarMapa((actual) => mapasActualizados.some((elemento) => String(elemento.id) === String(actual))
                ? actual
                : mapasActualizados[0]?.id ?? "");
            })
            .catch((fallo) => {
              if (!cancelado) {
                const mensaje = fallo.message || "No se pudieron cargar los mapas.";
                establecerErrorMapa(mensaje);
                notificar(mensaje, "error");
              }
            })
            .finally(() => { if (!cancelado) establecerCargaMapas(false); });
          return () => { cancelado = true; };
        }, [libro.id]);

        const mapa = listaMapas.find((elemento) => String(elemento.id) === String(mapaId));
        const nodos = mapa?.datosNodos || [];
        const datosConexiones = mapa?.datosConexiones || [];
        const posiciones = mapa ? ubicarNodos(nodos) : [];
        const posicionesPorId = Object.fromEntries(
          posiciones.map((posicion) => [posicion.nodo.id, posicion]),
        );
        const conexiones = datosConexiones
          .map((conexion, indice) => ({ conexion, indice }))
          .filter(({ conexion }) => posicionesPorId[conexion.origen] && posicionesPorId[conexion.destino]);
        const claveConexion = (conexion) => JSON.stringify([conexion.origen, conexion.destino]);

        /** Actualiza solo el mapa abierto y señala que queda trabajo por guardar. */
        function cambiarDatosMapa(cambios) {
          if (!mapa) return;
          establecerListaMapas((actuales) => actuales.map((elemento) =>
            String(elemento.id) === String(mapaId) ? { ...elemento, ...cambios } : elemento,
          ));
          establecerCambiosPendientes(true);
          establecerErrorMapa("");
        }

        /** Crea un mapa para el primer capítulo que todavía no tenga uno. */
        async function agregarMapaVacio() {
          establecerGuardadoMapa(true);
          establecerErrorMapa("");
          const resumen = listaResumenes.find((elemento) =>
            !listaMapas.some((mapaExistente) => mapaExistente.resumenId === elemento.id),
          ) || null;
          try {
            const mapaCreado = await serviciosApi.crearMapa(libro.id, {
              resumenId: resumen?.id ?? null,
              titulo: resumen ? `Mapa conceptual · Capítulo ${resumen.capitulo}` : "Mapa conceptual",
              datosNodos: [],
              datosConexiones: [],
            });
            establecerListaMapas((actuales) => [...actuales, mapaCreado]);
            seleccionarMapa(mapaCreado.id);
            establecerCambiosPendientes(false);
            notificar("Mapa conceptual agregado.");
          } catch (fallo) {
            const mensaje = fallo.message || "No se pudo crear el mapa conceptual.";
            establecerErrorMapa(mensaje);
            notificar(mensaje, "error");
          } finally {
            establecerGuardadoMapa(false);
          }
        }

        /** Confirma antes de descartar cambios y abrir otro mapa. */
        async function cambiarMapa(evento) {
          const identificadorNuevo = evento.target.value;
          if (cambiosPendientes) {
            if (!window.confirm("Hay cambios sin guardar. ¿Descartarlos y cambiar de mapa?")) return;
            try {
              establecerListaMapas(await serviciosApi.obtenerMapas(libro.id));
            } catch (fallo) {
              establecerErrorMapa(fallo.message || "No se pudo descartar el borrador.");
              return;
            }
          }
          seleccionarMapa(identificadorNuevo);
          establecerCambiosPendientes(false);
          establecerNodoSeleccionadoId(null);
          establecerConexionSeleccionada(null);
          establecerErrorMapa("");
        }

        /** Guarda la estructura JSON del mapa y adopta el registro persistido. */
        async function guardarCambiosMapa() {
          if (!mapa || !cambiosPendientes) return;
          establecerGuardadoMapa(true);
          establecerErrorMapa("");
          try {
            const guardado = await serviciosApi.actualizarMapa(libro.id, mapa.id, {
              datosNodos: mapa.datosNodos,
              datosConexiones: mapa.datosConexiones,
            });
            establecerListaMapas((actuales) => actuales.map((elemento) =>
              elemento.id === guardado.id ? guardado : elemento,
            ));
            establecerCambiosPendientes(false);
            notificar("Cambios del mapa guardados.");
          } catch (fallo) {
            const mensaje = fallo.message || "No se pudieron guardar los cambios del mapa.";
            establecerErrorMapa(mensaje);
            notificar(mensaje, "error");
          } finally {
            establecerGuardadoMapa(false);
          }
        }

        /** Crea un nodo nuevo al pulsar una zona vacía del mapa. */
        function agregarNodoEnArea(evento) {
          if (!mapa || evento.target.closest?.(".mapa-nodo") || evento.target.closest?.(".mapa-conexion")) return;
          const nodoNuevo = {
            id: `nodo-${Date.now()}-${nodos.length + 1}`,
            etiqueta: `Concepto ${nodos.length + 1}`,
          };
          cambiarDatosMapa({ datosNodos: [...nodos, nodoNuevo] });
          establecerNodoSeleccionadoId(nodoNuevo.id);
          establecerNodoEditandoId(nodoNuevo.id);
          establecerTextoNodoEditando(nodoNuevo.etiqueta);
          establecerEtiquetaOriginalNodo(nodoNuevo.etiqueta);
        }

        /** Guarda el texto editado o restaura el texto anterior si se cancela. */
        function terminarEdicionNodo(guardar = true) {
          if (
            guardar &&
            textoNodoEditando.trim() &&
            textoNodoEditando.trim() !== etiquetaOriginalNodo
          ) {
            cambiarDatosMapa({
              datosNodos: nodos.map((nodo) => nodo.id === nodoEditandoId
                ? { ...nodo, etiqueta: textoNodoEditando.trim() }
                : nodo),
            });
          }
          establecerNodoEditandoId(null);
        }

        /** Elimina el nodo elegido y las conexiones que lo referencian. */
        function eliminarNodo(nodoId) {
          const nodo = nodos.find((elemento) => elemento.id === nodoId);
          if (!window.confirm(`¿Eliminar el nodo «${nodo?.etiqueta || "Concepto"}» y sus conexiones?`)) return;
          cambiarDatosMapa({
            datosNodos: nodos.filter((nodo) => nodo.id !== nodoId),
            datosConexiones: datosConexiones.filter((conexion) => conexion.origen !== nodoId && conexion.destino !== nodoId),
          });
          establecerNodoSeleccionadoId(null);
          establecerConexionSeleccionada(null);
        }

        /** Elimina la conexión seleccionada al pulsar su línea. */
        function eliminarConexionSeleccionada() {
          if (conexionSeleccionada === null) return;
          if (!window.confirm("¿Eliminar la conexión seleccionada?")) return;
          cambiarDatosMapa({
            datosConexiones: datosConexiones.filter((conexion) => claveConexion(conexion) !== conexionSeleccionada),
          });
          establecerConexionSeleccionada(null);
        }

        // El destino se detecta en el punto donde termina el arrastre del usuario.
        React.useEffect(() => {
          if (!conectandoDesde) return undefined;
          function finalizarArrastre(evento) {
            const objetivo = document.elementFromPoint(evento.clientX, evento.clientY);
            const destino = objetivo?.closest?.("[data-nodo-id]")?.getAttribute("data-nodo-id");
            if (destino && destino !== conectandoDesde && mapa) {
              const yaConectados = datosConexiones.some((conexion) =>
                conexion.origen === conectandoDesde && conexion.destino === destino,
              );
              if (!yaConectados) {
                const nuevaConexion = { origen: conectandoDesde, destino, etiqueta: "" };
                cambiarDatosMapa({ datosConexiones: [...datosConexiones, nuevaConexion] });
                establecerConexionSeleccionada(claveConexion(nuevaConexion));
              }
            }
            establecerConectandoDesde(null);
            establecerPunteroConexion(null);
          }
          window.addEventListener("pointerup", finalizarArrastre);
          window.addEventListener("pointercancel", finalizarArrastre);
          return () => {
            window.removeEventListener("pointerup", finalizarArrastre);
            window.removeEventListener("pointercancel", finalizarArrastre);
          };
        }, [conectandoDesde, mapa, datosConexiones]);

        /** Actualiza la punta temporal del conector mientras el puntero se mueve. */
        function moverPunteroConexion(evento) {
          if (!conectandoDesde) return;
          const rectangulo = evento.currentTarget.getBoundingClientRect();
          establecerPunteroConexion({
            x: ((evento.clientX - rectangulo.left) / rectangulo.width) * 1000,
            y: ((evento.clientY - rectangulo.top) / rectangulo.height) * 600,
          });
        }

        /** Prepara la edición de texto tras el doble clic. */
        function comenzarEdicionNodo(evento, nodo) {
          evento.stopPropagation();
          establecerNodoSeleccionadoId(nodo.id);
          establecerNodoEditandoId(nodo.id);
          establecerTextoNodoEditando(nodo.etiqueta);
          establecerEtiquetaOriginalNodo(nodo.etiqueta);
        }

        /** Dibuja el mapa seleccionado en canvas y lo inserta en un PDF. */
        function descargarPdf() {
          if (!mapa || !nodos.length) return;
          establecerDescargaPdf(true);
          establecerErrorPdf("");
          try {
            descargarMapaConceptualPdf(libro, mapa, listaResumenes);
          } catch (fallo) {
            establecerErrorPdf(fallo.message || "No se pudo generar el PDF del mapa.");
          } finally {
            establecerDescargaPdf(false);
          }
        }

        const puedeCrearMapa = !listaResumenes.length
          ? !listaMapas.some((elemento) => elemento.resumenId === null)
          : listaResumenes.some((elemento) => !listaMapas.some((mapaExistente) => mapaExistente.resumenId === elemento.id));

        return (
          <section className="panel-mapa" aria-label="Mapa conceptual">
            <div className="selector-mapa-fila">
              <label htmlFor="selector-mapa">Capítulo</label>
              <div className="controles-mapa-pdf">
                {listaMapas.length > 0 && (
                  <select className="selector-mapa" id="selector-mapa" value={mapaId} onChange={cambiarMapa} disabled={cargandoMapas}>
                    {listaMapas.map((elemento) => {
                      const resumen = listaResumenes.find((item) => item.id === elemento.resumenId);
                      const etiqueta = resumen ? `Capítulo ${resumen.capitulo}: ${resumen.tituloCapitulo}` : elemento.titulo;
                      return <option key={elemento.id} value={elemento.id}>{etiqueta}</option>;
                    })}
                  </select>
                )}
                <button className="boton boton-mini" type="button" disabled={!puedeCrearMapa || guardandoMapa || cargandoMapas} onClick={agregarMapaVacio}>
                  <Icono nombre="brillo" tamano={14} /> Agregar mapa
                </button>
                {mapa && <button className="boton boton-primario" type="button" disabled={!cambiosPendientes || guardandoMapa} onClick={guardarCambiosMapa}><Icono nombre="guardar" tamano={14} /> {guardandoMapa ? <><span className="indicador-carga-mini" /> Guardando…</> : "Guardar cambios"}</button>}
                <button className="boton boton-mini" type="button" disabled={!mapa || !nodos.length || descargandoPdf} onClick={descargarPdf}>
                  <Icono nombre="descargar" tamano={14} /> {descargandoPdf ? "Preparando…" : "Descargar PDF"}
                </button>
              </div>
            </div>
            {cambiosPendientes && <p className="estado-cambios-mapa" role="status">Hay cambios sin guardar.</p>}
            {errorMapa && <p className="mensaje-error-detalle" role="alert">{errorMapa}</p>}
            {errorPdf && <p className="error-descarga-pdf" role="alert">{errorPdf}</p>}
            {cargandoMapas ? (
              <div className="detalle-cargando" role="status" aria-label="Cargando módulos"><div className="indicador-carga" /></div>
            ) : mapa ? (
              <>
                <h3 className="mapa-titulo">{mapa.titulo}</h3>
                <div className="mapa-editor-herramientas">
                  <span>{conectandoDesde ? "Suelta sobre otro nodo para conectarlo." : "Clic en el espacio para agregar un nodo · Doble clic para editarlo · Arrastra un nodo a otro para conectarlos."}</span>
                  {nodoSeleccionadoId && <button className="boton boton-mini" type="button" onClick={() => eliminarNodo(nodoSeleccionadoId)}><Icono nombre="papelera" tamano={13} /> Eliminar nodo</button>}
                  {conexionSeleccionada && <button className="boton boton-mini" type="button" onClick={eliminarConexionSeleccionada}><Icono nombre="papelera" tamano={13} /> Eliminar conexión</button>}
                </div>
                <div className="mapa-desplazable">
                    <div className="mapa-lienzo" onClick={agregarNodoEnArea} onPointerMove={moverPunteroConexion}>
                      <svg className="mapa-lineas" viewBox="0 0 1000 600" preserveAspectRatio="none" role="img" aria-label="Conexiones entre conceptos">
                        <defs>
                          <marker id="punta-flecha" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
                            <path d="M 0 0 L 10 5 L 0 10 z" fill="#bd974d" />
                          </marker>
                        </defs>
                        {conexiones.map(({ conexion, indice }) => {
                          const origen = posicionesPorId[conexion.origen];
                          const destino = posicionesPorId[conexion.destino];
                          const x1 = origen.x * 10;
                          const y1 = origen.y * 6;
                          const x2 = destino.x * 10;
                          const y2 = destino.y * 6;
                          const distancia = Math.hypot(x2 - x1, y2 - y1) || 1;
                          const xInicio = x1 + ((x2 - x1) / distancia) * 120;
                          const yInicio = y1 + ((y2 - y1) / distancia) * 65;
                          const xFin = x2 - ((x2 - x1) / distancia) * 145;
                          const yFin = y2 - ((y2 - y1) / distancia) * 84;
                          const clave = claveConexion(conexion);
                          return (
                            <g className="mapa-conexion" key={`${clave}-${indice}`} onClick={(evento) => { evento.stopPropagation(); establecerConexionSeleccionada(clave); establecerNodoSeleccionadoId(null); }}>
                              <line className={`mapa-linea ${conexionSeleccionada === clave ? "seleccionada" : ""}`} x1={xInicio} y1={yInicio} x2={xFin} y2={yFin} markerEnd="url(#punta-flecha)" />
                              {conexion.etiqueta && <text className="mapa-etiqueta-linea" x={(x1 + x2) / 2} y={(y1 + y2) / 2 - 9}>{conexion.etiqueta}</text>}
                            </g>
                          );
                        })}
                        {conectandoDesde && posicionesPorId[conectandoDesde] && punteroConexion && <line className="mapa-linea mapa-linea-temporal" x1={posicionesPorId[conectandoDesde].x * 10} y1={posicionesPorId[conectandoDesde].y * 6} x2={punteroConexion.x} y2={punteroConexion.y} />}
                      </svg>
                      {!nodos.length && <span className="mapa-instruccion-vacia">Haz clic aquí para crear el primer nodo</span>}
                      {posiciones.map(({ nodo, x, y }) => (
                        <div
                          key={nodo.id}
                          className={`mapa-nodo ${nodoSeleccionadoId === nodo.id ? "seleccionado" : ""} ${conectandoDesde === nodo.id ? "conectando" : ""}`}
                          data-nodo-id={nodo.id}
                          style={{ left: `${x}%`, top: `${y}%` }}
                          onClick={(evento) => { evento.stopPropagation(); establecerNodoSeleccionadoId(nodo.id); establecerConexionSeleccionada(null); }}
                          onDoubleClick={(evento) => comenzarEdicionNodo(evento, nodo)}
                          onPointerDown={(evento) => {
                            if (evento.button !== 0 || nodoEditandoId === nodo.id) return;
                            establecerNodoSeleccionadoId(nodo.id);
                            establecerConexionSeleccionada(null);
                            establecerConectandoDesde(nodo.id);
                          }}
                        >
                          {nodoEditandoId === nodo.id ? (
                            <input
                              className="mapa-nodo-editor"
                              autoFocus
                              value={textoNodoEditando}
                              aria-label="Editar concepto"
                              onClick={(evento) => evento.stopPropagation()}
                              onChange={(evento) => establecerTextoNodoEditando(evento.target.value)}
                              onBlur={() => terminarEdicionNodo(true)}
                              onKeyDown={(evento) => {
                                evento.stopPropagation();
                                if (evento.key === "Enter") { evento.preventDefault(); terminarEdicionNodo(true); }
                                if (evento.key === "Escape") terminarEdicionNodo(false);
                              }}
                            />
                          ) : <span>{nodo.etiqueta}</span>}
                          <button className="mapa-nodo-eliminar" type="button" aria-label={`Eliminar nodo ${nodo.etiqueta}`} title="Eliminar nodo" onPointerDown={(evento) => evento.stopPropagation()} onClick={(evento) => { evento.stopPropagation(); eliminarNodo(nodo.id); }}>
                            <Icono nombre="papelera" tamano={12} />
                          </button>
                        </div>
                      ))}
                    </div>
                </div>
              </>
            ) : (
              <div className="detalle-vacio" role="status"><p>Este libro todavía no tiene mapas. Agrega uno para empezar a crear nodos.</p></div>
            )}
          </section>
        );
      }

      /** Lista módulos, muestra el avance y persiste cada marca de completado. */
      function PestañaModulos({ libro }) {
        const notificar = React.useContext(ContextoNotificaciones);
        const [modulos, establecerModulos] = React.useState(libro.modulos || []);
        const [moduloGuardando, establecerModuloGuardando] = React.useState(null);
        const [error, establecerError] = React.useState("");
        const completados = modulos.filter((modulo) => modulo.completado).length;
        const porcentaje = modulos.length ? Math.round((completados / modulos.length) * 100) : 0;

        async function marcarCompletado(moduloId) {
          establecerModuloGuardando(moduloId);
          establecerError("");
          try {
            const actualizado = await serviciosApi.completarModulo(libro.id, moduloId);
            establecerModulos((actuales) => actuales.map((modulo) =>
              modulo.id === actualizado.id ? actualizado : modulo,
            ));
            notificar("Módulo marcado como completado.");
          } catch (fallo) {
            const mensaje = fallo.message || "No se pudo actualizar el módulo.";
            establecerError(mensaje);
            notificar(mensaje, "error");
          } finally {
            establecerModuloGuardando(null);
          }
        }

        if (!modulos.length) {
          return <div className="detalle-vacio" role="status"><p>Este libro todavía no tiene módulos.</p></div>;
        }

        return (
          <section className="panel-modulos" aria-label="Módulos del libro">
            <div className="progreso-modulos-cabecera">
              <h3>Progreso de módulos</h3>
              <span>{completados} de {modulos.length} completados · {porcentaje}%</span>
            </div>
            <div className="progreso-pista" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow={porcentaje}>
              <div className="progreso-relleno" style={{ width: `${porcentaje}%` }} />
            </div>
            {error && <p className="mensaje-error-detalle" role="alert">{error}</p>}
            <div className="lista-modulos">
              {modulos.map((modulo) => (
                <div className="fila-modulo" key={modulo.id}>
                  <input
                    className="checkbox-modulo"
                    type="checkbox"
                    checked={Boolean(modulo.completado)}
                    disabled={modulo.completado || moduloGuardando === modulo.id}
                    aria-label={`Marcar ${modulo.titulo} como completado`}
                    onChange={() => marcarCompletado(modulo.id)}
                  />
                  <span className="modulo-titulo">{modulo.titulo}</span>
                  {modulo.completado ? (
                    <span className="modulo-completado"><span className="modulo-check-verde">✓</span>Completado</span>
                  ) : (
                    <button
                      className="boton boton-primario modulo-accion"
                      type="button"
                      disabled={moduloGuardando === modulo.id}
                      onClick={() => marcarCompletado(modulo.id)}
                    >
                      {moduloGuardando === modulo.id ? <><span className="indicador-carga-mini" /> Guardando…</> : "Completar"}
                    </button>
                  )}
                </div>
              ))}
            </div>
          </section>
        );
      }

      /** Devuelve el texto visible de la opción seleccionada para una pregunta. */
      function textoDeOpcion(pregunta, letra) {
        return letra ? pregunta[`opcion${letra}`] || "" : "Sin respuesta";
      }

      /**
       * Anima el porcentaje desde cero con una curva que desacelera al final.
       * Si la animación está apagada o el sistema pide menos movimiento,
       * muestra el resultado directamente y cancela cualquier frame pendiente.
       */
      function usarContadorAnimado(valorFinal, activo) {
        const [valor, establecerValor] = React.useState(0);

        React.useEffect(() => {
          const destino = Math.max(0, Number(valorFinal) || 0);
          const movimientoReducido = window.matchMedia?.("(prefers-reduced-motion: reduce)").matches;
          if (!activo || movimientoReducido) {
            establecerValor(destino);
            return undefined;
          }

          let marco = 0;
          const inicio = window.performance.now();
          const animar = (ahora) => {
            const avance = Math.min(1, (ahora - inicio) / 850);
            const suavizado = 1 - Math.pow(1 - avance, 3);
            establecerValor(Math.round(destino * suavizado));
            if (avance < 1) marco = window.requestAnimationFrame(animar);
          };
          marco = window.requestAnimationFrame(animar);
          return () => window.cancelAnimationFrame(marco);
        }, [valorFinal, activo]);

        return valor;
      }

      /** Coordina la lista, el intento activo, el resultado y el historial del libro. */
      function PestañaExamenes({ libro }) {
        const notificar = React.useContext(ContextoNotificaciones);
        const [examenes, establecerExamenes] = React.useState([]);
        const [historiales, establecerHistoriales] = React.useState({});
        const [historialAbierto, establecerHistorialAbierto] = React.useState(null);
        const [examenActivo, establecerExamenActivo] = React.useState(null);
        const [respuestas, establecerRespuestas] = React.useState({});
        const [preguntaActual, establecerPreguntaActual] = React.useState(0);
        const [resultadoExamen, establecerResultadoExamen] = React.useState(null);
        const [vista, establecerVista] = React.useState("lista");
        const [cargando, establecerCarga] = React.useState(true);
        const [examenIniciando, establecerExamenIniciando] = React.useState(null);
        const [enviando, establecerEnvio] = React.useState(false);
        const [descargandoPdf, establecerDescargaPdf] = React.useState(false);
        const [errorPdf, establecerErrorPdf] = React.useState("");
        const [error, establecerError] = React.useState("");
        const porcentajeAnimado = usarContadorAnimado(resultadoExamen?.porcentaje, vista === "resultado");

        React.useEffect(() => {
          let cancelado = false;
          establecerCarga(true);
          establecerError("");

          /** Carga exámenes e historiales para mostrar el mejor puntaje desde el inicio. */
          async function cargarExamenesEHistoriales() {
            try {
              const listaExamenes = await serviciosApi.obtenerExamenes(libro.id);
              const filasHistorial = await Promise.all(
                listaExamenes.map(async (examen) => ({
                  examenId: examen.id,
                  intentos: await serviciosApi.obtenerHistorialExamen(libro.id, examen.id),
                })),
              );
              if (cancelado) return;
              establecerExamenes(listaExamenes);
              establecerHistoriales(Object.fromEntries(
                filasHistorial.map((fila) => [fila.examenId, fila.intentos]),
              ));
            } catch (fallo) {
              if (!cancelado) {
                const mensaje = fallo.message || "No se pudieron cargar los exámenes.";
                establecerError(mensaje);
                notificar(mensaje, "error");
              }
            } finally {
              if (!cancelado) establecerCarga(false);
            }
          }

          cargarExamenesEHistoriales();
          const escucharPerfil = () => {
            establecerVista("lista");
            establecerResultadoExamen(null);
            cargarExamenesEHistoriales();
          };
          window.addEventListener("biblioteca:perfil-cambiado", escucharPerfil);
          return () => {
            cancelado = true;
            window.removeEventListener("biblioteca:perfil-cambiado", escucharPerfil);
          };
        }, [libro.id]);

        const gruposExamenes = React.useMemo(() => {
          const grupos = new Map();
          const resumenes = libro.resumenes || [];
          examenes.forEach((examen) => {
            const resumen = resumenes.find((elemento) => elemento.id === examen.resumenId);
            const clave = resumen ? `resumen-${resumen.id}` : "generales";
            if (!grupos.has(clave)) {
              grupos.set(clave, {
                clave,
                titulo: resumen
                  ? `Capítulo ${resumen.capitulo}: ${resumen.tituloCapitulo}`
                  : "Exámenes generales",
                examenes: [],
              });
            }
            grupos.get(clave).examenes.push(examen);
          });
          return [...grupos.values()];
        }, [examenes, libro.resumenes]);

        const preguntasActivas = examenActivo?.preguntas || [];
        const pregunta = preguntasActivas[preguntaActual];
        const todasRespondidas = preguntasActivas.length > 0 &&
          preguntasActivas.every((elemento) => Boolean(respuestas[elemento.id]));

        /** Obtiene la nota más alta guardada para el examen indicado. */
        function obtenerMejorPorcentaje(examenId) {
          const intentos = historiales[examenId] || [];
          if (!intentos.length) return null;
          return Math.max(...intentos.map((intento) => Number(intento.resultado.porcentaje) || 0));
        }

        /** Solicita el examen y prepara una hoja nueva de respuestas vacías. */
        async function iniciarExamen(examen) {
          establecerExamenIniciando(examen.id);
          establecerError("");
          try {
            const examenCompleto = await serviciosApi.obtenerExamen(libro.id, examen.id);
            establecerExamenActivo(examenCompleto);
            establecerRespuestas({});
            establecerPreguntaActual(0);
            establecerResultadoExamen(null);
            establecerVista("activo");
            notificar("Examen iniciado.");
          } catch (fallo) {
            const mensaje = fallo.message || "No se pudo iniciar el examen.";
            establecerError(mensaje);
            notificar(mensaje, "error");
          } finally {
            establecerExamenIniciando(null);
          }
        }

        /** Guarda la opción de la pregunta sin bloquear su cambio posterior. */
        function elegirRespuesta(preguntaId, letra) {
          establecerRespuestas((actuales) => ({ ...actuales, [preguntaId]: letra }));
        }

        /** Corrige las respuestas, guarda el intento y conserva su desglose visible. */
        async function finalizarExamen() {
          if (!examenActivo || !todasRespondidas) return;
          establecerEnvio(true);
          establecerError("");
          try {
            const correccion = await serviciosApi.corregirExamen(
              libro.id,
              examenActivo.id,
              respuestas,
            );
            const intento = {
              resultado: correccion.resultado,
              examen: { id: examenActivo.id, titulo: examenActivo.titulo },
            };
            establecerHistoriales((actuales) => ({
              ...actuales,
              [examenActivo.id]: [intento, ...(actuales[examenActivo.id] || [])],
            }));
            establecerResultadoExamen({ ...correccion, examen: examenActivo, respuestas: { ...respuestas } });
            establecerVista("resultado");
            notificar("Resultado del examen guardado.");
          } catch (fallo) {
            const mensaje = fallo.message || "No se pudo corregir el examen.";
            establecerError(mensaje);
            notificar(mensaje, "error");
          } finally {
            establecerEnvio(false);
          }
        }

        /** Empieza otro intento con las mismas preguntas y todas las respuestas vacías. */
        function reintentarExamen() {
          establecerRespuestas({});
          establecerPreguntaActual(0);
          establecerResultadoExamen(null);
          establecerError("");
          establecerVista("activo");
        }

        /** Regresa a la lista para elegir otra evaluación o consultar su historial. */
        function volverAExamenes() {
          establecerVista("lista");
          establecerError("");
        }

        /** Exporta el intento corregido con respuestas y explicaciones. */
        function descargarPdfResultado() {
          establecerDescargaPdf(true);
          establecerErrorPdf("");
          try {
            descargarResultadoExamenPdf(libro, examenActivo, resultadoExamen);
          } catch (fallo) {
            establecerErrorPdf(fallo.message || "No se pudo generar el PDF del resultado.");
          } finally {
            establecerDescargaPdf(false);
          }
        }

        /** Muestra el intento con sus respuestas, explicación y porcentaje final. */
        function mostrarResultado() {
          const porcentaje = Number(resultadoExamen?.porcentaje) || 0;
          const aprobado = porcentaje >= 70;
          return (
            <section className="resultado-animado" aria-label="Resultado del examen">
              <header className={`resultado-cabecera ${aprobado ? "aprobado" : "desaprobado"}`}>
                <span className="resultado-icono"><Icono nombre={aprobado ? "check" : "cruz"} tamano={20} /></span>
                <h3>{aprobado ? "Examen aprobado" : "Examen desaprobado"}</h3>
                <strong className="resultado-porcentaje" aria-label={`Puntaje: ${porcentajeAnimado}%`}>{porcentajeAnimado}%</strong>
                <p className="resultado-resumen">
                  {resultadoExamen.correctas} correctas · {resultadoExamen.incorrectas} incorrectas
                </p>
                <div className="resultado-acciones">
                  <button className="boton-iniciar-examen" type="button" onClick={reintentarExamen}>Reintentar</button>
                  <button className="examen-volver" type="button" onClick={volverAExamenes}>Volver a Exámenes</button>
                  <button className="boton boton-primario boton-descarga-pdf" type="button" disabled={descargandoPdf} onClick={descargarPdfResultado}>
                    <Icono nombre="descargar" tamano={14} /> {descargandoPdf ? "Preparando PDF…" : "Descargar PDF"}
                  </button>
                </div>
              </header>
              {errorPdf && <p className="error-descarga-pdf" role="alert">{errorPdf}</p>}
              <div className="resultado-desglose">
                <h3 className="resultado-desglose-titulo">Revisión de respuestas</h3>
                {examenActivo.preguntas.map((elemento, indice) => {
                  const respuestaDada = resultadoExamen.respuestas[elemento.id];
                  const esCorrecta = respuestaDada === elemento.respuestaCorrecta;
                  return (
                    <article className={`respuesta-corregida ${esCorrecta ? "correcta" : "incorrecta"}`} key={elemento.id}>
                      <header className="respuesta-corregida-cabecera">
                        <span className="respuesta-corregida-icono"><Icono nombre={esCorrecta ? "check" : "cruz"} tamano={13} /></span>
                        <p className="respuesta-corregida-enunciado">{indice + 1}. {elemento.enunciado}</p>
                      </header>
                      <p className="respuesta-corregida-detalle">
                        <strong>Tu respuesta:</strong> {respuestaDada} — {textoDeOpcion(elemento, respuestaDada)}
                      </p>
                      <p className="respuesta-corregida-detalle">
                        <strong>Respuesta correcta:</strong> {elemento.respuestaCorrecta} — {textoDeOpcion(elemento, elemento.respuestaCorrecta)}
                      </p>
                      <p className="respuesta-corregida-explicacion">{elemento.explicacion}</p>
                    </article>
                  );
                })}
              </div>
            </section>
          );
        }

        /** Presenta una pregunta, sus cuatro opciones y la navegación del intento. */
        function mostrarExamenActivo() {
          if (!pregunta) {
            return <div className="detalle-vacio" role="status"><p>Este examen no tiene preguntas disponibles.</p></div>;
          }
          const porcentajeAvance = Math.round(((preguntaActual + 1) / preguntasActivas.length) * 100);
          const opciones = ["A", "B", "C", "D"];
          function manejarTeclasExamen(evento) {
            if (evento.altKey || evento.ctrlKey || evento.metaKey) return;
            if (evento.target.closest?.("input, textarea, select, [contenteditable='true']")) return;
            if (evento.key === "ArrowLeft" && preguntaActual > 0) {
              evento.preventDefault();
              establecerPreguntaActual((actual) => actual - 1);
            }
            if (evento.key === "ArrowRight" && preguntaActual < preguntasActivas.length - 1) {
              evento.preventDefault();
              establecerPreguntaActual((actual) => actual + 1);
            }
          }
          return (
            <section className="vista-examen-activo" aria-label="Examen en curso. Usa las flechas izquierda y derecha para navegar entre preguntas." tabIndex="0" onKeyDown={manejarTeclasExamen}>
              <header className="examen-superior">
                <h3 className="examen-superior-titulo">{examenActivo.titulo}</h3>
                <button className="examen-volver" type="button" onClick={volverAExamenes}>Volver a Exámenes</button>
              </header>
              <div className="examen-layout">
                <article className="examen-pregunta-panel">
                  <p className="examen-pregunta-contador">Pregunta {preguntaActual + 1} de {preguntasActivas.length}</p>
                  <div className="examen-progreso-pista" role="progressbar" aria-valuemin="0" aria-valuemax={preguntasActivas.length} aria-valuenow={preguntaActual + 1}>
                    <div className="examen-progreso-relleno" style={{ width: `${porcentajeAvance}%` }} />
                  </div>
                  <h4 className="examen-enunciado">{pregunta.enunciado}</h4>
                  <div className="lista-opciones-examen">
                    {opciones.map((letra) => (
                      <button
                        className={`opcion-examen ${respuestas[pregunta.id] === letra ? "seleccionada" : ""}`}
                        type="button"
                        key={letra}
                        aria-pressed={respuestas[pregunta.id] === letra}
                        onClick={() => elegirRespuesta(pregunta.id, letra)}
                      >
                        <span className="opcion-examen-letra">{letra}</span>
                        <span className="opcion-examen-texto">{textoDeOpcion(pregunta, letra)}</span>
                      </button>
                    ))}
                  </div>
                  <div className="examen-navegacion">
                    <button className="boton-navegacion-examen" type="button" disabled={preguntaActual === 0} onClick={() => establecerPreguntaActual((actual) => actual - 1)}>
                      <Icono nombre="atras" tamano={13} /> Anterior
                    </button>
                    {preguntaActual < preguntasActivas.length - 1 && (
                      <button className="boton-navegacion-examen" type="button" onClick={() => establecerPreguntaActual((actual) => actual + 1)}>
                        Siguiente <Icono nombre="flecha" tamano={13} />
                      </button>
                    )}
                    <button className="boton-finalizar-examen" type="button" disabled={!todasRespondidas || enviando} onClick={finalizarExamen}>
                      {enviando ? <><span className="indicador-carga-mini" /> Enviando…</> : "Finalizar Examen"}
                    </button>
                  </div>
                  {error && <p className="mensaje-error-detalle" role="alert">{error}</p>}
                  {enviando && <p className="examen-enviando" role="status">Corrigiendo y guardando el resultado…</p>}
                </article>
                <aside className="mapa-preguntas-examen" aria-label="Mapa de preguntas">
                  <h3>Preguntas</h3>
                  <div className="mapa-preguntas-lista">
                    {preguntasActivas.map((elemento, indice) => (
                      <button
                        className={`numero-pregunta-examen ${respuestas[elemento.id] ? "respondida" : ""} ${preguntaActual === indice ? "actual" : ""}`}
                        type="button"
                        key={elemento.id}
                        aria-label={`Ir a la pregunta ${indice + 1}${respuestas[elemento.id] ? ", respondida" : ", sin responder"}`}
                        aria-current={preguntaActual === indice ? "step" : undefined}
                        onClick={() => establecerPreguntaActual(indice)}
                      >
                        {indice + 1}
                      </button>
                    ))}
                  </div>
                  <p className="mapa-preguntas-ayuda">{Object.keys(respuestas).length} de {preguntasActivas.length} respondidas.</p>
                </aside>
              </div>
            </section>
          );
        }

        /** Agrupa exámenes por capítulo y despliega su nota y sus intentos previos. */
        function mostrarListaExamenes() {
          return (
            <section className="panel-examenes" aria-label="Exámenes del libro">
              {gruposExamenes.map((grupo) => (
                <section className="grupo-examenes" key={grupo.clave}>
                  <h3 className="grupo-examenes-titulo">{grupo.titulo}</h3>
                  {grupo.examenes.map((examen) => {
                    const intentos = historiales[examen.id] || [];
                    const mejorPorcentaje = obtenerMejorPorcentaje(examen.id);
                    const estadoExamen = mejorPorcentaje === null
                      ? { clase: "sin-intentar", etiqueta: "Sin intentar" }
                      : mejorPorcentaje >= 70
                        ? { clase: "aprobado", etiqueta: "Aprobado (≥70%)" }
                        : { clase: "desaprobado", etiqueta: "Desaprobado (<70%)" };
                    const abierto = historialAbierto === examen.id;
                    const cantidadPreguntas = examen.preguntas?.length ?? examen.totalPreguntas ?? 0;
                    return (
                      <article className="tarjeta-examen" key={examen.id}>
                        <div className="tarjeta-examen-cabecera">
                          <h4 className="tarjeta-examen-titulo">{examen.titulo}</h4>
                          <span className={`estado-examen ${estadoExamen.clase}`}>{estadoExamen.etiqueta}</span>
                        </div>
                        <div className="tarjeta-examen-detalle">
                          <span>{cantidadPreguntas} preguntas</span>
                          {mejorPorcentaje !== null && <span className="tarjeta-examen-mejor">Mejor resultado: {mejorPorcentaje}%</span>}
                        </div>
                        <div className="tarjeta-examen-acciones">
                          <button
                            className="boton-iniciar-examen"
                            type="button"
                            disabled={examenIniciando !== null || cantidadPreguntas === 0}
                            aria-busy={examenIniciando === examen.id}
                            onClick={() => iniciarExamen(examen)}
                          >
                            {examenIniciando === examen.id ? <><span className="indicador-carga-mini" /> Cargando…</> : "Iniciar Examen"}
                          </button>
                          <button
                            className={`boton-historial-examen ${abierto ? "abierto" : ""}`}
                            type="button"
                            aria-expanded={abierto}
                            onClick={() => establecerHistorialAbierto(abierto ? null : examen.id)}
                          >
                            <Icono nombre="flecha" tamano={12} /> Historial ({intentos.length})
                          </button>
                        </div>
                        {abierto && (
                          <div className="historial-examen">
                            <h5 className="historial-examen-titulo">Intentos anteriores</h5>
                            {intentos.length === 0 ? (
                              <p className="historial-vacio">Todavía no hay intentos guardados.</p>
                            ) : intentos.map((intento) => (
                              <div className="fila-historial-examen" key={intento.resultado.id}>
                                <time dateTime={intento.resultado.fecha}>{formatearFechaHora(intento.resultado.fecha)}</time>
                                <strong>{intento.resultado.porcentaje}%</strong>
                                <span>{intento.resultado.correctas} ✓ · {intento.resultado.incorrectas} ✕</span>
                              </div>
                            ))}
                          </div>
                        )}
                      </article>
                    );
                  })}
                </section>
              ))}
            </section>
          );
        }

        return (
          <section className="seccion-examenes" aria-label="Exámenes">
            {vista === "activo" && examenActivo ? (
              mostrarExamenActivo()
            ) : vista === "resultado" && resultadoExamen ? (
              mostrarResultado()
            ) : cargando ? (
              <div className="detalle-cargando" role="status" aria-label="Cargando exámenes"><div className="indicador-carga" /></div>
            ) : error && examenes.length === 0 ? (
              <div className="detalle-vacio" role="alert"><p>{error}</p></div>
            ) : examenes.length === 0 ? (
              <div className="detalle-vacio" role="status"><p>Este libro todavía no tiene exámenes.</p></div>
            ) : (
              <>
                {error && <p className="mensaje-error-detalle" role="alert">{error}</p>}
                {vista === "lista" && mostrarListaExamenes()}
              </>
            )}
          </section>
        );
      }

      /** Administra los recordatorios activos del libro mostrado en el detalle. */
      function GestorRecordatoriosLibro({ libroId }) {
        const notificar = React.useContext(ContextoNotificaciones);
        const [recordatorios, establecerRecordatorios] = React.useState([]);
        const [mensaje, establecerMensaje] = React.useState("");
        const [fecha, establecerFecha] = React.useState("");
        const [hora, establecerHora] = React.useState("");
        const [idEditando, establecerIdEditando] = React.useState(null);
        const [cargando, establecerCarga] = React.useState(true);
        const [guardando, establecerGuardado] = React.useState(false);
        const [error, establecerError] = React.useState("");

        /** Recarga los avisos de este libro y conserva solo los que siguen activos. */
        const recargarRecordatorios = React.useCallback(async () => {
          establecerCarga(true);
          try {
            const lista = await serviciosApi.obtenerRecordatoriosDeLibro(libroId);
            establecerRecordatorios(lista.filter((recordatorio) => recordatorio.activo));
            establecerError("");
          } catch (fallo) {
            const mensajeError = fallo.message || "No se pudieron cargar los recordatorios del libro.";
            establecerError(mensajeError);
            notificar(mensajeError, "error");
          } finally {
            establecerCarga(false);
          }
        }, [libroId]);

        React.useEffect(() => {
          /** La campana avisa cuando un recordatorio se marcó o eliminó fuera de esta vista. */
          const escucharCambios = () => recargarRecordatorios();
          recargarRecordatorios();
          window.addEventListener("biblioteca:recordatorios-actualizados", escucharCambios);
          window.addEventListener("biblioteca:perfil-cambiado", escucharCambios);
          return () => {
            window.removeEventListener("biblioteca:recordatorios-actualizados", escucharCambios);
            window.removeEventListener("biblioteca:perfil-cambiado", escucharCambios);
          };
        }, [recargarRecordatorios]);

        /** Vacía el formulario y sale del modo de edición sin alterar el recordatorio. */
        function cancelarEdicion() {
          establecerIdEditando(null);
          establecerMensaje("");
          establecerFecha("");
          establecerHora("");
          establecerError("");
        }

        /** Pasa un recordatorio pendiente a los campos para editarlo en línea. */
        function cargarEdicion(recordatorio) {
          if (recordatorio.notificado) return;
          const camposFechaHora = separarFechaHoraLocal(recordatorio.fechaHora);
          establecerIdEditando(recordatorio.id);
          establecerMensaje(recordatorio.mensaje);
          establecerFecha(camposFechaHora.fecha);
          establecerHora(camposFechaHora.hora);
          establecerError("");
        }

        /** Valida y crea o actualiza el registro usando el endpoint de recordatorios. */
        async function guardarRecordatorio(evento) {
          evento.preventDefault();
          const mensajeNormalizado = mensaje.trim();
          if (!mensajeNormalizado || !fecha || !hora) {
            establecerError("Completa el mensaje, la fecha y la hora.");
            return;
          }

          const fechaProgramada = new Date(`${fecha}T${hora}:00`);
          if (Number.isNaN(fechaProgramada.getTime())) {
            establecerError("La fecha y la hora no son válidas.");
            return;
          }

          establecerGuardado(true);
          establecerError("");
          try {
            const datos = {
              mensaje: mensajeNormalizado,
              fechaHora: fechaProgramada.toISOString(),
            };
            if (idEditando === null) {
              await serviciosApi.crearRecordatorio({
                ...datos,
                libroId,
                activo: true,
                notificado: false,
              });
            } else {
              await serviciosApi.actualizarRecordatorio(idEditando, datos);
            }
            cancelarEdicion();
            serviciosApi.emitirCambioRecordatorios();
            notificar(idEditando === null ? "Recordatorio creado." : "Recordatorio actualizado.");
          } catch (fallo) {
            const mensajeError = fallo.message || "No se pudo guardar el recordatorio.";
            establecerError(mensajeError);
            notificar(mensajeError, "error");
          } finally {
            establecerGuardado(false);
          }
        }

        /** Elimina el registro seleccionado y quita sus datos del formulario si hacía falta. */
        async function borrarRecordatorio(recordatorio) {
          establecerGuardado(true);
          establecerError("");
          try {
            await serviciosApi.eliminarRecordatorio(recordatorio.id);
            if (idEditando === recordatorio.id) cancelarEdicion();
            serviciosApi.emitirCambioRecordatorios();
            notificar("Recordatorio eliminado.");
          } catch (fallo) {
            const mensajeError = fallo.message || "No se pudo eliminar el recordatorio.";
            establecerError(mensajeError);
            notificar(mensajeError, "error");
          } finally {
            establecerGuardado(false);
          }
        }

        return (
          <section className="seccion-recordatorios" aria-label="Recordatorios del libro">
            <div className="recordatorios-titulo-fila">
              <h3 className="recordatorios-titulo">Recordatorios</h3>
              <span className="recordatorios-subtitulo">Programa una próxima lectura</span>
            </div>
            <form className="formulario-recordatorio" onSubmit={guardarRecordatorio}>
              <input
                className="campo-recordatorio campo-recordatorio-mensaje"
                type="text"
                aria-label="Mensaje del recordatorio"
                placeholder="Mensaje del recordatorio"
                maxLength="240"
                value={mensaje}
                disabled={guardando}
                onChange={(evento) => establecerMensaje(evento.target.value)}
              />
              <input
                className="campo-recordatorio campo-recordatorio-fecha"
                type="date"
                aria-label="Fecha del recordatorio"
                value={fecha}
                disabled={guardando}
                onChange={(evento) => establecerFecha(evento.target.value)}
              />
              <input
                className="campo-recordatorio campo-recordatorio-hora"
                type="time"
                aria-label="Hora del recordatorio"
                value={hora}
                disabled={guardando}
