      /** Carga el detalle y cambia entre las seis vistas del libro. */
      function VistaDetalleLibro({ libroTarjeta, alVolver, alCambiarProgreso, alEditar, alEliminar, esAdmin }) {
        const notificar = React.useContext(ContextoNotificaciones);
        const [libro, establecerLibro] = React.useState(null);
        const [pestana, establecerPestana] = React.useState("lectura");
        const [cargando, establecerCarga] = React.useState(true);
        const [error, establecerError] = React.useState("");
        const reproductor = usarReproductorVoz();

        React.useEffect(() => {
          reproductor.detener();
        }, [pestana]);

        React.useEffect(() => {
          let cancelado = false;
          function recargarDetalle() {
            serviciosApi.obtenerDetalleLibro(libroTarjeta)
              .then((resultado) => {
                if (!cancelado) {
                  establecerLibro(resultado);
                  if (alCambiarProgreso && resultado.progresoLectura) {
                    alCambiarProgreso(libroTarjeta.id, resultado.progresoLectura);
                  }
                }
              })
              .catch((fallo) => {
                if (!cancelado) {
                  establecerError(fallo.message);
                  notificar(fallo.message, "error");
                }
              })
              .finally(() => { if (!cancelado) establecerCarga(false); });
          }

          document.querySelector(".contenido-principal")?.scrollTo(0, 0);
          recargarDetalle();
          window.addEventListener("biblioteca:perfil-cambiado", recargarDetalle);
          return () => {
            cancelado = true;
            window.removeEventListener("biblioteca:perfil-cambiado", recargarDetalle);
          };
        }, [libroTarjeta, alCambiarProgreso]);

        const pestanas = [
          { id: "lectura", icono: "📖", nombre: "Lectura" },
          { id: "resumenes", icono: "📝", nombre: "Resúmenes" },
          { id: "lexico", icono: "🔤", nombre: "Léxico" },
          { id: "mapa", icono: "🗺️", nombre: "Mapa Conceptual" },
          { id: "modulos", icono: "📊", nombre: "Módulos" },
          { id: "examenes", icono: "📝", nombre: "Exámenes" },
        ];

        /** El teclado mueve el foco entre pestañas y mantiene visible la activa. */
        function manejarTeclasPestanas(evento, indiceActual) {
          let indiceNuevo = indiceActual;
          if (evento.key === "ArrowRight") indiceNuevo = (indiceActual + 1) % pestanas.length;
          if (evento.key === "ArrowLeft") indiceNuevo = (indiceActual - 1 + pestanas.length) % pestanas.length;
          if (evento.key === "Home") indiceNuevo = 0;
          if (evento.key === "End") indiceNuevo = pestanas.length - 1;
          if (indiceNuevo === indiceActual) return;
          evento.preventDefault();
          const pestanaNueva = pestanas[indiceNuevo].id;
          establecerPestana(pestanaNueva);
          window.requestAnimationFrame(() => document.getElementById(`tab-detalle-${pestanaNueva}`)?.focus());
        }

        // Gestos táctiles de deslizamiento (swipe) entre pestañas y volver al catálogo
        const toqueDetalleRef = React.useRef(null);
        function alIniciarToqueDetalle(evento) {
          const t = evento.touches?.[0];
          if (t) toqueDetalleRef.current = { x: t.clientX, y: t.clientY, tiempo: Date.now() };
        }
        function alFinalizarToqueDetalle(evento) {
          if (!toqueDetalleRef.current) return;
          const t = evento.changedTouches?.[0];
          if (!t) return;
          const dx = t.clientX - toqueDetalleRef.current.x;
          const dy = t.clientY - toqueDetalleRef.current.y;
          const dt = Date.now() - toqueDetalleRef.current.tiempo;
          const inicioX = toqueDetalleRef.current.x;
          toqueDetalleRef.current = null;
          if (dt > 600) return;
          if (Math.abs(dx) > 65 && Math.abs(dx) > Math.abs(dy) * 1.4) {
            const indiceActual = pestanas.findIndex((p) => p.id === pestana);
            if (dx < 0 && indiceActual < pestanas.length - 1) {
              // Swipe izquierda -> siguiente pestaña
              establecerPestana(pestanas[indiceActual + 1].id);
            } else if (dx > 0) {
              if (inicioX < 45) {
                // Swipe desde el borde izquierdo -> volver al catálogo
                alVolver();
              } else if (indiceActual > 0) {
                // Swipe derecha -> pestaña anterior
                establecerPestana(pestanas[indiceActual - 1].id);
              }
            }
          }
        }

        return (
          <div className="detalle-pantalla" onTouchStart={alIniciarToqueDetalle} onTouchEnd={alFinalizarToqueDetalle}>
            <header className="detalle-cabecera">
              <button className="boton boton-volver" type="button" onClick={alVolver} aria-label="Volver al catálogo">
                <Icono nombre="atras" tamano={16} />
                <span>Volver al catálogo</span>
              </button>
              <div className="detalle-identidad">
                <div className="detalle-titulo-fila">
                  <h2 className="detalle-titulo">{libroTarjeta.titulo}</h2>
                  <BadgeCategoria nombre={libroTarjeta.categoriaNombre} icono={libroTarjeta.categoriaIcono} />
                </div>
                <p className="detalle-autor">{libroTarjeta.autor}</p>
              </div>
              <div className="detalle-cabecera-acciones">
                {alEditar && (
                  <button
                    type="button"
                    className="boton boton-mini boton-editar-cabecera"
                    onClick={() => alEditar(libroTarjeta)}
                    title={`Editar ${libroTarjeta.titulo}`}
                  >
                    <Icono nombre="editar" tamano={14} /> <span>Editar</span>
                  </button>
                )}
                {esAdmin && alEliminar && (
                  <button
                    type="button"
                    className="boton boton-mini boton-peligro-mini boton-eliminar-cabecera"
                    onClick={() => {
                      if (window.confirm(`¿Estás seguro de que deseas eliminar "${libroTarjeta.titulo}"? Esta acción borrará también sus resúmenes y exámenes.`)) {
                        alEliminar(libroTarjeta);
                        alVolver();
                      }
                    }}
                    title={`Eliminar ${libroTarjeta.titulo}`}
                  >
                    <Icono nombre="eliminar" tamano={14} /> <span>Eliminar</span>
                  </button>
                )}
              </div>
            </header>

            {error ? (
              <div className="detalle-vacio" role="alert"><p>{error}</p></div>
            ) : cargando ? (
              <div className="detalle-cargando" role="status" aria-label="Cargando el libro"><div className="indicador-carga" /></div>
            ) : libro ? (
              <>
                <nav className="tabs-detalle" role="tablist" aria-label="Contenido del libro">
                  {pestanas.map((elemento) => (
                    <button
                      key={elemento.id}
                      id={`tab-detalle-${elemento.id}`}
                      className={`tab-detalle ${pestana === elemento.id ? "activa" : ""}`}
                      type="button"
                      role="tab"
                      aria-selected={pestana === elemento.id}
                      aria-controls="contenido-pestana-libro"
                      tabIndex={pestana === elemento.id ? 0 : -1}
                      onClick={() => establecerPestana(elemento.id)}
                      onKeyDown={(evento) => manejarTeclasPestanas(evento, pestanas.findIndex((pestanaActual) => pestanaActual.id === elemento.id))}
                    >
                      <span aria-hidden="true">{elemento.icono}</span>{elemento.nombre}
                    </button>
                  ))}
                </nav>
                <GestorRecordatoriosLibro libroId={libro.id} />
                <div key={pestana} id="contenido-pestana-libro" className="tab-contenido" role="tabpanel" aria-labelledby={`tab-detalle-${pestana}`} tabIndex="0">
                  {pestana === "lectura" && (
                    <PestañaLectura libro={libro} reproductor={reproductor} alCambiarProgreso={alCambiarProgreso} />
                  )}
                  {pestana === "resumenes" && <PestañaResumenes libro={libro} resumenes={libro.resumenes || []} reproductor={reproductor} />}
                  {pestana === "lexico" && <PestañaLexico libro={libro} reproductor={reproductor} />}
                  {pestana === "mapa" && <PestañaMapa libro={libro} mapas={libro.mapasConceptuales || []} resumenes={libro.resumenes || []} />}
                  {pestana === "modulos" && <PestañaModulos libro={libro} />}
                  {pestana === "examenes" && <PestañaExamenes libro={libro} />}
                </div>
              </>
            ) : null}
          </div>
        );
      }

      /** Convierte una fecha absoluta a una expresión relativa en español. */
      function formatearTiempoRelativo(fechaHora) {
        const fecha = new Date(fechaHora);
        if (Number.isNaN(fecha.getTime())) return "Fecha no disponible";

        // La diferencia negativa indica una actividad pasada; Intl.RelativeTimeFormat
        // elige expresiones naturales como "ayer" o "hace 3 horas".
        const diferenciaSegundos = Math.round((fecha.getTime() - Date.now()) / 1000);
        const diferenciaAbsoluta = Math.abs(diferenciaSegundos);
        const formatoRelativo = new Intl.RelativeTimeFormat("es-AR", { numeric: "auto" });
        if (diferenciaAbsoluta < 60) {
          return formatoRelativo.format(diferenciaSegundos, "second");
        }
        if (diferenciaAbsoluta < 3600) {
          return formatoRelativo.format(Math.round(diferenciaSegundos / 60), "minute");
        }
        if (diferenciaAbsoluta < 86400) {
          return formatoRelativo.format(Math.round(diferenciaSegundos / 3600), "hour");
        }
        return formatoRelativo.format(Math.round(diferenciaSegundos / 86400), "day");
      }

      /** Tarjeta uniforme para los cuatro valores principales del dashboard. */

      /** Carga y presenta estadísticas, actividad y próximos recordatorios. */
      function VistaDashboard({ alAbrirLibro }) {
        const notificar = React.useContext(ContextoNotificaciones);
        const [estadisticas, establecerEstadisticas] = React.useState(null);
        const [cargando, establecerCarga] = React.useState(true);
        const [error, establecerError] = React.useState("");

        React.useEffect(() => {
          let cancelado = false;

          /** Obtiene el agregado del servidor y evita escribir tras desmontarse. */
          async function cargarDashboard() {
            establecerCarga(true);
            establecerError("");
            try {
              const datos = await serviciosApi.obtenerEstadisticas();
              if (!cancelado) establecerEstadisticas(datos);
            } catch (fallo) {
              if (!cancelado) {
                const mensaje = fallo.message || "No se pudo cargar el dashboard.";
                establecerError(mensaje);
                notificar(mensaje, "error");
              }
            } finally {
              if (!cancelado) establecerCarga(false);
            }
          }

          cargarDashboard();
          const escucharPerfil = () => cargarDashboard();
          window.addEventListener("biblioteca:perfil-cambiado", escucharPerfil);
          return () => {
            cancelado = true;
            window.removeEventListener("biblioteca:perfil-cambiado", escucharPerfil);
          };
        }, []);

        const resumen = estadisticas?.resumen || estadisticas || {};
        const categorias = estadisticas?.progresoPorCategoria || [];
        const actividades = estadisticas?.actividadReciente || [];
        const librosPorCompletar = estadisticas?.librosPorCompletar || [];
        const cantidadExamenes = Number(resumen.totalExamenes) || 0;
        const cantidadAprobados = Number(resumen.examenesAprobados) || 0;

        /** Acota el ancho de la barra a un valor porcentual válido. */
        function porcentajeSeguro(valor) {
          return Math.min(100, Math.max(0, Number(valor) || 0));
        }

        /** Elige rojo, amarillo o verde con los intervalos pedidos. */
        function colorDePorcentaje(valor) {
          if (valor < 30) return "rojo";
          if (valor <= 70) return "amarillo";
          return "verde";
        }

        /** Asigna un pictograma de actividad según el tipo que entrega la API. */
        function iconoDeActividad(tipo) {
          if (tipo === "examen") return "examen";
          if (tipo === "modulo") return "check";
          return "libro";
        }

        return (
          <section className="dashboard" aria-labelledby="titulo-dashboard">
            <header className="dashboard-encabezado">
              <div>
                <p className="dashboard-sobrelinea">Tu biblioteca personal</p>
                <h2 className="dashboard-titulo" id="titulo-dashboard">Dashboard</h2>
                <p className="dashboard-descripcion">Un resumen de tus lecturas, avances y resultados.</p>
              </div>
            </header>

            {error && <p className="dashboard-error" role="alert">{error}</p>}

            {cargando ? (
              <div className="dashboard-cargando" role="status">
                <span className="indicador-carga" /> Cargando tus estadísticas…
              </div>
            ) : estadisticas ? (
              <>
                <div className="dashboard-tarjetas" aria-label="Resumen de lectura">
                  <TarjetaResumenDashboard
                    icono="libro"
                    etiqueta="Total de libros"
                    valor={Number(resumen.totalLibros) || 0}
                    ayuda="en la biblioteca"
                  />
                  <TarjetaResumenDashboard
                    icono="grafico"
                    etiqueta="Libros en progreso"
                    valor={Number(resumen.librosEnProgreso) || 0}
                    ayuda={`Promedio de avance: ${Number(resumen.porcentajePromedioEnProgreso) || 0}%`}
                  />
                  <TarjetaResumenDashboard
                    icono="check"
                    etiqueta="Libros completados"
                    valor={Number(resumen.librosCompletados ?? resumen.librosLeidos) || 0}
                    ayuda="lecturas finalizadas"
                  />
                  <TarjetaResumenDashboard
                    icono="trofeo"
                    etiqueta="Exámenes aprobados"
                    valor={`${cantidadAprobados} / ${cantidadExamenes}`}
                    ayuda="aprobado con 70% o más"
                  />
                </div>

                <section className="dashboard-panel dashboard-categorias" aria-labelledby="titulo-progreso-categorias">
                  <header className="dashboard-panel-cabecera">
                    <div>
                      <h3 className="dashboard-panel-titulo" id="titulo-progreso-categorias">Progreso por categoría</h3>
                      <p className="dashboard-panel-ayuda">Porcentaje promedio de lectura por categoría.</p>
                    </div>
                  </header>
                  {categorias.length ? (
                    <div className="dashboard-lista-categorias">
                      {categorias.map((categoria) => {
                        const porcentaje = porcentajeSeguro(categoria.porcentajePromedio);
                        return (
                          <div className="dashboard-categoria" key={categoria.categoriaId}>
                            <span className="dashboard-categoria-nombre">{categoria.nombre}</span>
                            <div
                              className="dashboard-categoria-pista"
                              role="progressbar"
                              aria-label={`Progreso promedio de ${categoria.nombre}`}
                              aria-valuemin="0"
                              aria-valuemax="100"
                              aria-valuenow={porcentaje}
                            >
                              <div
                                className={`dashboard-categoria-relleno ${colorDePorcentaje(porcentaje)}`}
                                style={{ width: `${porcentaje}%` }}
                              />
                            </div>
                            <span className="dashboard-categoria-porcentaje">{porcentaje}%</span>
                          </div>
                        );
                      })}
                    </div>
                  ) : (
                    <p className="dashboard-vacio" role="status">Todavía no hay categorías para mostrar.</p>
                  )}
                </section>

                <div className="dashboard-paneles-inferiores">
                  <section className="dashboard-panel" aria-labelledby="titulo-actividad-reciente">
                    <header className="dashboard-panel-cabecera">
                      <div>
                        <h3 className="dashboard-panel-titulo" id="titulo-actividad-reciente">Actividad reciente</h3>
                        <p className="dashboard-panel-ayuda">Tus últimas lecturas, exámenes y módulos completados.</p>
                      </div>
                    </header>
                    {actividades.length ? (
                      <div className="dashboard-lista-actividad">
                        {actividades.slice(0, 10).map((actividad) => (
                          <article className="dashboard-actividad" key={actividad.id}>
                            <span className={`dashboard-actividad-icono ${actividad.tipo || "lectura"}`}>
                              <Icono nombre={iconoDeActividad(actividad.tipo)} tamano={15} />
                            </span>
                            <div className="dashboard-actividad-texto">
                              <p className="dashboard-actividad-descripcion">{actividad.descripcion}</p>
                              <button
                                className="dashboard-enlace-libro"
                                type="button"
                                onClick={() => alAbrirLibro(actividad.libroId)}
                              >
                                {actividad.libroTitulo}
                              </button>
                            </div>
                            <time className="dashboard-actividad-fecha" dateTime={actividad.fecha} title={formatearFechaHora(actividad.fecha)}>
                              {formatearTiempoRelativo(actividad.fecha)}
                            </time>
                          </article>
                        ))}
                      </div>
                    ) : (
                      <p className="dashboard-vacio" role="status">Tu actividad aparecerá aquí cuando avances en una lectura o rindas un examen.</p>
                    )}
                  </section>

                  <section className="dashboard-panel" aria-labelledby="titulo-libros-pendientes">
                    <header className="dashboard-panel-cabecera">
                      <div>
                        <h3 className="dashboard-panel-titulo" id="titulo-libros-pendientes">Libros por completar</h3>
                        <p className="dashboard-panel-ayuda">Lecturas en curso, ordenadas por avance.</p>
                      </div>
                    </header>
                    {librosPorCompletar.length ? (
                      <div className="dashboard-lista-libros">
                        {librosPorCompletar.map((libro) => {
                          const porcentaje = porcentajeSeguro(libro.porcentaje);
                          return (
                            <article className="dashboard-libro" key={libro.libroId}>
                              <div className="dashboard-libro-cabecera">
                                <button
                                  className="dashboard-libro-titulo dashboard-enlace-libro"
                                  type="button"
                                  onClick={() => alAbrirLibro(libro.libroId)}
                                >
                                  {libro.titulo}
                                </button>
                                <span className="dashboard-libro-porcentaje">{porcentaje}%</span>
                              </div>
                              <div className="dashboard-libro-pista" role="progressbar" aria-label={`Progreso de ${libro.titulo}`} aria-valuemin="0" aria-valuemax="100" aria-valuenow={porcentaje}>
                                <div className="dashboard-libro-relleno" style={{ width: `${porcentaje}%` }} />
                              </div>
                              {libro.siguienteRecordatorio ? (
                                <p className="dashboard-libro-recordatorio">
                                  <Icono nombre="campana" tamano={12} />
                                  <span>
                                    {libro.siguienteRecordatorio.mensaje} · {formatearTiempoRelativo(libro.siguienteRecordatorio.fechaHora)}
                                  </span>
                                </p>
                              ) : (
                                <p className="dashboard-libro-recordatorio">Sin recordatorio próximo</p>
                              )}
                            </article>
                          );
                        })}
                      </div>
                    ) : (
                      <p className="dashboard-vacio" role="status">No tienes lecturas en progreso.</p>
                    )}
                  </section>
                </div>
              </>
            ) : (
              <div className="dashboard-vacio" role="status">No hay datos de lectura disponibles.</div>
            )}
          </section>
        );
      }

      /** Modal para administrar perfiles de usuario, roles y crear nuevos perfiles. */
      function ModalGestionUsuarios({ abierto, alCerrar, usuarios, usuarioActivo, alSeleccionarUsuario, alCrearUsuario, alEliminarUsuario }) {
        const [nombre, establecerNombre] = React.useState("");
        const [avatarColor, establecerColor] = React.useState("#4a90e2");
        const [rol, establecerRol] = React.useState("lector");
        const [creando, establecerCreando] = React.useState(false);
        const [guardando, establecerGuardando] = React.useState(false);

        const colores = ["#e2b04a", "#6179c9", "#48bb78", "#ed8936", "#9f7aea", "#e53e3e", "#38b2ac", "#319795"];
        const esAdmin = usuarioActivo?.rol === "admin";

        async function enviarNuevoUsuario(e) {
          e.preventDefault();
          if (!nombre.trim()) return;
          establecerGuardando(true);
          try {
            await alCrearUsuario({ nombre: nombre.trim(), avatarColor, rol });
            establecerNombre("");
            establecerCreando(false);
          } catch (err) {
            // Ya notificado
          } finally {
            establecerGuardando(false);
          }
        }

        return (
          <Modal abierto={abierto} titulo="Perfiles y Roles de Usuario" alCerrar={alCerrar} clase="modal-usuarios">
            <div className="gestion-usuarios-contenido">
              <p className="descripcion-modal-usuarios">
                Cada usuario tiene su propio progreso de lectura independiente, historial de evaluaciones y recordatorios.
                Los administradores pueden gestionar libros, categorías y usuarios.
              </p>

              <div className="lista-usuarios-modal">
                {usuarios.map((u) => {
                  const esActual = u.id === usuarioActivo?.id;
                  return (
                    <div key={u.id} className={`item-usuario-modal ${esActual ? "activo" : ""}`}>
                      <div className="avatar-usuario-modal" style={{ backgroundColor: u.avatarColor }}>
                        {u.nombre.split(/\s+/u).map((p) => p[0]).join("").slice(0, 2).toLocaleUpperCase("es")}
                      </div>
                      <div className="info-usuario-modal">
                        <strong className="nombre-usuario-modal">{u.nombre}</strong>
                        <span className={`badge-rol badge-rol-${u.rol || "lector"}`}>
                          {u.rol === "admin" ? "👑 Administrador" : "📖 Lector"}
                        </span>
                      </div>
                      <div className="acciones-usuario-modal">
                        {esActual ? (
                          <span className="etiqueta-activo">✓ Activo</span>
                        ) : (
                          <button
                            type="button"
                            className="boton boton-mini boton-primario"
                            onClick={() => {
                              alSeleccionarUsuario(u.id);
                              alCerrar();
                            }}
                          >
                            Usar perfil
                          </button>
                        )}
                        {esAdmin && !esActual && (
                          <button
                            type="button"
                            className="boton boton-mini boton-peligro-mini"
                            title={`Eliminar usuario ${u.nombre}`}
                            onClick={() => {
                              if (window.confirm(`¿Seguro que deseas eliminar al usuario "${u.nombre}"?`)) {
                                alEliminarUsuario(u.id);
                              }
                            }}
                          >
                            <Icono nombre="eliminar" tamano={13} />
                          </button>
                        )}
                      </div>
                    </div>
                  );
                })}
              </div>

              {esAdmin ? (
                <div className="seccion-crear-usuario">
                  {!creando ? (
                    <button
                      type="button"
                      className="boton boton-secundario boton-expandir-crear-usuario"
                      onClick={() => establecerCreando(true)}
                    >
                      <Icono nombre="mas" tamano={14} /> <span>Crear nuevo perfil con rol</span>
                    </button>
                  ) : (
                    <form className="formulario-crear-usuario" onSubmit={enviarNuevoUsuario}>
                      <h4>Nuevo perfil de usuario</h4>
                      <div className="formulario-fila">
                        <label className="campo-admin">Nombre
                          <input
                            required
                            maxLength="50"
                            placeholder="Nombre del lector o administrador"
                            value={nombre}
                            onChange={(e) => establecerNombre(e.target.value)}
                          />
                        </label>
                      </div>
                      <div className="formulario-fila formulario-fila-doble">
                        <label className="campo-admin">Rol
                          <select value={rol} onChange={(e) => establecerRol(e.target.value)}>
                            <option value="lector">📖 Lector (Lectura y progreso)</option>
                            <option value="admin">👑 Administrador (Acceso total)</option>
                          </select>
                        </label>
                        <div className="campo-admin">
                          <label>Color de avatar</label>
                          <div className="paleta-colores-avatar">
                            {colores.map((c) => (
                              <button
                                key={c}
                                type="button"
                                className={`muestra-color ${avatarColor === c ? "seleccionado" : ""}`}
                                style={{ backgroundColor: c }}
                                onClick={() => establecerColor(c)}
                              />
                            ))}
                          </div>
                        </div>
                      </div>
                      <div className="formulario-acciones">
                        <button type="button" className="boton boton-mini" onClick={() => establecerCreando(false)}>
                          Cancelar
                        </button>
                        <button type="submit" className="boton boton-mini boton-primario" disabled={guardando}>
                          {guardando ? "Creando…" : "Guardar usuario"}
                        </button>
                      </div>
                    </form>
                  )}
                </div>
              ) : (
                <p className="nota-lector-usuarios">
                  ℹ️ Estás navegando como <strong>Lector</strong>. Para crear o eliminar usuarios, libros o categorías, cambia al perfil de <strong>Administrador</strong>.
                </p>
              )}
            </div>
          </Modal>
        );
      }

      /** Controla filtros, consulta servicios y compone la vista principal. */
      function AplicacionBiblioteca() {
        const [modoConexion, establecerModoConexion] = React.useState(modoConexionActual);
        const [estadoConexionMcp, establecerEstadoConexionMcp] = React.useState(
          modoConexionActual === "mcp" ? "conectando" : "desconectado",
        );
        const [notificacion, establecerNotificacion] = React.useState(null);
        const [usuarios, establecerUsuarios] = React.useState([]);
        const [usuarioId, establecerUsuarioId] = React.useState(usuarioIdActual);
        const [categorias, establecerCategorias] = React.useState([]);
        const [libros, establecerLibros] = React.useState([]);
        const [busqueda, establecerBusqueda] = React.useState("");
        const [categoriaSeleccionada, seleccionarCategoria] = React.useState(null);
        const [libroSeleccionado, seleccionarLibro] = React.useState(null);
        const [dashboardActivo, establecerDashboardActivo] = React.useState(false);
        const [modalLibroAbierto, establecerModalLibroAbierto] = React.useState(false);
        const [libroEditando, establecerLibroEditando] = React.useState(null);
        const [cargando, establecerCarga] = React.useState(true);
        const [error, establecerError] = React.useState("");

        /** Sustituye el aviso anterior para mantener un área de feedback legible. */
        const notificar = React.useCallback((mensaje, tipo = "exito") => {
          establecerNotificacion({ id: Date.now() + Math.random(), mensaje: String(mensaje), tipo });
        }, []);
        const cerrarNotificacion = React.useCallback(() => establecerNotificacion(null), []);

        /** Sincroniza el identificador activo con los perfiles servidos por el backend. */
        React.useEffect(() => {
          let cancelado = false;
          serviciosApi.obtenerUsuarios()
            .then((perfiles) => {
              if (cancelado) return;
              establecerUsuarios(perfiles);
              if (perfiles.length && !perfiles.some((perfil) => perfil.id === usuarioIdActual)) {
                const primerPerfil = perfiles[0];
                usuarioIdActual = primerPerfil.id;
                guardarUsuarioId(primerPerfil.id);
                establecerUsuarioId(primerPerfil.id);
              }
            })
            .catch((fallo) => {
              if (!cancelado) notificar(fallo.message || "No se pudieron cargar los perfiles.", "error");
            });
          return () => { cancelado = true; };
        }, [modoConexion, notificar]);

        const [modalUsuariosAbierto, establecerModalUsuariosAbierto] = React.useState(false);

        const usuarioActivo = usuarios.find((perfil) => perfil.id === usuarioId) || usuarios[0];
        const esAdmin = usuarioActivo?.rol === "admin";

        /** Alterna entre los perfiles disponibles y actualiza los paneles visibles. */
        function cambiarPerfil() {
          if (usuarios.length < 2) return;
          const indiceActual = usuarios.findIndex((perfil) => perfil.id === usuarioId);
          const siguiente = usuarios[(indiceActual + 1 + usuarios.length) % usuarios.length];
          usuarioIdActual = siguiente.id;
          guardarUsuarioId(siguiente.id);
          establecerUsuarioId(siguiente.id);
          avisarCambioPerfil();
          notificar(`Perfil activo: ${siguiente.nombre} (${siguiente.rol === "admin" ? "👑 Administrador" : "📖 Lector"}).`);
        }

        function cambiarPerfilAId(id) {
          const siguiente = usuarios.find((perfil) => perfil.id === id);
          if (!siguiente) return;
          usuarioIdActual = siguiente.id;
          guardarUsuarioId(siguiente.id);
          establecerUsuarioId(siguiente.id);
          avisarCambioPerfil();
          notificar(`Perfil activo: ${siguiente.nombre} (${siguiente.rol === "admin" ? "👑 Administrador" : "📖 Lector"}).`);
        }

        async function crearNuevoUsuario(datos) {
          try {
            const creado = await serviciosApi.crearUsuario(datos);
            establecerUsuarios((prev) => [...prev, creado]);
            notificar(`Usuario "${creado.nombre}" creado con rol ${creado.rol === "admin" ? "👑 Administrador" : "📖 Lector"}.`);
            return creado;
          } catch (fallo) {
            notificar(fallo.message || "No se pudo crear el usuario.", "error");
            throw fallo;
          }
        }

        async function eliminarPerfilUsuario(id) {
          try {
            await serviciosApi.eliminarUsuario(id);
            establecerUsuarios((prev) => prev.filter((u) => u.id !== id));
            notificar("Perfil de usuario eliminado.");
          } catch (fallo) {
            notificar(fallo.message || "No se pudo eliminar el usuario.", "error");
          }
        }

        async function eliminarLibro(libro) {
          try {
            await serviciosApi.eliminarLibro(libro.id);
            establecerLibros((actuales) => actuales.filter((l) => l.id !== libro.id));
            if (libroSeleccionado?.id === libro.id) {
              seleccionarLibro(null);
            }
            serviciosApi.obtenerCategorias().then(establecerCategorias).catch(() => {});
            notificar(`Libro "${libro.titulo}" eliminado con éxito.`);
          } catch (fallo) {
            notificar(fallo.message || "No se pudo eliminar el libro.", "error");
          }
        }

        async function eliminarCategoria(categoria) {
          try {
            await serviciosApi.eliminarCategoria(categoria.id);
            establecerCategorias((actuales) => actuales.filter((c) => c.id !== categoria.id));
            if (categoriaSeleccionada === categoria.id) {
              seleccionarCategoria(null);
            }
            serviciosApi.obtenerLibros({ busqueda: busqueda.trim() }).then(establecerLibros).catch(() => {});
            if (libroSeleccionado?.categoriaId === categoria.id) {
              seleccionarLibro(null);
            }
            notificar(`Categoría "${categoria.nombre}" eliminada con éxito.`);
          } catch (fallo) {
            notificar(fallo.message || "No se pudo eliminar la categoría.", "error");
          }
        }

        /** Comprueba una conexión MCP recordada y vuelve a REST si no está disponible. */
        React.useEffect(() => {
          if (modoConexion !== "mcp") {
            establecerEstadoConexionMcp("desconectado");
            return undefined;
          }

          let cancelado = false;
          establecerEstadoConexionMcp("conectando");
          obtenerClienteMcp()
            .then(() => {
              if (!cancelado) establecerEstadoConexionMcp("conectado");
            })
            .catch((fallo) => {
              if (cancelado) return;
              modoConexionActual = "rest";
              guardarModoConexion("rest");
              establecerModoConexion("rest");
              establecerEstadoConexionMcp("error");
              avisarCambioModoConexion();
              notificar(fallo.message || "No se pudo conectar con MCP.", "error");
            });
          return () => { cancelado = true; };
        }, [modoConexion, notificar]);

        /** Conecta al servidor al activar MCP o vuelve al transporte REST. */
        async function cambiarModoConexion() {
          if (modoConexion === "mcp") {
            modoConexionActual = "rest";
            guardarModoConexion("rest");
            establecerModoConexion("rest");
            establecerEstadoConexionMcp("desconectado");
            avisarCambioModoConexion();
            notificar("Conexión mediante API REST.");
            return;
          }

          establecerEstadoConexionMcp("conectando");
          try {
            await obtenerClienteMcp();
            modoConexionActual = "mcp";
            guardarModoConexion("mcp");
            establecerModoConexion("mcp");
            establecerEstadoConexionMcp("conectado");
            avisarCambioModoConexion();
            notificar("Conexión MCP activa.");
          } catch (fallo) {
            establecerEstadoConexionMcp("error");
            notificar(fallo.message || "No se pudo conectar con MCP.", "error");
          }
        }

        React.useEffect(() => {
          let cancelado = false;
          serviciosApi.obtenerCategorias()
            .then((resultado) => { if (!cancelado) establecerCategorias(resultado); })
            .catch((fallo) => {
              if (!cancelado) {
                establecerError(fallo.message);
                notificar(fallo.message, "error");
              }
            });
          return () => { cancelado = true; };
        }, [modoConexion]);

        React.useEffect(() => {
          let cancelado = false;
          establecerCarga(true);
          establecerError("");
          serviciosApi.obtenerLibros({ busqueda: busqueda.trim(), categoriaId: categoriaSeleccionada })
            .then((resultado) => { if (!cancelado) establecerLibros(resultado); })
            .catch((fallo) => {
              if (!cancelado) {
                establecerError(fallo.message);
                notificar(fallo.message, "error");
              }
            })
            .finally(() => { if (!cancelado) establecerCarga(false); });
          return () => { cancelado = true; };
        }, [busqueda, categoriaSeleccionada, modoConexion, usuarioId]);

        const categoriaActiva = categorias.find((categoria) => categoria.id === categoriaSeleccionada);
        const tituloGrid = categoriaActiva ? categoriaActiva.nombre : "Todos los libros";

        const actualizarAvanceEnCatalogo = React.useCallback((libroId, progreso) => {
          establecerLibros((actuales) => actuales.map((libro) =>
            libro.id === libroId
              ? { ...libro, porcentaje: progreso.porcentaje }
              : libro,
          ));
        }, []);

        /** Al elegir una categoría se vuelve al catálogo antes de aplicar el filtro. */
        const seleccionarCategoriaEnCatalogo = React.useCallback((categoriaId) => {
          seleccionarCategoria(categoriaId);
          establecerDashboardActivo(false);
        }, []);

        const [autoExplorarPdf, establecerAutoExplorarPdf] = React.useState(false);

        /** Abre el formulario vacío o precargado para crear o editar un libro. */
        function abrirFormularioLibro(libro = null, explorarPdf = false) {
          establecerLibroEditando(libro);
          establecerAutoExplorarPdf(explorarPdf);
          establecerModalLibroAbierto(true);
        }

        /** Cierra el modal y libera el libro que estaba en edición. */
        function cerrarFormularioLibro() {
          establecerModalLibroAbierto(false);
          establecerLibroEditando(null);
          establecerAutoExplorarPdf(false);
        }

        /** Persiste el libro y vuelve a consultar las tarjetas y conteos visibles. */
        async function guardarLibro(datos, libroId) {
          establecerError("");
          const libroGuardado = libroId === undefined
            ? await serviciosApi.crearLibro(datos)
            : await serviciosApi.actualizarLibro(libroId, datos);
          const libroPrevio = libros.find((elemento) => elemento.id === libroGuardado.id);
          const categoria = categorias.find((elemento) => elemento.id === libroGuardado.categoriaId);
          const tarjetaActualizada = {
            ...libroGuardado,
            categoriaNombre: categoria?.nombre || libroPrevio?.categoriaNombre || "Sin categoría",
            categoriaIcono: categoria?.icono || libroPrevio?.categoriaIcono || "📚",
            porcentaje: libroPrevio?.porcentaje || 0,
          };
          const textoBusqueda = busqueda.trim().normalize("NFD").replace(/[\u0300-\u036f]/gu, "").toLocaleLowerCase("es-AR");
          const coincideBusqueda = [tarjetaActualizada.titulo, tarjetaActualizada.autor, tarjetaActualizada.categoriaNombre]
            .some((campo) => String(campo || "").normalize("NFD").replace(/[\u0300-\u036f]/gu, "").toLocaleLowerCase("es-AR").includes(textoBusqueda));

          // La tarjeta también se actualiza en memoria si falla la recarga posterior.
          establecerLibros((actuales) => {
            const resto = actuales.filter((elemento) => elemento.id !== tarjetaActualizada.id);
            if ((categoriaSeleccionada !== null && categoriaSeleccionada !== tarjetaActualizada.categoriaId) || !coincideBusqueda) {
              return resto;
            }
            return [tarjetaActualizada, ...resto].sort((primero, segundo) => primero.titulo.localeCompare(segundo.titulo, "es", { sensitivity: "base" }));
          });

          // El CRUD ya quedó guardado; se intenta refrescar además los conteos.
          try {
            const [librosActualizados, categoriasActualizadas] = await Promise.all([
              serviciosApi.obtenerLibros({ busqueda: busqueda.trim(), categoriaId: categoriaSeleccionada }),
              serviciosApi.obtenerCategorias(),
            ]);
            establecerLibros(librosActualizados);
            establecerCategorias(categoriasActualizadas);
          } catch { /* La tarjeta local ya refleja la respuesta del CRUD. */ }
          return libroGuardado;
        }

        /** Carga un libro enlazado desde la campana y lo abre en la vista de detalle. */
        const abrirLibroDesdeRecordatorio = React.useCallback(async (libroId) => {
          try {
            const libro = await serviciosApi.obtenerLibroCompleto(libroId);
            let categoria = categorias.find((elemento) => elemento.id === libro.categoriaId);
            if (!categoria) {
              const categoriasActualizadas = await serviciosApi.obtenerCategorias();
              establecerCategorias(categoriasActualizadas);
              categoria = categoriasActualizadas.find((elemento) => elemento.id === libro.categoriaId);
            }
            establecerError("");
            establecerDashboardActivo(false);
            seleccionarLibro({
              ...libro,
              categoriaNombre: categoria?.nombre || "Sin categoría",
              categoriaIcono: categoria?.icono || "📚",
              porcentaje: 0,
            });
          } catch (fallo) {
            const mensaje = fallo.message || "No se pudo abrir el libro del recordatorio.";
            establecerError(mensaje);
            notificar(mensaje, "error");
          }
        }, [categorias]);

        function manejarCategoriaCreada(nuevaCategoria) {
          establecerCategorias((prev) => {
            if (prev.some((c) => c.id === nuevaCategoria.id)) return prev;
            return [...prev, { ...nuevaCategoria, cantidadLibros: 0 }];
          });
        }

        return (
          <ContextoNotificaciones.Provider value={notificar}>
          <Layout
            categorias={categorias}
            alCrearCategoria={manejarCategoriaCreada}
            alEliminarCategoria={eliminarCategoria}
            categoriaSeleccionada={categoriaSeleccionada}
            alSeleccionarCategoria={seleccionarCategoriaEnCatalogo}
            cantidadTotal={categorias.reduce((total, categoria) => total + Number(categoria.cantidadLibros || 0), 0)}
            alAbrirLibroRecordatorio={abrirLibroDesdeRecordatorio}
            dashboardActivo={dashboardActivo}
            alCambiarDashboard={() => establecerDashboardActivo((actual) => !actual)}
            catalogoActivo={!dashboardActivo && !libroSeleccionado}
            alAgregarLibro={(explorarPdf) => abrirFormularioLibro(null, explorarPdf)}
            modoConexion={modoConexion}
            estadoConexionMcp={estadoConexionMcp}
            alCambiarModoConexion={cambiarModoConexion}
            usuarios={usuarios}
            usuarioActivo={usuarioActivo}
            alCambiarPerfil={cambiarPerfil}
            alAbrirGestionUsuarios={() => establecerModalUsuariosAbierto(true)}
            alIrACatalogo={() => {
              establecerDashboardActivo(false);
              seleccionarLibro(null);
            }}
          >
            <>
              <div
                key={`${modoConexion}-${usuarioId}-${dashboardActivo ? "dashboard" : libroSeleccionado ? `detalle-${libroSeleccionado.id}` : "catalogo"}`}
                className="vista-transicion"
              >
              {dashboardActivo ? (
                <VistaDashboard alAbrirLibro={abrirLibroDesdeRecordatorio} />
              ) : libroSeleccionado ? (
                <VistaDetalleLibro
                  key={libroSeleccionado.id}
                  libroTarjeta={libroSeleccionado}
                  alVolver={() => seleccionarLibro(null)}
                  alCambiarProgreso={actualizarAvanceEnCatalogo}
                  alEditar={abrirFormularioLibro}
                  alEliminar={eliminarLibro}
                  esAdmin={esAdmin}
                />
              ) : (
                <>
                <div className="encabezado-contenido">
                  <div>
                    <p className="sobrelinea">Tu próxima lectura</p>
                    <h2 className="titulo-seccion">Encuentra tu historia</h2>
                    <p className="descripcion-seccion">Un lugar tranquilo para descubrir, aprender y volver a leer.</p>
                  </div>
                  <div className="acciones-catalogo-banner" style={{ display: "flex", gap: "10px", alignItems: "center" }}>
                    <button
                      className="boton boton-primario boton-subir-pdf-destacado"
                      type="button"
                      onClick={() => abrirFormularioLibro(null, true)}
                      title="Cargar documento PDF o TXT desde tu equipo"
                    >
                      <Icono nombre="subir" tamano={17} /> <span>Cargar libro en PDF</span>
                    </button>
                  </div>
                </div>

                <BarraBusqueda
                  valor={busqueda}
                  alCambiar={establecerBusqueda}
                  alLimpiar={() => establecerBusqueda("")}
                />

                <div className="encabezado-grid">
                  <h2>{tituloGrid}</h2>
                  <span className="conteo-libros">
                    {cargando ? "Cargando..." : `${libros.length} ${libros.length === 1 ? "libro" : "libros"}`}
                  </span>
                </div>

                {error ? (
                  <div className="estado-error" role="alert">
                    <div>
                      <span className="estado-icono"><Icono nombre="aviso" tamano={21} /></span>
                      <h3>No se pudo cargar la biblioteca</h3>
                      <p>{error}</p>
                    </div>
                  </div>
                ) : cargando ? (
                  <div className="estado-carga" role="status" aria-label="Cargando libros">
                    <div className="indicador-carga" />
                  </div>
                ) : libros.length === 0 ? (
                  <div className="estado-vacio">
                    <div>
                      <span className="estado-icono"><Icono nombre="brillo" tamano={22} /></span>
                      <h3>No encontramos libros</h3>
                      <p>Prueba otra búsqueda o selecciona una categoría distinta.</p>
                    </div>
                  </div>
                ) : (
                  <div className="rejilla-libros">
                    {libros.map((libro, indice) => (
                      <TarjetaLibro
                        key={libro.id}
                        libro={libro}
                        alAbrir={seleccionarLibro}
                        alEditar={abrirFormularioLibro}
                        alEliminar={eliminarLibro}
                        esAdmin={esAdmin}
                        style={{ "--indice-tarjeta": indice % 8 }}
                      />
                    ))}
                  </div>
                )}
                </>
              )}
              </div>
              <FormularioLibroModal
                abierto={modalLibroAbierto}
                libro={libroEditando}
                categorias={categorias}
                alCerrar={cerrarFormularioLibro}
                alGuardar={guardarLibro}
                alEliminar={eliminarLibro}
                esAdmin={esAdmin}
                alCrearCategoria={manejarCategoriaCreada}
                autoAbrirSelector={autoExplorarPdf}
              />
              <ModalGestionUsuarios
                abierto={modalUsuariosAbierto}
                alCerrar={() => establecerModalUsuariosAbierto(false)}
                usuarios={usuarios}
                usuarioActivo={usuarioActivo}
                alSeleccionarUsuario={cambiarPerfilAId}
                alCrearUsuario={crearNuevoUsuario}
                alEliminarUsuario={eliminarPerfilUsuario}
              />
            </>
          </Layout>
          <ToastGlobal notificacion={notificacion} alCerrar={cerrarNotificacion} />
        </ContextoNotificaciones.Provider>
        );
      }

      ReactDOM.createRoot(document.getElementById("raiz")).render(<AplicacionBiblioteca />);
    </script>

  <script>
    // Babel transforma explícitamente JSX al runtime clásico: React.createElement.
    const fuenteJsx = document.getElementById("codigo-jsx").textContent;
    const resultadoBabel = Babel.transform(fuenteJsx, {
      presets: [["react", { runtime: "classic" }]],
      sourceType: "script",
      filename: "biblioteca.jsx",
    });
    const iniciarReact = new Function("React", "ReactDOM", resultadoBabel.code);
    iniciarReact(window.React, window.ReactDOM);

    // Registro del Service Worker para la Progressive Web App (PWA)
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", () => {
        navigator.serviceWorker.register("/sw.js")
          .then((registro) => {
            console.log("Service Worker registrado con éxito en ámbito:", registro.scope);
          })
          .catch((error) => {
            console.warn("Fallo al registrar el Service Worker:", error);
          });
      });
    }
  </script>
