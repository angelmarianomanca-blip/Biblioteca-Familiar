<!doctype html>
<html lang="es">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#1a1a2e" />
  <!-- Meta-tags para PWA e iOS -->
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="BiblioTeca" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="application-name" content="BiblioTeca" />
  <link rel="manifest" href="/manifest.json" />
  <link rel="icon" type="image/svg+xml" href="/icono.svg" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
  <title>BiblioTeca Digital</title>
  <style>
    :root {
      color-scheme: light;
      --azul-oscuro: #1a1a2e;
      --azul-suave: #292941;
      --dorado: #e2b04a;
      --dorado-claro: #f8edda;
      --blanco: #ffffff;
      --fondo: #f5f6f9;
      --texto: #24243b;
      --texto-suave: #666779;
      --borde: #e9e9ef;
      --sombra: 0 12px 30px rgba(26, 26, 46, 0.07);
      --alto-encabezado: 76px;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont,
        "Segoe UI", sans-serif;
      font-synthesis: none;
      text-rendering: optimizeLegibility;
    }

    *,
    *::before,
    *::after {
      box-sizing: border-box;
    }

    html,
    body,
    #raiz {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      max-width: 100vw;
    }

    body {
      min-width: 320px;
      color: var(--texto);
      background: var(--fondo);
      overflow-x: hidden;
    }

    button,
    input {
      font: inherit;
    }

    button {
      color: inherit;
    }

    .aplicacion {
      display: flex;
      width: 100%;
      max-width: 100vw;
      height: 100vh;
      height: 100dvh;
      min-height: 0;
      flex-direction: column;
      overflow: hidden;
      background: var(--fondo);
    }

    .encabezado {
      position: relative;
      z-index: 2;
      display: flex;
      height: 76px;
      min-height: 76px;
      align-items: center;
      justify-content: space-between;
      padding: 0 34px;
      color: var(--blanco);
      background: var(--azul-oscuro);
      box-shadow: 0 3px 14px rgba(15, 15, 34, 0.16);
    }

    .marca {
      display: flex;
      min-width: 0;
      align-items: center;
      gap: 13px;
    }

    .marca-icono {
      display: grid;
      width: 42px;
      height: 42px;
      flex: 0 0 42px;
      place-items: center;
      border-radius: 13px;
      color: var(--azul-oscuro);
      background: var(--dorado);
      box-shadow: 0 5px 14px rgba(226, 176, 74, 0.22);
    }

    .marca h1 {
      margin: 0;
      color: var(--blanco);
      font-size: 19px;
      font-weight: 700;
      letter-spacing: -0.035em;
    }

    .marca p {
      margin: 3px 0 0;
      color: rgba(255, 255, 255, 0.58);
      font-size: 11px;
      letter-spacing: 0.035em;
    }

    .encabezado-detalle {
      display: flex;
      align-items: center;
      gap: 10px;
      color: rgba(255, 255, 255, 0.72);
      font-size: 12px;
    }

    .encabezado-acciones {
      display: flex;
      align-items: center;
      gap: 22px;
    }

    /* Alterna REST y MCP dentro del mismo grupo visual de acciones. */
    .selector-conexion {
      display: inline-flex;
      min-width: 66px;
      height: 39px;
      align-items: center;
      justify-content: center;
      gap: 7px;
      padding: 0 9px;
      border: 1px solid rgba(255, 255, 255, 0.19);
      border-radius: 12px;
      color: #fff;
      background: rgba(255, 255, 255, 0.08);
      cursor: pointer;
      font-size: 9px;
      font-weight: 760;
      letter-spacing: 0.06em;
      transition: color 140ms ease, background 140ms ease, border-color 140ms ease;
    }

    .selector-conexion:hover,
    .selector-conexion.activo {
      border-color: rgba(226, 176, 74, 0.8);
      color: var(--dorado);
      background: rgba(255, 255, 255, 0.13);
    }

    .selector-conexion:focus-visible {
      outline: 2px solid var(--dorado);
      outline-offset: 3px;
    }

    .selector-conexion:disabled {
      cursor: progress;
      opacity: 0.78;
    }

    .selector-conexion-corto {
      display: none;
    }

    .selector-conexion.error .indicador-conexion {
      background: #f08383;
    }

    .indicador-conexion {
      width: 7px;
      height: 7px;
      flex: 0 0 7px;
      border-radius: 50%;
      background: #a2a3af;
    }

    .selector-conexion.activo .indicador-conexion {
      background: #71d5a0;
      box-shadow: 0 0 0 3px rgba(113, 213, 160, 0.13);
    }

    .selector-conexion.conectando .indicador-conexion {
      border: 1.5px solid rgba(226, 176, 74, 0.35);
      border-top-color: var(--dorado);
      background: transparent;
      animation: girar 700ms linear infinite;
    }

    .selector-perfil {
      display: inline-flex;
      min-width: 38px;
      height: 39px;
      align-items: center;
      gap: 8px;
      padding: 3px 10px 3px 4px;
      border: 1px solid rgba(255, 255, 255, .19);
      border-radius: 13px;
      color: #fff;
      background: rgba(255, 255, 255, .08);
      cursor: pointer;
      transition: background 140ms ease, border-color 140ms ease, transform 140ms ease;
    }

    .selector-perfil:hover {
      transform: translateY(-1px);
      border-color: rgba(226, 176, 74, .8);
      background: rgba(255, 255, 255, .13);
    }

    .selector-perfil:focus-visible {
      outline: 2px solid var(--dorado);
      outline-offset: 3px;
    }

    .avatar-perfil {
      display: grid;
      width: 30px;
      height: 30px;
      flex: 0 0 30px;
      place-items: center;
      border: 1px solid rgba(255, 255, 255, .36);
      border-radius: 50%;
      color: #1a1a2e;
      font-size: 10px;
      font-weight: 850;
      box-shadow: 0 2px 7px rgba(0, 0, 0, .19);
    }

    .nombre-perfil {
      max-width: 75px;
      overflow: hidden;
      font-size: 10px;
      font-weight: 700;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .contenedor-campana {
      position: relative;
    }

    .boton-campana {
      position: relative;
      display: grid;
      width: 39px;
      height: 39px;
      place-items: center;
      border: 1px solid rgba(255, 255, 255, 0.19);
      border-radius: 12px;
      color: #fff;
      background: rgba(255, 255, 255, 0.08);
      cursor: pointer;
      transition: color 140ms ease, background 140ms ease, border-color 140ms ease;
    }

    .boton-campana:hover,
    .boton-campana[aria-expanded="true"] {
      border-color: rgba(226, 176, 74, 0.8);
      color: var(--dorado);
      background: rgba(255, 255, 255, 0.13);
    }

    .boton-dashboard-header {
      display: grid;
      width: 39px;
      height: 39px;
      flex: 0 0 39px;
      place-items: center;
      border: 1px solid rgba(255, 255, 255, 0.19);
      border-radius: 12px;
      color: #fff;
      background: rgba(255, 255, 255, 0.08);
      cursor: pointer;
      transition: color 140ms ease, background 140ms ease, border-color 140ms ease;
    }

    .boton-dashboard-header:hover,
    .boton-dashboard-header.activo {
      border-color: rgba(226, 176, 74, 0.8);
      color: var(--dorado);
      background: rgba(255, 255, 255, 0.13);
    }

    .boton-dashboard-header:focus-visible {
      outline: 2px solid var(--dorado);
      outline-offset: 3px;
    }

    /* Acceso destacado al formulario de catálogo desde la cabecera. */
    .boton-agregar-libro {
      display: inline-flex;
      min-height: 39px;
      align-items: center;
      gap: 7px;
      padding: 0 12px;
      border: 1px solid rgba(226, 176, 74, 0.5);
      border-radius: 11px;
      color: var(--azul-oscuro);
      background: var(--dorado);
      cursor: pointer;
      font-size: 10px;
      font-weight: 760;
      white-space: nowrap;
    }

    .boton-agregar-libro:hover {
      background: #edbd5d;
    }

    .boton-agregar-libro:focus-visible {
      outline: 2px solid var(--dorado);
      outline-offset: 3px;
    }

    .campana-conteo {
      position: absolute;
      top: -5px;
      right: -6px;
      display: grid;
      min-width: 18px;
      height: 18px;
      place-items: center;
      padding: 0 4px;
      border: 2px solid var(--azul-oscuro);
      border-radius: 999px;
      color: var(--azul-oscuro);
      background: var(--dorado);
      font-size: 9px;
      font-weight: 800;
    }

    .panel-recordatorios {
      position: absolute;
      top: calc(100% + 13px);
      right: 0;
      z-index: 30;
      display: grid;
      width: min(380px, calc(100vw - 28px));
      max-height: min(65vh, 490px);
      grid-template-rows: auto minmax(0, 1fr);
      overflow: hidden;
      border: 1px solid #e7e5df;
      border-radius: 15px;
      color: var(--texto);
      background: #fff;
      box-shadow: 0 14px 42px rgba(13, 17, 38, 0.2);
    }

    .panel-recordatorios-cabecera {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 14px 16px;
      border-bottom: 1px solid var(--borde);
    }

    .panel-recordatorios-cabecera h2 {
      margin: 0;
      color: var(--azul-oscuro);
      font-size: 14px;
    }

    .panel-recordatorios-cabecera span {
      color: var(--texto-suave);
      font-size: 10px;
    }

    .lista-recordatorios-pendientes {
      overflow-y: auto;
      padding: 5px 12px 11px;
    }

    .recordatorio-pendiente {
      display: grid;
      gap: 8px;
      padding: 12px 4px;
      border-bottom: 1px solid #f0eff2;
    }

    .recordatorio-pendiente:last-child {
      border-bottom: 0;
    }

    .enlace-libro-recordatorio {
      width: fit-content;
      padding: 0;
      border: 0;
      color: var(--azul-oscuro);
      background: transparent;
      cursor: pointer;
      font-size: 11px;
      font-weight: 750;
      text-align: left;
    }

    .enlace-libro-recordatorio:hover {
      color: #9a6c1c;
      text-decoration: underline;
    }

    .recordatorio-pendiente-mensaje {
      margin: 0;
      color: #555668;
      font-size: 11px;
      line-height: 1.5;
      overflow-wrap: anywhere;
    }

    .recordatorio-pendiente-fecha {
      color: #9293a0;
      font-size: 9px;
    }

    .recordatorio-acciones {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }

    .boton-recordatorio-accion {
      display: inline-flex;
      min-height: 28px;
      align-items: center;
      gap: 5px;
      padding: 0 8px;
      border: 1px solid #e8e8ed;
      border-radius: 8px;
      color: #626376;
      background: #fff;
      cursor: pointer;
      font-size: 9px;
      font-weight: 650;
    }

    .boton-recordatorio-accion:hover {
      border-color: #e2c37d;
      color: var(--azul-oscuro);
      background: #fffaf0;
    }

    .boton-recordatorio-accion:disabled {
      cursor: wait;
      opacity: 0.55;
    }

    .recordatorios-vacios {
      padding: 24px 12px;
      color: var(--texto-suave);
      font-size: 11px;
      line-height: 1.6;
      text-align: center;
    }

    .recordatorios-vacios::before {
      content: "◷";
      display: block;
      margin: 0 auto 7px;
      color: #76571c;
      font-size: 20px;
    }

    .recordatorios-error {
      margin: 8px 12px;
      color: #a44646;
      font-size: 10px;
      line-height: 1.5;
    }

    .avisos-recordatorios {
      position: fixed;
      top: 88px;
      right: 22px;
      z-index: 40;
      display: grid;
      width: min(370px, calc(100vw - 28px));
      gap: 9px;
    }

    /* Los mensajes breves se sitúan sobre la aplicación sin tapar su flujo. */
    .zona-toasts {
      position: fixed;
      top: 88px;
      right: 22px;
      z-index: 60;
      display: grid;
      width: min(360px, calc(100vw - 28px));
      gap: 8px;
      pointer-events: none;
    }

    .toast-notificacion {
      display: grid;
      grid-template-columns: 30px minmax(0, 1fr) 28px;
      align-items: center;
      gap: 10px;
      padding: 12px;
      border: 1px solid #d9e9dd;
      border-radius: 13px;
      color: #183d2b;
      background: #f7fff9;
      box-shadow: 0 10px 28px rgba(26, 26, 46, 0.16);
      animation: entrar-toast 210ms ease-out both;
      pointer-events: auto;
    }

    .toast-notificacion.error {
      border-color: #efd1d1;
      color: #762f34;
      background: #fff8f8;
    }

    .toast-notificacion p {
      margin: 0;
      font-size: 11px;
      line-height: 1.45;
      overflow-wrap: anywhere;
    }

    .toast-icono {
      display: grid;
      width: 30px;
      height: 30px;
      place-items: center;
      border-radius: 50%;
      color: #fff;
      background: #39865d;
    }

    .toast-notificacion.error .toast-icono {
      background: #b34b50;
    }

    .toast-icono.exito svg {
      animation: confirmar-guardado 360ms cubic-bezier(.2, .8, .25, 1.35) both;
    }

    .toast-cerrar {
      display: grid;
      width: 28px;
      height: 28px;
      place-items: center;
      border: 0;
      border-radius: 8px;
      color: inherit;
      background: transparent;
      cursor: pointer;
    }

    .toast-cerrar:hover {
      background: rgba(26, 26, 46, 0.07);
    }

    @keyframes entrar-toast {
      from {
        opacity: 0;
        transform: translateY(-9px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes confirmar-guardado {
      from {
        opacity: 0;
        transform: scale(.3) rotate(-18deg);
      }

      to {
        opacity: 1;
        transform: scale(1) rotate(0);
      }
    }

    .aviso-recordatorio {
      display: grid;
      grid-template-columns: 29px minmax(0, 1fr) 28px;
      align-items: start;
      gap: 10px;
      padding: 13px;
      border: 1px solid #e5d6b7;
      border-radius: 13px;
      background: #fffdf7;
      box-shadow: 0 9px 25px rgba(26, 26, 46, 0.16);
      animation: aparecer-aviso 180ms ease-out;
    }

    .aviso-recordatorio-icono {
      display: grid;
      width: 29px;
      height: 29px;
      place-items: center;
      border-radius: 9px;
      color: #765517;
      background: #f8e9c7;
    }

    .aviso-recordatorio-contenido {
      display: grid;
      gap: 4px;
      min-width: 0;
    }

    .aviso-recordatorio-contenido strong {
      color: var(--azul-oscuro);
      font-size: 10px;
    }

    .aviso-recordatorio-contenido p {
      margin: 0;
      color: #606175;
      font-size: 10px;
      line-height: 1.45;
      overflow-wrap: anywhere;
    }

    .aviso-recordatorio-cerrar {
      display: grid;
      width: 27px;
      height: 27px;
      place-items: center;
      border: 0;
      border-radius: 7px;
      color: #78798a;
      background: transparent;
      cursor: pointer;
    }

    .aviso-recordatorio-cerrar:hover {
      color: var(--azul-oscuro);
      background: #f1eee5;
    }

    @keyframes aparecer-aviso {
      from {
        opacity: 0;
        transform: translateY(-5px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .punto-dorado {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--dorado);
      box-shadow: 0 0 0 4px rgba(226, 176, 74, 0.13);
    }

    .disposicion {
      display: grid;
      min-height: 0;
      flex: 1;
      grid-template-columns: 258px minmax(0, 1fr);
      overflow: hidden;
    }

    .boton-menu-lateral {
      display: none;
    }

    .fondo-menu-lateral {
      display: none;
    }

    .barra-lateral {
      min-height: 0;
      padding: 30px 18px 24px;
      overflow-y: auto;
      border-right: 1px solid var(--borde);
      background: var(--blanco);
    }

    .barra-lateral-etiqueta {
      margin: 0 10px 15px;
      color: #a0a1b0;
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.13em;
      text-transform: uppercase;
    }

    .lista-categorias {
      display: grid;
      gap: 5px;
    }

    .categoria-enlace {
      display: flex;
      width: 100%;
      min-height: 44px;
      align-items: center;
      gap: 11px;
      padding: 0 11px;
      border: 0;
      border-radius: 10px;
      color: #68697d;
      background: transparent;
      cursor: pointer;
      text-align: left;
      transition: color 150ms ease, background 150ms ease, transform 150ms ease;
    }

    .categoria-enlace:hover {
      color: var(--azul-oscuro);
      background: #f7f7fa;
    }

    .categoria-enlace:active {
      transform: scale(0.99);
    }

    .categoria-enlace.activa {
      color: var(--azul-oscuro);
      background: #f8f2e7;
      font-weight: 650;
    }

    .categoria-icono {
      display: grid;
      width: 29px;
      height: 29px;
      flex: 0 0 29px;
      place-items: center;
      border-radius: 9px;
      background: #f3f3f7;
      font-size: 14px;
    }

    .categoria-enlace.activa .categoria-icono {
      background: rgba(226, 176, 74, 0.2);
    }

    .categoria-nombre {
      min-width: 0;
      flex: 1;
      overflow: hidden;
      font-size: 12px;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .categoria-conteo {
      display: grid;
      min-width: 25px;
      height: 23px;
      place-items: center;
      padding: 0 6px;
      border-radius: 7px;
      color: #8c8d9d;
      background: #f3f3f7;
      font-size: 10px;
      font-weight: 650;
    }

    .categoria-enlace.activa .categoria-conteo {
      color: #8a641c;
      background: rgba(226, 176, 74, 0.2);
    }

    .separador-lateral {
      height: 1px;
      margin: 22px 10px;
      background: var(--borde);
    }

    .nota-lateral {
      margin: 0 10px;
      padding: 14px;
      border: 1px solid #f0e8d8;
      border-radius: 12px;
      color: #716b5d;
      background: #fffaf0;
      font-size: 11px;
      line-height: 1.6;
    }

    .nota-lateral strong {
      display: block;
      margin-bottom: 4px;
      color: var(--azul-oscuro);
      font-size: 11px;
    }

    .contenido-principal {
      min-width: 0;
      min-height: 0;
      padding: 31px 38px 38px;
      overflow: auto;
      overscroll-behavior: contain;
    }

    /* Cada cambio de vista entra suavemente y deja el foco en el contenido. */
    .vista-transicion {
      min-height: 100%;
      animation: aparecer-vista 240ms ease-out both;
    }

    @keyframes aparecer-vista {
      from {
        opacity: 0;
        transform: translateY(5px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .encabezado-contenido {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 20px;
      margin-bottom: 22px;
    }

    .sobrelinea {
      margin: 0 0 8px;
      color: #9a7a3d;
      font-size: 10px;
      font-weight: 750;
      letter-spacing: 0.15em;
      text-transform: uppercase;
    }

    .titulo-seccion {
      margin: 0;
      color: var(--azul-oscuro);
      font-size: clamp(23px, 2.5vw, 31px);
      font-weight: 700;
      letter-spacing: -0.055em;
      line-height: 1.15;
    }

    .descripcion-seccion {
      margin: 8px 0 0;
      color: var(--texto-suave);
      font-size: 12px;
    }

    .busqueda {
      display: flex;
      width: min(100%, 480px);
      height: 46px;
      align-items: center;
      gap: 11px;
      margin-bottom: 25px;
      padding: 0 14px;
      border: 1px solid #e7e7ed;
      border-radius: 12px;
      color: #9697a7;
      background: var(--blanco);
      box-shadow: 0 3px 12px rgba(26, 26, 46, 0.025);
      transition: border-color 160ms ease, box-shadow 160ms ease;
    }

    .busqueda:focus-within {
      border-color: rgba(226, 176, 74, 0.8);
      box-shadow: 0 0 0 3px rgba(226, 176, 74, 0.13);
    }

    .busqueda input {
      width: 100%;
      min-width: 0;
      border: 0;
      outline: 0;
      color: var(--texto);
      background: transparent;
      font-size: 12px;
    }

    .busqueda input::placeholder {
      color: #a4a5b1;
    }

    .encabezado-grid {
      display: flex;
      min-height: 26px;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 14px;
    }

    .encabezado-grid h2 {
      margin: 0;
      color: var(--azul-oscuro);
      font-size: 14px;
      font-weight: 700;

    .selector-mapa {
      width: min(100%, 360px);
      height: 38px;
      padding: 0 11px;
      border: 1px solid var(--borde);
      border-radius: 9px;
      outline: none;
      color: var(--azul-oscuro);
      background: var(--blanco);
      font-size: 11px;
    }

    .selector-mapa:focus {
      border-color: var(--dorado);
    }

    .panel-mapa {
      padding: 18px;
    }

    .mapa-titulo {
      margin: 0 0 14px;
      color: var(--azul-oscuro);
      font-size: 14px;
      font-weight: 700;
    }

    .mapa-desplazable {
      width: 100%;
      overflow: auto;
      border: 1px solid #eeeef3;
      border-radius: 12px;
      background-color: #fcfcfe;
      background-image: radial-gradient(#dedfe8 0.8px, transparent 0.8px);
      background-position: 8px 8px;
      background-size: 18px 18px;
    }

    .mapa-lienzo {
      position: relative;
      width: 100%;
      min-width: 650px;
      height: 465px;
    }

    .mapa-lineas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      overflow: visible;
    }

    .mapa-linea {
      stroke: #bd974d;
      stroke-width: 1.7;
      vector-effect: non-scaling-stroke;
      cursor: pointer;
      pointer-events: stroke;
    }

    /* Señales visuales de selección y edición en el mapa interactivo. */
    .mapa-linea.seleccionada {
      stroke: #ad563f;
      stroke-width: 3;
    }

    .mapa-linea-temporal {
      stroke: #9a7a3d;
      stroke-dasharray: 5 4;
      pointer-events: none;
    }

    .mapa-conexion {
      cursor: pointer;
    }

    .mapa-editor-herramientas {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 7px;
      margin: -5px 0 11px;
      color: #858697;
      font-size: 9px;
      line-height: 1.5;
    }

    .estado-cambios-mapa {
      margin: 0 0 10px;
      color: #8b6828;
      font-size: 10px;
    }

    .mapa-lienzo {
      cursor: crosshair;
      touch-action: none;
    }

    .mapa-instruccion-vacia {
      position: absolute;
      top: 50%;
      left: 50%;
      z-index: 0;
      color: #a0a1ae;
      font-size: 11px;
      pointer-events: none;
      transform: translate(-50%, -50%);
      white-space: nowrap;
    }

    .mapa-etiqueta-linea {
      fill: #76602f;
      font-family: Inter, ui-sans-serif, system-ui, sans-serif;
      font-size: 12px;
      font-weight: 600;
      paint-order: stroke;
      stroke: #fcfcfe;
      stroke-linejoin: round;
      stroke-width: 5px;
      text-anchor: middle;
    }

    .mapa-nodo {
      position: absolute;
      z-index: 1;
      display: grid;
      width: 158px;
      min-height: 62px;
      place-items: center;
      padding: 10px 12px;
      transform: translate(-50%, -50%);
      border: 1px solid #ead8b3;
      border-radius: 12px;
      color: var(--azul-oscuro);
      background: #fff;
      box-shadow: 0 5px 16px rgba(26, 26, 46, 0.09);
      font-size: 11px;
      font-weight: 650;
      line-height: 1.4;
      text-align: center;
      cursor: grab;
      user-select: none;
      touch-action: none;
    }

    .mapa-nodo:nth-of-type(even) {
      border-color: #d8dce8;
    }

    .mapa-nodo.seleccionado {
      border-color: var(--dorado);
      box-shadow: 0 0 0 3px rgba(226, 176, 74, 0.19), 0 5px 16px rgba(26, 26, 46, 0.1);
    }

    .mapa-nodo.conectando {
      border-color: #bf765d;
      cursor: crosshair;
    }

    .mapa-nodo-editor {
      width: 100%;
      padding: 5px;
      border: 1px solid var(--dorado);
      border-radius: 6px;
      outline: none;
      color: var(--azul-oscuro);
      background: #fffdf8;
      font: inherit;
      text-align: center;
    }

    .mapa-nodo-eliminar {
      position: absolute;
      top: -8px;
      right: -8px;
      display: grid;
      width: 23px;
      height: 23px;
      place-items: center;
      border: 1px solid #eedada;
      border-radius: 50%;
      color: #9c5353;
      background: #fff;
      box-shadow: 0 2px 6px rgba(26, 26, 46, 0.1);
      cursor: pointer;
      opacity: 0;
      transition: opacity 120ms ease;
    }

    .mapa-nodo:hover .mapa-nodo-eliminar,
    .mapa-nodo.seleccionado .mapa-nodo-eliminar,
    .mapa-nodo-eliminar:focus-visible {
      opacity: 1;
    }

    .progreso-modulos-cabecera {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 10px;
    }

    .progreso-modulos-cabecera h3 {
      margin: 0;
      color: var(--azul-oscuro);
      font-size: 13px;
    }

    .progreso-modulos-cabecera span {
      color: #8b8c9a;
      font-size: 10px;
    }

    .panel-modulos {
      padding: 21px;
    }

    .lista-modulos {
      display: grid;
      margin-top: 15px;
    }

    .fila-modulo {
      display: flex;
      min-height: 67px;
      align-items: center;
      gap: 12px;
      padding: 10px 2px;
      border-bottom: 1px solid #eeeeF2;
    }

    .fila-modulo:last-child {
      border-bottom: 0;
    }

    .checkbox-modulo {
      width: 18px;
      height: 18px;
      flex: 0 0 18px;
      accent-color: #3a9c6c;
    }

    .modulo-titulo {
      min-width: 0;
      flex: 1;
      color: #444558;
      font-size: 12px;
      font-weight: 600;
    }

    .modulo-completado {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      color: #39825d;
      font-size: 10px;
      font-weight: 700;
      white-space: nowrap;
    }

    .modulo-check-verde {
      display: grid;
      width: 20px;
      height: 20px;
      place-items: center;
      border-radius: 50%;
      color: white;
      background: #48a773;
      font-size: 12px;
    }

    .modulo-accion {
      min-height: 31px;
      padding: 0 10px;
      font-size: 10px;
    }

    .detalle-cargando,
    .detalle-vacio {
      display: grid;
      min-height: 240px;
      place-items: center;
      padding: 25px;
      border: 1px solid var(--borde);
      border-radius: 15px;
      color: var(--texto-suave);
      background: var(--blanco);
      text-align: center;
    }

    .detalle-vacio p {
      margin: 0;
      font-size: 12px;
      line-height: 1.6;
    }

    .detalle-vacio::before {
      content: "✦";
      display: grid;
      width: 42px;
      height: 42px;
      place-items: center;
      margin-bottom: 10px;
      border-radius: 14px;
      color: #75551a;
      background: #fbf1dc;
      font-size: 20px;
    }

    .boton-mini {
      min-height: 31px;
      border: 1px solid var(--borde);
      color: #68697d;
      background: #fff;
      font-size: 10px;
    }

    .boton-mini:hover {
      border-color: #e5cc98;
      background: #fffaf0;
    }

    .dashboard {
      width: min(100%, 1280px);
      margin: 0 auto;
      padding-bottom: 20px;
    }

    .dashboard-encabezado {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 18px;
      margin-bottom: 21px;
    }

    .dashboard-sobrelinea {
      margin: 0 0 7px;
      color: #9a7a3d;
      font-size: 10px;
      font-weight: 750;
      letter-spacing: 0.14em;
      text-transform: uppercase;
    }

    .dashboard-titulo {
      margin: 0;
      color: var(--azul-oscuro);
      font-size: clamp(24px, 2.6vw, 32px);
      font-weight: 760;
      letter-spacing: -0.055em;
    }

    .dashboard-descripcion {
      margin: 7px 0 0;
      color: var(--texto-suave);
      font-size: 12px;
      line-height: 1.55;
    }

    .dashboard-tarjetas {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 14px;
      margin-bottom: 16px;
    }

    .dashboard-tarjeta {
      display: grid;
      min-height: 125px;
      grid-template-columns: 43px minmax(0, 1fr);
      align-content: center;
      align-items: start;
      gap: 10px 12px;
      padding: 18px;
      border: 1px solid #e9e9ef;
      border-radius: 15px;
      background: #fff;
      box-shadow: 0 8px 23px rgba(26, 26, 46, 0.055);
    }

    .dashboard-tarjeta-icono {
      display: grid;
      width: 43px;
      height: 43px;
      grid-row: span 2;
      place-items: center;
      border-radius: 13px;
      color: #765517;
      background: #fbf1dc;
    }

    .dashboard-tarjeta:nth-child(2) .dashboard-tarjeta-icono {
      color: #596c9b;
      background: #edf0f8;
    }

    .dashboard-tarjeta:nth-child(3) .dashboard-tarjeta-icono {
      color: #39825d;
      background: #eaf5ee;
    }

    .dashboard-tarjeta:nth-child(4) .dashboard-tarjeta-icono {
      color: #896922;
      background: #fbf2dd;
    }

    .dashboard-tarjeta-etiqueta {
      align-self: end;
      color: #77788b;
      font-size: 10px;
      font-weight: 650;
      line-height: 1.35;
    }

    .dashboard-tarjeta-valor {
      align-self: start;
      color: var(--azul-oscuro);
      font-size: 27px;
      font-weight: 780;
      letter-spacing: -0.045em;
      line-height: 1;
    }

    .dashboard-tarjeta-ayuda {
      grid-column: 2;
      margin-top: -3px;
      color: #9293a1;
      font-size: 9px;
      line-height: 1.4;
    }

    .dashboard-panel {
      min-width: 0;
      padding: 20px;
      border: 1px solid #e9e9ef;
      border-radius: 15px;
      background: #fff;
      box-shadow: 0 8px 23px rgba(26, 26, 46, 0.055);
    }

    .dashboard-panel-cabecera {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 17px;
    }

    .dashboard-panel-titulo {
      margin: 0;
      color: var(--azul-oscuro);
      font-size: 13px;
      font-weight: 740;
    }

    .dashboard-panel-ayuda {
      margin: 5px 0 0;
      color: #9293a1;
      font-size: 9px;
      line-height: 1.5;
    }

    .dashboard-categorias {
      margin-bottom: 16px;
    }

    .dashboard-lista-categorias {
      display: grid;
      gap: 15px;
    }

    .dashboard-categoria {
      display: grid;
      grid-template-columns: minmax(95px, 160px) minmax(70px, 1fr) 42px;
      align-items: center;
      gap: 12px;
    }

    .dashboard-categoria-nombre {
      overflow: hidden;
      color: #4e4f62;
      font-size: 10px;
      font-weight: 650;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .dashboard-categoria-pista {
      height: 9px;
      overflow: hidden;
      border-radius: 999px;
      background: #f0f0f4;
    }

    .dashboard-categoria-relleno {
      height: 100%;
      min-width: 0;
      border-radius: inherit;
      transition: width 250ms ease;
    }

    .dashboard-categoria-relleno.rojo {
      background: #d76e6b;
    }

    .dashboard-categoria-relleno.amarillo {
      background: #e2b04a;
    }

    .dashboard-categoria-relleno.verde {
      background: #57a879;
    }

    .dashboard-categoria-porcentaje {
      color: #77788b;
      font-size: 9px;
      font-weight: 700;
      text-align: right;
    }

    .dashboard-paneles-inferiores {
      display: grid;
      grid-template-columns: minmax(0, 1.1fr) minmax(0, 0.9fr);
      align-items: start;
      gap: 16px;
    }

    .dashboard-lista-actividad {
      display: grid;
    }

    .dashboard-actividad {
      display: grid;
      min-width: 0;
      grid-template-columns: 31px minmax(0, 1fr) auto;
      align-items: start;
      gap: 10px;
      padding: 11px 0;
      border-bottom: 1px solid #f0f0f3;
    }

    .dashboard-actividad:first-child {
      padding-top: 0;
    }

    .dashboard-actividad:last-child {
      padding-bottom: 0;
      border-bottom: 0;
    }

    .dashboard-actividad-icono {
      display: grid;
      width: 31px;
      height: 31px;
      place-items: center;
      border-radius: 10px;
      color: #765517;
      background: #fbf1dc;
    }

    .dashboard-actividad-icono.examen {
      color: #596c9b;
      background: #edf0f8;
    }

    .dashboard-actividad-icono.modulo {
      color: #39825d;
      background: #eaf5ee;
    }

    .dashboard-actividad-texto {
      min-width: 0;
    }

    .dashboard-actividad-descripcion {
      margin: 0;
      color: #555668;
      font-size: 10px;
      line-height: 1.5;
      overflow-wrap: anywhere;
    }

    .dashboard-enlace-libro {
      display: block;
      max-width: 100%;
      margin: 3px 0 0;
      padding: 0;
      overflow: hidden;
      border: 0;
      color: var(--azul-oscuro);
      background: transparent;
      cursor: pointer;
      font-size: 9px;
      font-weight: 720;
      text-align: left;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .dashboard-enlace-libro:hover {
      color: #9a6c1c;
      text-decoration: underline;
    }

    .dashboard-actividad-fecha {
      padding-top: 2px;
      color: #9293a1;
      font-size: 8px;
      white-space: nowrap;
    }

    .dashboard-lista-libros {
      display: grid;
    }

    .dashboard-libro {
      padding: 12px 0;
      border-bottom: 1px solid #f0f0f3;
    }

    .dashboard-libro:first-child {
      padding-top: 0;
    }

    .dashboard-libro:last-child {
      padding-bottom: 0;
      border-bottom: 0;
    }

    .dashboard-libro-cabecera {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 10px;
    }

    .dashboard-libro-titulo {
      min-width: 0;
      margin: 0;
      overflow: hidden;
      color: var(--azul-oscuro);
      font-size: 10px;
      font-weight: 710;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .dashboard-libro-porcentaje {
      flex: 0 0 auto;
      color: #77788b;
      font-size: 9px;
      font-weight: 720;
    }

    .dashboard-libro-pista {
      height: 6px;
      margin-top: 8px;
      overflow: hidden;
      border-radius: 999px;
      background: #efeff3;
    }

    .dashboard-libro-relleno {
      height: 100%;
      border-radius: inherit;
      background: var(--dorado);
    }

    .dashboard-libro-recordatorio {
      display: flex;
      align-items: flex-start;
      gap: 5px;
      margin: 7px 0 0;
      color: #88899a;
      font-size: 8px;
      line-height: 1.45;
    }

    .dashboard-libro-recordatorio svg {
      flex: 0 0 auto;
      margin-top: 1px;
    }

    .dashboard-vacio,
    .dashboard-cargando,
    .dashboard-error {
      padding: 22px 14px;
      border-radius: 11px;
      color: #858697;
      background: #f8f8fa;
      font-size: 10px;
      line-height: 1.55;
      text-align: center;
    }

    .dashboard-error {
      margin-bottom: 14px;
      color: #a44646;
      background: #fff5f5;
      text-align: left;
    }

    .dashboard-cargando {
      display: flex;
      min-height: 190px;
      align-items: center;
      justify-content: center;
      gap: 10px;
    }

    @media (max-width: 1100px) {
      .dashboard-tarjetas {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }

      .dashboard-paneles-inferiores {
        grid-template-columns: minmax(0, 1fr);
      }
    }

    /* Optimización de áreas táctiles móviles: mínimo 44px (WCAG 2.5.5 / Apple HIG) */
    button,
    input,
    select,
    textarea {
      touch-action: manipulation;
      -webkit-tap-highlight-color: transparent;
    }

    button:active {
      transform: scale(0.97);
    }

    @media (max-width: 640px) {
      .boton-dashboard-header {
        width: 44px;
        height: 44px;
        flex-basis: 44px;
        min-width: 44px;
        min-height: 44px;
      }

      .selector-conexion {
        min-width: 50px;
        height: 44px;
        padding: 0 8px;
      }

      .dashboard-encabezado {
        align-items: flex-start;
        margin-bottom: 16px;
      }

      .dashboard-tarjetas {
        gap: 9px;
        margin-bottom: 11px;
      }

      .dashboard-tarjeta {
        min-height: 105px;
        grid-template-columns: 34px minmax(0, 1fr);
        gap: 8px;
        padding: 12px;
        border-radius: 12px;
      }

      .dashboard-tarjeta-icono {
        width: 34px;
        height: 34px;
        border-radius: 10px;
      }

      .dashboard-tarjeta-etiqueta {
        font-size: 9px;
      }

      .dashboard-tarjeta-valor {
        font-size: 23px;
      }

      .dashboard-tarjeta-ayuda {
        font-size: 8px;
      }

      .dashboard-panel {
        padding: 15px;
        border-radius: 13px;
      }

      .dashboard-categoria {
        grid-template-columns: minmax(70px, 100px) minmax(55px, 1fr) 34px;
        gap: 8px;
      }

      .dashboard-actividad {
        grid-template-columns: 28px minmax(0, 1fr);
        gap: 8px;
      }

      .dashboard-actividad-icono {
        width: 28px;
        height: 28px;
      }

      .dashboard-actividad-fecha {
        grid-column: 2;
        padding-top: 0;
      }
    }

    @media (min-width: 1400px) {
      .contenido-principal {
        padding-right: 54px;
        padding-left: 54px;
      }

      .rejilla-libros {
        grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
        gap: 21px;
      }
    }

    @media (max-width: 900px) {
      .disposicion {
        grid-template-columns: 220px minmax(0, 1fr);
      }

      .contenido-principal {
        padding: 27px 25px;
      }

      .rejilla-libros {
        grid-template-columns: repeat(auto-fill, minmax(205px, 1fr));
        gap: 14px;
      }
    }

    @media (min-width: 768px) and (max-width: 900px) {
      .encabezado {
        padding: 0 20px;
      }

      .encabezado-acciones {
        gap: 10px;
      }

      .encabezado-detalle {
        font-size: 10px;
      }
    }

    @media (max-width: 767px) {
      :root {
        --alto-encabezado: calc(62px + env(safe-area-inset-top, 0px));
      }

      .encabezado {
        height: var(--alto-encabezado);
        min-height: var(--alto-encabezado);
        padding-top: env(safe-area-inset-top, 0px);
        padding-right: max(14px, env(safe-area-inset-right, 14px));
        padding-left: max(14px, env(safe-area-inset-left, 14px));
        max-width: 100vw;
        overflow: hidden;
        box-sizing: border-box;
      }

      .encabezado-acciones {
        gap: 8px;
        flex-shrink: 0;
      }

      .encabezado-detalle {
        display: none;
      }

      .marca {
        min-width: 0;
        gap: 10px;
        flex: 1 1 auto;
      }

      .marca-icono {
        width: 38px;
        height: 38px;
        flex: 0 0 38px;
      }

      .marca h1 {
        font-size: 17px;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        margin: 0;
      }

      .marca p {
        display: none;
      }

      /* En móviles la navegación completa (Categorías, Cargar Libro, Dashboard, Roles/Perfiles)
         se maneja cómodamente con el pulgar en la barra inferior. Ocultamos los duplicados del
         encabezado para evitar que se desborde o se solapen los elementos. */
      .selector-conexion,
      .grupo-botones-catalogo,
      .boton-cargar-pdf-header,
      .boton-agregar-libro,
      .boton-dashboard-header,
      .selector-perfil,
      .boton-menu-lateral {
        display: none !important;
      }

      .boton-campana {
        width: 44px;
        height: 44px;
        flex: 0 0 44px;
        min-width: 44px;
        min-height: 44px;
      }

      .disposicion {
        position: relative;
        display: flex;
        flex-direction: column;
        width: 100%;
        max-width: 100vw;
        overflow-x: hidden;
        min-height: 0;
        flex: 1;
        box-sizing: border-box;
        padding-bottom: calc(58px + env(safe-area-inset-bottom, 0px));
      }

      .barra-lateral {
        position: fixed;
        z-index: 45;
        top: var(--alto-encabezado);
        bottom: 0;
        left: 0;
        width: min(84vw, 320px);
        padding: 24px 18px calc(70px + env(safe-area-inset-bottom, 0px));
        overflow-x: hidden;
        overflow-y: auto;
        border-right: 1px solid var(--borde);
        border-bottom: 0;
        background: #fff;
        box-shadow: 12px 0 35px rgba(26, 26, 46, .16);
        transform: translateX(-105%);
        transition: transform 240ms cubic-bezier(0.16, 1, 0.3, 1);
      }

      .barra-lateral.abierta {
        transform: translateX(0);
      }

      .fondo-menu-lateral {
        position: fixed;
        z-index: 44;
        inset: var(--alto-encabezado) 0 0;
        display: block;
        border: 0;
        background: rgba(20, 20, 39, .45);
        animation: aparecer-fondo 180ms ease-out both;
      }

      .barra-lateral-etiqueta {
        display: block;
      }

      .separador-lateral {
        display: block;
      }

      .nota-lateral {
        display: block;
      }

      .lista-categorias {
        display: grid;
        width: auto;
        gap: 6px;
      }

      .categoria-enlace {
        width: 100%;
        min-height: 48px;
        gap: 12px;
        padding: 0 12px;
        border: 0;
        border-radius: 12px;
      }

      .categoria-icono {
        width: 32px;
        height: 32px;
        flex-basis: 32px;
        border-radius: 10px;
        font-size: 15px;
      }

      .categoria-nombre {
        max-width: none;
        font-size: 13px;
        font-weight: 600;
      }

      .categoria-conteo {
        min-width: 26px;
        height: 24px;
        font-size: 11px;
      }

      .contenido-principal {
        width: 100%;
        max-width: 100vw;
        box-sizing: border-box;
        min-height: 0;
        flex: 1;
        padding: 18px 14px calc(76px + env(safe-area-inset-bottom, 0px));
        overflow-y: auto;
        overflow-x: hidden;
      }

      .rejilla-libros {
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 14px;
        width: 100%;
        box-sizing: border-box;
      }

      .portada-marco {
        height: 160px;
      }

      .tabs-detalle {
        scroll-behavior: smooth;
        overscroll-behavior-x: contain;
        gap: 6px;
        padding-bottom: 4px;
      }

      .tab-detalle {
        min-height: 44px;
        padding: 0 12px;
        font-size: 11px;
        border-radius: 11px;
      }

      .boton-volver {
        width: 44px;
        height: 44px;
        min-width: 44px;
        min-height: 44px;
        padding: 0;
        justify-content: center;
      }

      .formulario-fila-doble,
      .formulario-fila-descripcion,
      .editor-resumen-cabecera,
      .editor-lexico-cabecera {
        grid-template-columns: minmax(0, 1fr);
      }

      .zona-toasts {
        top: calc(var(--alto-encabezado) + 10px);
        right: 12px;
        left: 12px;
      }
    }

    @keyframes aparecer-fondo {
      from {
        opacity: 0;
      }

      to {
        opacity: 1;
      }
    }

    @media (min-width: 641px) and (max-width: 1023px) {
      .rejilla-libros {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }
    }

    @media (min-width: 1024px) {
      .rejilla-libros {
        grid-template-columns: repeat(3, minmax(0, 1fr));
      }
    }

    @media (max-width: 640px) {
      .encabezado-contenido {
        display: flex;
        flex-direction: column;
        align-items: stretch;
        gap: 12px;
        margin-bottom: 18px;
        width: 100%;
        box-sizing: border-box;
      }

      .acciones-catalogo-banner {
        width: 100%;
        display: flex;
        flex-direction: column;
      }

      .boton-subir-pdf-destacado {
        width: 100%;
        justify-content: center;
        min-height: 48px;
        font-size: 13px;
        box-sizing: border-box;
      }

      .busqueda {
        width: 100%;
        max-width: 100%;
        box-sizing: border-box;
        margin-bottom: 18px;
      }

      .rejilla-libros {
        grid-template-columns: minmax(0, 1fr);
        gap: 16px;
        width: 100%;
        box-sizing: border-box;
      }

      .tarjeta-libro {
        width: 100%;
        max-width: 100%;
        box-sizing: border-box;
      }

      .portada-marco {
        height: 185px;
        width: 100%;
      }

      .panel-resumen {
        grid-template-columns: 1fr;
      }

      .lista-resumenes {

        gap: 6px;
        overflow-x: auto;
        border-right: 0;
        border-bottom: 1px solid var(--borde);
      }

      .lista-resumenes-etiqueta {
        display: none;
      }

      .enlace-resumen {
        width: auto;
        min-width: 145px;
        min-height: 44px;
      }

      .contenido-resumen {
        padding: 18px;
      }

      .panel-lexico,
      .panel-mapa,
      .panel-modulos {

      .entrada-lexico {

        gap: 6px;
      }

      .ejemplo-lexico {
        grid-column: 1;
      }

      .lectura-controles {
        flex-wrap: wrap;
      }

      .controles-voz {
        align-items: stretch;
        flex-direction: column;
      }

      .voz-ajustes {
        width: 100%;
      }

      .voz-ajuste {
        flex: 1;
      }

      .voz-selector {
        width: 100%;
      }

      .voz-selector-voz {
        width: 100%;
        min-height: 44px;
      }

      .mapa-lienzo {
        height: 400px;
      }

      .formulario-recordatorio {
        flex-wrap: wrap;
      }

      .campo-recordatorio-mensaje {

      }

      .campo-recordatorio-fecha,

        flex: 1 1 120px;

      }

      .recordatorio-libro-fila {
        align-items: flex-start;
      }

      .recordatorio-libro-acciones {
        flex-direction: column;
      }

      .examen-layout {
        grid-template-columns: minmax(0, 1fr);
      }

      .mapa-preguntas-lista {
        grid-template-columns: repeat(8, minmax(0, 1fr));
      }

      .fila-historial-examen {

      }

      .fila-historial-examen span {

      }

      .tarjeta-examen-cabecera {
        align-items: flex-start;
        flex-direction: column;
      }

      .examen-superior {
        align-items: flex-start;
        flex-direction: column;
      }

      .examen-navegacion {
        flex-wrap: wrap;
      }

      .controles-mapa-pdf {
        flex-wrap: wrap;
      }

      .controles-mapa-pdf .selector-mapa {
        flex: 1 1 190px;
        width: auto;
        min-height: 44px;
      }

      .modal-libro-admin .modal-contenido {
        padding: 16px;
      }

      .mapa-editor-herramientas {
        align-items: flex-start;
      }

      .mapa-nodo-eliminar {
        opacity: 1;

        min-height: 44px;
      }

    @media (max-width: 390px) {
      .encabezado {
        padding-right: 10px;
        padding-left: 10px;
      }

      .marca {
        gap: 8px;
      }

      .marca h1 {
        font-size: 15px;
      }

      .marca-icono {
        width: 34px;
        height: 34px;
        flex-basis: 34px;
      }

      .boton-campana {
        width: 44px;
        height: 44px;
        flex-basis: 44px;
        min-width: 44px;
        min-height: 44px;
      }

      .rejilla-libros {
        grid-template-columns: minmax(0, 1fr);
      }

      .portada-marco {
        height: 175px;
      }
    }

    /* Barra de navegación inferior para pulgar en móviles (Thumb Navigation) */
    .barra-navegacion-inferior {
      display: none;
    }

    @media (max-width: 767px) {
      .barra-navegacion-inferior {
        position: fixed;
        bottom: 0;
        left: 0;
        right: 0;
        z-index: 40;
        display: flex;
        align-items: center;
        justify-content: space-around;
        height: calc(56px + env(safe-area-inset-bottom, 0px));
        padding: 3px 4px max(4px, env(safe-area-inset-bottom, 0px));
        background: rgba(26, 26, 46, 0.96);
        backdrop-filter: blur(18px);
        -webkit-backdrop-filter: blur(18px);
        border-top: 1px solid rgba(255, 255, 255, 0.12);
        box-shadow: 0 -4px 22px rgba(10, 10, 25, 0.32);
        max-width: 100vw;
        box-sizing: border-box;
      }

      .barra-inferior-item {
        position: relative;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        flex: 1 1 0;
        min-width: 44px;
        min-height: 44px;
        padding: 3px 2px;
        border: 0;
        border-radius: 10px;
        background: transparent;
        color: rgba(255, 255, 255, 0.65);
        font-size: 10px;
        font-weight: 600;
        cursor: pointer;
        transition: color 140ms ease, background 140ms ease;
        touch-action: manipulation;
        -webkit-tap-highlight-color: transparent;
      }

      .barra-inferior-item span:not(.barra-inferior-icono):not(.barra-inferior-avatar) {
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        max-width: 100%;
        font-size: 10px;
      }

      .barra-inferior-item:hover,
      .barra-inferior-item.activo {
        color: var(--dorado);
        background: rgba(255, 255, 255, 0.08);
      }

      .barra-inferior-item:active {
        transform: scale(0.92);
      }

      .barra-inferior-icono {
        display: grid;
        place-items: center;
        width: 24px;
        height: 24px;
        margin-bottom: 2px;
      }

      .barra-inferior-avatar {
        display: grid;
        place-items: center;
        width: 22px;
        height: 22px;
        border-radius: 50%;
        color: #1a1a2e;
        font-size: 9px;
        font-weight: 850;
        border: 1.5px solid rgba(255, 255, 255, 0.7);
      }

      .barra-inferior-item.activo .barra-inferior-avatar {
        border-color: var(--dorado);
        box-shadow: 0 0 0 2px rgba(226, 176, 74, 0.4);
      }
    }

    /* Los textos secundarios mantienen lectura clara en tarjetas y estados. */
    .barra-lateral-etiqueta,
    .categoria-conteo,
    .boton-sutil,
    .progreso-etiquetas,
    .conteo-libros,
    .tab-detalle:not(.activa),
    .lista-resumenes-etiqueta,
    .recordatorio-pendiente-fecha,
    .recordatorio-libro-fecha,
    .lectura-paginas,
    .estado-voz,
    .mapa-editor-herramientas,
    .subtitulo-mapa-pdf,
    .dashboard-tarjeta-etiqueta,
    .dashboard-panel-ayuda,
    .dashboard-actividad-fecha,
    .dashboard-libro-porcentaje,
    .dashboard-libro-recordatorio,
    .dashboard-vacio,
    .recordatorio-libro-vacio,
    .estado-carga,
    .estado-vacio,
    .estado-error {
      color: #5f6072;
    }

    button.boton-abrir-libro:not(:disabled):hover {
      transform: none;
      box-shadow: none;
    }

    .dashboard-vacio::before {
      content: "✧";
      display: block;
      margin: 0 auto 8px;
      color: #76571c;
      font-size: 20px;
    }

    .recordatorio-libro-vacio:not([role="status"])::before {
      content: "◷";
      margin-right: 6px;
      color: #76571c;
    }

    @media (prefers-reduced-motion: reduce) {

      *,
      *::before,
      *::after {
        scroll-behavior: auto !important;
        animation-duration: 0.01ms !important;
        animation-delay: 0ms !important;
        transition-duration: 0.01ms !important;
      }
    }

    /* Estilos de carga de archivos (PDF / TXT) */
    .zona-carga-archivo {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 10px;
      padding: 22px 18px;
      margin-bottom: 20px;
      border: 2px dashed #d7d8e2;
      border-radius: 14px;
      background: #fbfbfd;
      text-align: center;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .zona-carga-archivo:hover,
    .zona-carga-archivo.arrastrando {
      border-color: var(--dorado);
      background: #fffcf4;
      box-shadow: 0 4px 15px rgba(226, 176, 74, 0.12);
    }

    .zona-carga-icono {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      background: #f8edda;
      color: #a4761f;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .zona-carga-texto strong {
      display: block;
      font-size: 13px;
      color: var(--azul-oscuro);
      margin-bottom: 3px;
    }

    .zona-carga-texto p {
      margin: 0;
      font-size: 11px;
      color: var(--texto-suave);
      max-width: 480px;
    }

    .estado-archivo-cargado {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 6px 12px;
      border-radius: 8px;
      background: #eaf7ee;
      color: #1e7e34;
      font-size: 11px;
      font-weight: 600;
      border: 1px solid #c3e6cb;
    }

    /* Estilos de creación de categorías inline */
    .formulario-fila-encabezado {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 5px;
    }

    .boton-enlace-accion {
      background: none;
      border: none;
      color: #9e6d19;
      font-size: 11px;
      font-weight: 700;
      cursor: pointer;
      padding: 0;
      text-decoration: underline;
    }

    .boton-enlace-accion:hover {
      color: var(--azul-oscuro);
    }

    .panel-nueva-categoria {
      margin: 10px 0 16px;
      padding: 14px 16px;
      border-radius: 12px;
      border: 1px solid #e2b04a;
      background: #fdfaf3;
      animation: aparecer-suave 0.2s ease;
    }

    .panel-nueva-categoria-titulo {
      font-size: 11px;
      font-weight: 700;
      color: #8c6314;
      margin-bottom: 10px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .selector-icono-categoria {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    .emojis-rapidos {
      display: flex;
      gap: 4px;
      flex-wrap: wrap;
    }

    .boton-emoji {
      width: 28px;
      height: 28px;
      padding: 0;
      border: 1px solid #e8e8ed;
      border-radius: 6px;
      background: #fff;
      cursor: pointer;
      font-size: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: transform 0.1s ease, background 0.1s ease;
    }

    .boton-emoji:hover {

      background: #fff5e0;

    .boton-emoji.seleccionado {
      border-color: var(--dorado);
      background: #fbf0d9;
    }

    .acciones-nueva-cat {
      display: flex;
      gap: 8px;
      margin-top: 10px;
    }

    .boton-lateral-nueva-categoria {
      display: flex;
      align-items: center;
      gap: 8px;
      width: 100%;
      margin-top: 8px;
      padding: 8px 12px;
      border: 1px dashed #d5d6e2;
      border-radius: 10px;
      background: transparent;
      color: #6d6e82;
      font-size: 11px;
      font-weight: 650;
      cursor: pointer;
      transition: all 0.15s ease;
    }

    .boton-lateral-nueva-categoria:hover {
      border-color: var(--dorado);
      background: #fffcf4;
      color: var(--azul-oscuro);
    }

    /* Barra de herramientas del lector */
    .barra-herramientas-lectura {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      flex-wrap: wrap;
      padding: 8px 12px;
      margin-bottom: 16px;
      border-radius: 10px;
      background: #f9f9fc;
      border: 1px solid #ebebf2;
    }

    .grupo-herramientas {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .boton-herramienta {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      height: 30px;
      padding: 0 10px;
      border: 1px solid #dcdce4;
      border-radius: 7px;
      background: #ffffff;
      color: var(--azul-oscuro);
      font-size: 11px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.15s ease;
    }

    .boton-herramienta:hover {
      border-color: var(--dorado);
      background: #fffbf2;
    }

    .boton-herramienta.activo {
      border-color: var(--dorado);
      background: #f9e8bd;
      color: #63430c;
    }

    .boton-indice-abrir {
      color: #724e10;
      background: #fef5e4;
      border: 1px solid #edd5a3;
      font-weight: 700;
    }

    .boton-indice-abrir:hover {
      background: #fae5be;
    }

    /* Temas del panel de lectura */
    .panel-lectura.tema-sepia {
      background: #fbf0d9;
      border-color: #ebd7b3;
    }

    .panel-lectura.tema-sepia .lectura-texto {
      color: #433422;
    }

    .panel-lectura.tema-sepia .barra-herramientas-lectura {
      background: #f3e5c7;
      border-color: #e5d3ae;
    }

    .panel-lectura.tema-sepia .controles-voz {
      background: #f6ebd2;
      border-color: #e5d4b0;
    }

    .panel-lectura.tema-oscuro {
      background: #171723;
      border-color: #272738;
      color: #dddded;
    }

    .panel-lectura.tema-oscuro .lectura-texto {
      color: #d6d6e6;
    }

    .panel-lectura.tema-oscuro .lectura-meta-titulo {
      color: #f0f0fa;
    }

    .panel-lectura.tema-oscuro .lectura-paginas {
      background: #27273a;
      color: #e2b04a;
    }

    .panel-lectura.tema-oscuro .barra-herramientas-lectura {
      background: #202030;
      border-color: #2e2e42;
    }

    .panel-lectura.tema-oscuro .boton-herramienta {
      background: #242436;
      border-color: #38384f;
      color: #e0e0ea;
    }

    .panel-lectura.tema-oscuro .controles-voz {

      border-color: #313145;
    }

    .panel-lectura.tema-oscuro .boton-voz {
      background: #242436;
      border-color: #393950;
      color: #d8d8e6;
    }

    .panel-lectura.tema-oscuro .control-pagina input {
      background: #242436;
      border-color: #393950;
      color: #fff;
    }

    /* Modal Índice */
    .modal-indice-overlay {
      position: fixed;
      inset: 0;
      z-index: 1050;
      background: rgba(15, 15, 28, 0.65);
      backdrop-filter: blur(4px);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      animation: aparecer-suave 0.15s ease;
    }

    .modal-indice-caja {
      width: min(100%, 600px);
      max-height: 80vh;
      display: flex;
      flex-direction: column;
      background: #ffffff;
      border-radius: 16px;
      box-shadow: 0 20px 45px rgba(0, 0, 0, 0.25);
      overflow: hidden;
    }

    .modal-indice-cabecera {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 16px 22px;
      border-bottom: 1px solid var(--borde);
      background: #fcfcfd;
    }

    .modal-indice-cabecera h3 {
      margin: 0;
      font-size: 15px;
      color: var(--azul-oscuro);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .modal-indice-filtro {
      padding: 10px 20px;
      border-bottom: 1px solid var(--borde);
      background: #ffffff;
    }

    .modal-indice-filtro input {
      width: 100%;
      height: 36px;
      padding: 0 12px;
      border: 1px solid var(--borde);
      border-radius: 8px;
      outline: none;
      font-size: 12px;

      border-color: var(--dorado);

    .modal-indice-lista {
      flex: 1;
      overflow-y: auto;
      padding: 12px 18px;
      display: flex;
      flex-direction: column;
      gap: 7px;
    }

    .modal-indice-item {
      display: flex;
      align-items: flex-start;
      gap: 12px;
      padding: 11px 14px;
      border-radius: 9px;
      border: 1px solid #ebebf2;
      background: #fafafc;
      cursor: pointer;
      text-align: left;
      transition: all 0.15s ease;
    }

    .modal-indice-item:hover {
      background: #fbf5e9;
      border-color: #eeddbb;
      transform: translateX(3px);

    .modal-indice-item.actual {
      background: #fcf4e0;
      border-color: var(--dorado);
    }

    .modal-indice-badge-pag {
      padding: 4px 8px;
      border-radius: 6px;
      background: #e9eaf2;
      color: #4b4c60;
      font-size: 10px;

      white-space: nowrap;

    .modal-indice-item.actual .modal-indice-badge-pag {
      background: var(--dorado);
      color: #fff;
    }

    .modal-indice-info {
      flex: 1;
      min-width: 0;
    }

    .modal-indice-titulo {
      font-size: 12px;
      font-weight: 700;
      color: var(--azul-oscuro);
      margin-bottom: 2px;
    }

    .modal-indice-preview {
      font-size: 11px;
      color: var(--texto-suave);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* Modal Traducción */
    .modal-traduccion-caja {
      width: min(100%, 640px);
      max-height: 84vh;
      display: flex;
      flex-direction: column;
      background: #ffffff;
      border-radius: 16px;
      box-shadow: 0 20px 45px rgba(0, 0, 0, 0.25);
      overflow: hidden;
      padding: 22px;

  <div id="raiz"></div>
  <noscript>Esta página necesita JavaScript activado para mostrar la biblioteca.</noscript>

  <script src="https://cdn.jsdelivr.net/npm/react@18.3.1/umd/react.production.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/react-dom@18.3.1/umd/react-dom.production.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.2/dist/jspdf.umd.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
  <script>
    if (window.pdfjsLib) {
      window.pdfjsLib.GlobalWorkerOptions.workerSrc = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";
    }
  </script>
  <script src="https://cdn.jsdelivr.net/npm/@babel/standalone@7.26.10/babel.min.js"></script>

  <script id="codigo-jsx" type="text/plain">
      const URL_API = "/api";
      const URL_MCP = `${window.location.origin}/mcp`;
      const ContextoNotificaciones = React.createContext(() => {});

      /** Lee la preferencia guardada; si el navegador no permite storage, usa REST. */
      function leerModoConexionGuardado() {
        try {
          return window.localStorage.getItem("biblioteca-modo-conexion") === "mcp" ? "mcp" : "rest";
        } catch {
          return "rest";
        }
      }

      /** Guarda el modo elegido sin impedir que la biblioteca se use sin storage. */
      function guardarModoConexion(modo) {
        try {
          window.localStorage.setItem("biblioteca-modo-conexion", modo);
        } catch {
          // La selección sigue activa hasta recargar la página.
        }
      }

      /** Recupera el perfil elegido en este navegador; el perfil inicial es el 1. */
      function leerUsuarioIdGuardado() {
        try {
          const identificador = Number(window.localStorage.getItem("biblioteca-usuario-id"));
          return Number.isSafeInteger(identificador) && identificador > 0 ? identificador : 1;
        } catch {
          return 1;
        }
      }

      /** Conserva el perfil entre recargas sin bloquear navegadores privados. */
      function guardarUsuarioId(identificador) {
        try {
          window.localStorage.setItem("biblioteca-usuario-id", String(identificador));
        } catch {
          // La selección permanece activa durante la sesión actual.
        }
      }

      /** Hace que paneles independientes vuelvan a cargar datos del perfil activo. */
      function avisarCambioPerfil() {
        window.dispatchEvent(new Event("biblioteca:perfil-cambiado"));
      }

      /** Actualiza los paneles que consultan el origen de datos por su cuenta. */
      function avisarCambioModoConexion() {
        window.dispatchEvent(new Event("biblioteca:modo-conexion-cambiado"));
      }

      // La preferencia vive fuera de React para que las funciones de servicio
      // elijan el transporte sin cambiar sus llamadas ni la lógica de pantalla.
      let modoConexionActual = leerModoConexionGuardado();
      let usuarioIdActual = leerUsuarioIdGuardado();
      let clienteMcp = null;
      let conexionMcpPendiente = null;
      const herramientasMcpPorPerfil = new Set([
        "consultar_progreso", "actualizar_progreso", "completar_lectura",
        "corregir_examen", "historial_examen", "consultar_estadisticas",
        "listar_recordatorios", "listar_recordatorios_pendientes",
        "crear_recordatorio", "actualizar_recordatorio", "eliminar_recordatorio",
        "marcar_recordatorio_notificado",
      ]);

      /** Carga el SDK oficial fijado por versión y abre una conexión Streamable HTTP. */
      async function obtenerClienteMcp() {
        if (clienteMcp) return clienteMcp;
        if (conexionMcpPendiente) return conexionMcpPendiente;

        conexionMcpPendiente = (async () => {
          // ESM.sh adapta el paquete oficial para navegador y mantiene fija su versión.
          const moduloClienteMcp = await import("https://esm.sh/@modelcontextprotocol/client@2.4.0?bundle");
          const clienteNuevo = new moduloClienteMcp.Client({ name: "biblioteca-digital-web", version: "1.0.0" });
          const transporteNuevo = new moduloClienteMcp.StreamableHTTPClientTransport(new URL(URL_MCP));
          await clienteNuevo.connect(transporteNuevo);

          // Evita quedar en modo MCP si el servidor aún no expone las operaciones
          // necesarias para que la página conserve sus secciones y formularios.
          const { tools: herramientasDisponibles } = await clienteNuevo.listTools();
          const nombresDisponibles = new Set(herramientasDisponibles.map((herramienta) => herramienta.name));
          const nombresNecesarios = [
            "listar_usuarios", "listar_categorias", "buscar_libros", "obtener_libro_completo",
            "crear_libro", "actualizar_libro", "obtener_resumenes",
            "crear_resumen", "actualizar_resumen", "eliminar_resumen",
            "obtener_lexico", "crear_termino_lexico", "actualizar_termino_lexico",
            "eliminar_termino_lexico", "obtener_mapas", "crear_mapa",
            "actualizar_mapa", "consultar_progreso", "actualizar_progreso",
            "completar_lectura", "completar_modulo", "obtener_examenes",
            "obtener_examen", "corregir_examen", "historial_examen",
            "consultar_estadisticas", "listar_recordatorios",
            "listar_recordatorios_pendientes", "crear_recordatorio",
            "actualizar_recordatorio", "eliminar_recordatorio",
            "marcar_recordatorio_notificado",
          ];
          const faltantes = nombresNecesarios.filter((nombre) => !nombresDisponibles.has(nombre));
          if (faltantes.length) {
            await clienteNuevo.close();
            throw new Error(`El servidor MCP no expone todas las operaciones de la página: ${faltantes.join(", ")}.`);
          }

          clienteMcp = clienteNuevo;
          return clienteNuevo;
        })();

        try {
          return await conexionMcpPendiente;
        } finally {
          conexionMcpPendiente = null;
        }
      }

      /** Ejecuta una herramienta y vuelve a convertir su contenido JSON al tipo de la API. */
      async function llamarHerramientaMcp(nombre, argumentos = {}) {
        const cliente = await obtenerClienteMcp();
        const entrada = herramientasMcpPorPerfil.has(nombre)
          ? { ...argumentos, usuarioId: usuarioIdActual }
          : argumentos;
        const resultado = await cliente.callTool({ name: nombre, arguments: entrada });
        const texto = (resultado.content || [])
          .filter((elemento) => elemento.type === "text")
          .map((elemento) => elemento.text)
          .join("\n");

        if (resultado.isError) {
          throw new Error(texto || `La herramienta MCP ${nombre} informó un error.`);
        }
        if (!texto) return null;
        try {
          return JSON.parse(texto);
        } catch {
          return texto;
        }
      }

      /** Enruta cada operación de pantalla al servicio MCP equivalente. */
      async function solicitarMcp(ruta, opciones = {}) {
        const direccion = new URL(`${URL_API}${ruta}`, window.location.origin);
        const partes = direccion.pathname
          .slice(URL_API.length)
          .split("/")
          .filter(Boolean)
          .map((parte) => decodeURIComponent(parte));
        const metodo = String(opciones.method || "GET").toUpperCase();
        const datos = opciones.body ? JSON.parse(opciones.body) : {};
        const llamar = llamarHerramientaMcp;
        const metodoNoAdmitido = () => {
          throw new Error(`La operación ${metodo} ${direccion.pathname} no está disponible por MCP.`);
        };
        const idLibro = Number(partes[1]);
        const idRegistro = Number(partes[3]);

        if (partes[0] === "usuarios" && partes.length === 1 && metodo === "GET") {
          return llamar("listar_usuarios");
        }
        if (partes[0] === "categorias") {
          if (partes.length === 1 && metodo === "GET") return llamar("listar_categorias");
          if (partes.length === 2 && metodo === "DELETE") return llamar("eliminar_categoria", { categoriaId: Number(partes[1]) });
        }
        if (partes[0] === "estadisticas" && metodo === "GET") {
          return llamar("consultar_estadisticas");
        }
        if (partes[0] === "libros") {
          if (partes.length === 1 && metodo === "GET") {
            const busqueda = direccion.searchParams.get("busqueda") || undefined;
            const categoriaTexto = direccion.searchParams.get("categoriaId");
            const categoriaId = categoriaTexto ? Number(categoriaTexto) : undefined;
            return llamar("buscar_libros", { busqueda, categoriaId });
          }
          if (partes.length === 1 && metodo === "POST") {
            return llamar("crear_libro", { datos });
          }
          if (partes.length === 2 && metodo === "GET") {
            return llamar("obtener_libro_completo", { libroId: idLibro });
          }
          if (partes.length === 2 && metodo === "PUT") {
            return llamar("actualizar_libro", { libroId: idLibro, datos });
          }
          if (partes.length === 2 && metodo === "DELETE") {
            return llamar("eliminar_libro", { libroId: idLibro });
          }

          const coleccion = partes[2];
          if (coleccion === "resumenes" && partes.length === 3) {
            if (metodo === "GET") return llamar("obtener_resumenes", { libroId: idLibro });
            if (metodo === "POST") return llamar("crear_resumen", { libroId: idLibro, datos });
          }
          if (coleccion === "resumenes" && partes.length === 4) {
            if (metodo === "PUT") return llamar("actualizar_resumen", { libroId: idLibro, resumenId: Number(partes[3]), datos });
            if (metodo === "DELETE") return llamar("eliminar_resumen", { libroId: idLibro, resumenId: Number(partes[3]) });
          }
          if (coleccion === "lexico" && partes.length === 3) {
            if (metodo === "GET") return llamar("obtener_lexico", { libroId: idLibro, busqueda: direccion.searchParams.get("busqueda") || undefined });
            if (metodo === "POST") return llamar("crear_termino_lexico", { libroId: idLibro, datos });
          }
          if (coleccion === "lexico" && partes.length === 4) {
            if (metodo === "PUT") return llamar("actualizar_termino_lexico", { libroId: idLibro, terminoId: Number(partes[3]), datos });
            if (metodo === "DELETE") return llamar("eliminar_termino_lexico", { libroId: idLibro, terminoId: Number(partes[3]) });
          }
          if (coleccion === "mapas" && partes.length === 3) {
            if (metodo === "GET") return llamar("obtener_mapas", { libroId: idLibro });
            if (metodo === "POST") return llamar("crear_mapa", { libroId: idLibro, datos });
          }
          if (coleccion === "mapas" && partes.length === 4 && metodo === "PUT") {
            return llamar("actualizar_mapa", { libroId: idLibro, mapaId: Number(partes[3]), datos });
          }
          if (coleccion === "progreso" && partes.length === 3) {
            if (metodo === "GET") {
              const respuesta = await llamar("consultar_progreso", { libroId: idLibro });
              return respuesta?.progreso ?? null;
            }
            if (metodo === "PUT") return llamar("actualizar_progreso", { libroId: idLibro, paginaActual: datos.paginaActual });
          }
          if (coleccion === "progreso" && partes[3] === "completar" && metodo === "POST") {
            return llamar("completar_lectura", { libroId: idLibro });
          }
          if (coleccion === "modulos" && partes.length === 3 && metodo === "GET") {
            return llamar("listar_modulos", { libroId: idLibro });
          }
          if (coleccion === "modulos" && partes[2] === "modulos" && partes[4] === "completar" && metodo === "POST") {
            return llamar("completar_modulo", { libroId: idLibro, moduloId: idRegistro });
          }
          if (coleccion === "examenes" && partes.length === 3 && metodo === "GET") {
            return llamar("obtener_examenes", { libroId: idLibro });
          }
          if (coleccion === "examenes" && partes.length === 4 && metodo === "GET") {
            return llamar("obtener_examen", { libroId: idLibro, examenId: Number(partes[3]) });
          }
          if (coleccion === "examenes" && partes.length === 5 && metodo === "POST" && partes[4] === "corregir") {
            return llamar("corregir_examen", { libroId: idLibro, examenId: Number(partes[3]), respuestas: datos.respuestas });
          }
          if (coleccion === "examenes" && partes.length === 5 && metodo === "GET" && partes[4] === "resultados") {
            return llamar("historial_examen", { libroId: idLibro, examenId: Number(partes[3]) });
          }
        }

        if (partes[0] === "recordatorios" && partes[1] === "pendientes" && metodo === "GET") {
          return llamar("listar_recordatorios_pendientes");
        }
        if (partes[0] === "recordatorios" && partes.length === 1) {
          if (metodo === "GET") {
            const libroTexto = direccion.searchParams.get("libroId");
            return llamar("listar_recordatorios", { libroId: libroTexto ? Number(libroTexto) : undefined });
          }
          if (metodo === "POST") {
            return llamar("crear_recordatorio", {
              libroId: datos.libroId,
              mensaje: datos.mensaje,
              fechaHora: datos.fechaHora,
            });
          }
        }
        if (partes[0] === "recordatorios" && partes.length === 2) {
          if (metodo === "PUT") return llamar("actualizar_recordatorio", { id: Number(partes[1]), ...datos });
          if (metodo === "DELETE") return llamar("eliminar_recordatorio", { id: Number(partes[1]) });
        }
        if (partes[0] === "recordatorios" && partes.length === 3 && partes[2] === "notificar" && metodo === "POST") {
          return llamar("marcar_recordatorio_notificado", { id: Number(partes[1]) });
        }

        return metodoNoAdmitido();
      }

      /** Solicita JSON a la API y convierte respuestas no exitosas en errores legibles. */
      async function solicitarApi(ruta, opciones = {}) {
        // El modo MCP no hace solicitudes REST: cada ruta de pantalla se traduce
        // a una herramienta MCP y conserva la misma forma de respuesta esperada.
        if (modoConexionActual === "mcp") return solicitarMcp(ruta, opciones);

        const respuesta = await fetch(`${URL_API}${ruta}`, {
          ...opciones,
          headers: {
            Accept: "application/json",
            "X-Usuario-Id": String(usuarioIdActual),
            ...(opciones.body ? { "Content-Type": "application/json" } : {}),
            ...(opciones.headers || {}),
          },
        });
        const datos = respuesta.status === 204 ? null : await respuesta.json();
        if (!respuesta.ok) {
          const error = new Error(datos?.error || "No se pudo completar la solicitud.");
          error.estado = respuesta.status;
          throw error;
        }
        return datos;
      }

      /**
       * Consulta el listado filtrado y agrega el avance de lectura a cada libro.
       * Un 404 de progreso significa que ese libro todavía no tiene avance.
       */
      async function obtenerLibros({ busqueda, categoriaId }) {
        const parametros = new URLSearchParams();
        if (busqueda) parametros.set("busqueda", busqueda);
        if (categoriaId !== null && categoriaId !== undefined) {
          parametros.set("categoriaId", String(categoriaId));
        }
        const cadenaParametros = parametros.toString();
        const sufijo = cadenaParametros ? `?${cadenaParametros}` : "";
        const filas = await solicitarApi(`/libros${sufijo}`);

        return Promise.all(
          filas.map(async (fila) => {
            // El endpoint entrega el libro junto a su categoría para evitar
            // solicitudes adicionales al construir la tarjeta.
            const libro = fila.libro || fila;
            const categoria = fila.categoria || {};
            const progreso = await obtenerProgreso(libro.id);

            return {
              ...libro,
              categoriaNombre: categoria.nombre || "Sin categoría",
              categoriaIcono: categoria.icono || "📚",
              porcentaje: progreso?.porcentaje || 0,
            };
          }),
        );
      }

      /** Colores compartidos por los documentos descargables de la biblioteca. */
      const COLORES_PDF = {
        azul: [26, 26, 46],
        dorado: [226, 176, 74],
        texto: [67, 68, 86],
        suave: [123, 124, 139],
        borde: [226, 227, 234],
