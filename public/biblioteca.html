      /** Crea un documento jsPDF y guarda sus metadatos para la descarga. */
      function crearDocumentoPdf(tituloDocumento, tituloLibro, orientacion = "portrait") {
        const ConstructorPdf = window.jspdf?.jsPDF;
        if (!ConstructorPdf) throw new Error("No se pudo cargar jsPDF. Comprueba tu conexión y vuelve a intentar.");
        const pdf = new ConstructorPdf({ orientation: orientacion, unit: "mm", format: "a4", compress: true });
        pdf.setProperties({
          title: tituloDocumento,
          subject: tituloDocumento,
          author: "BiblioTeca Digital",
          keywords: tituloLibro,
        });
        return pdf;
      }

      /** Agrega el membrete de marca y el pie fechado a todas las páginas. */
      function agregarMembretePdf(pdf, tituloLibro) {
        const anchoPagina = pdf.internal.pageSize.getWidth();
        const altoPagina = pdf.internal.pageSize.getHeight();
        const totalPaginas = pdf.internal.getNumberOfPages();
        const fechaGeneracion = new Intl.DateTimeFormat("es-AR", { dateStyle: "long" }).format(new Date());

        for (let numeroPagina = 1; numeroPagina <= totalPaginas; numeroPagina += 1) {
          pdf.setPage(numeroPagina);
          pdf.setFillColor(...COLORES_PDF.dorado);
          pdf.roundedRect(15, 8, 9, 9, 1.4, 1.4, "F");
          pdf.setDrawColor(...COLORES_PDF.azul);
          pdf.setLineWidth(0.45);
          pdf.line(19.5, 9.8, 19.5, 16);
          pdf.line(16.7, 10.5, 19.1, 11.2);
          pdf.line(22.2, 10.5, 19.9, 11.2);

          pdf.setFont("helvetica", "bold");
          pdf.setFontSize(9);
          pdf.setTextColor(...COLORES_PDF.azul);
          pdf.text("BiblioTeca Digital", 28, 14);
          pdf.setFont("helvetica", "normal");
          pdf.setFontSize(8);
          pdf.setTextColor(...COLORES_PDF.suave);
          pdf.text(String(tituloLibro || "Biblioteca digital"), anchoPagina - 15, 14, {
            align: "right",
            maxWidth: Math.max(45, anchoPagina - 100),
          });

          pdf.setDrawColor(...COLORES_PDF.dorado);
          pdf.setLineWidth(0.55);
          pdf.line(15, 22, anchoPagina - 15, 22);
          pdf.setDrawColor(...COLORES_PDF.borde);
          pdf.setLineWidth(0.35);
          pdf.line(15, altoPagina - 19, anchoPagina - 15, altoPagina - 19);
          pdf.setFont("helvetica", "normal");
          pdf.setFontSize(8);
          pdf.setTextColor(...COLORES_PDF.suave);
          pdf.text(`Generado el ${fechaGeneracion}`, 15, altoPagina - 11);
          pdf.text(`Página ${numeroPagina} de ${totalPaginas}`, anchoPagina - 15, altoPagina - 11, { align: "right" });
        }
      }

      /** Dibuja una portada sobria con el libro y el subtítulo del documento. */
      function agregarPortadaPdf(pdf, libro, subtitulo, incluirAutor = false) {
        const anchoPagina = pdf.internal.pageSize.getWidth();
        const altoTarjeta = Math.min(152, pdf.internal.pageSize.getHeight() - 86);
        const posicionY = 43;
        pdf.setFillColor(...COLORES_PDF.azul);
        pdf.roundedRect(17, posicionY, anchoPagina - 34, altoTarjeta, 7, 7, "F");
        pdf.setFillColor(...COLORES_PDF.dorado);
        pdf.roundedRect(17, posicionY, 4, altoTarjeta, 2, 2, "F");
        pdf.setFont("helvetica", "bold");
        pdf.setFontSize(9);
        pdf.setTextColor(...COLORES_PDF.dorado);
        pdf.text("BIBLIOTECA DIGITAL", 32, posicionY + 23);

        let tamanoTitulo = 25;
        pdf.setFont("helvetica", "bold");
        pdf.setFontSize(tamanoTitulo);
        let lineasTitulo = pdf.splitTextToSize(String(libro.titulo || "Libro"), anchoPagina - 74);
        while (lineasTitulo.length > 4 && tamanoTitulo > 17) {
          tamanoTitulo -= 2;
          pdf.setFontSize(tamanoTitulo);
          lineasTitulo = pdf.splitTextToSize(String(libro.titulo || "Libro"), anchoPagina - 74);
        }
        pdf.setFontSize(tamanoTitulo);
        pdf.setTextColor(...COLORES_PDF.blanco);
        const yTitulo = posicionY + 47;
        pdf.text(lineasTitulo, 32, yTitulo, { lineHeightFactor: 1.12 });

        let yDetalle = yTitulo + lineasTitulo.length * tamanoTitulo * 0.44 + 9;
        if (incluirAutor && libro.autor) {
          pdf.setFont("helvetica", "normal");
          pdf.setFontSize(11);
          pdf.setTextColor(235, 235, 242);
          pdf.text(String(libro.autor), 32, yDetalle);
          yDetalle += 13;
        }
        pdf.setFont("helvetica", "bold");
        pdf.setFontSize(12);
        pdf.setTextColor(...COLORES_PDF.dorado);
        pdf.text(subtitulo, 32, yDetalle);
        return posicionY + altoTarjeta + 24;
      }

      /** Escribe texto envuelto, crea páginas cuando hace falta y devuelve la nueva altura. */
      function escribirTextoPdf(pdf, contenido, x, y, anchoTexto, opciones = {}) {
        const texto = String(contenido || "");
        const tamano = opciones.tamano || 11;
        const estilo = opciones.estilo || "normal";
        const color = opciones.color || COLORES_PDF.texto;
        const altoLinea = opciones.altoLinea || tamano * 0.48;
        const lineas = pdf.splitTextToSize(texto, anchoTexto);
        const limiteInferior = pdf.internal.pageSize.getHeight() - 25;
        pdf.setFont("helvetica", estilo);
        pdf.setFontSize(tamano);
        pdf.setTextColor(...color);

        lineas.forEach((linea) => {
          if (y + altoLinea > limiteInferior) {
            pdf.addPage();
            y = 34;
            pdf.setFont("helvetica", estilo);
            pdf.setFontSize(tamano);
            pdf.setTextColor(...color);
          }
          pdf.text(linea, x, y);
          y += altoLinea;
        });
        return y;
      }

      /** Dibuja un título de sección con un separador dorado y devuelve su inicio de texto. */
      function agregarTituloSeccionPdf(pdf, titulo, y) {
        const altoPagina = pdf.internal.pageSize.getHeight();
        if (y + 18 > altoPagina - 25) {
          pdf.addPage();
          y = 34;
        }
        pdf.setFont("helvetica", "bold");
        pdf.setFontSize(15);
        pdf.setTextColor(...COLORES_PDF.azul);
        pdf.text(titulo, 18, y);
        pdf.setDrawColor(...COLORES_PDF.dorado);
        pdf.setLineWidth(0.7);
        pdf.line(18, y + 4, 39, y + 4);
        return y + 15;
      }

      /** Prepara todas las páginas con marca y fecha y descarga el archivo final. */
      function guardarDocumentoPdf(pdf, tituloLibro, nombreArchivo) {
        agregarMembretePdf(pdf, tituloLibro);
        pdf.save(nombreArchivo);
      }

      /** Normaliza un título para convertirlo en un nombre de archivo legible. */
      function crearNombreArchivoPdf(tituloLibro, tipoDocumento) {
        const tituloSeguro = String(tituloLibro || "libro")
          .normalize("NFD")
          .replace(/[\u0300-\u036f]/gu, "")
          .replace(/[^a-zA-Z0-9]+/gu, "-")
          .replace(/^-|-$/gu, "")
          .toLowerCase();
        return `${tipoDocumento}-${tituloSeguro || "libro"}.pdf`;
      }

      /** Genera portada, índice y páginas por capítulo para el libro solicitado. */
      function descargarResumenesPdf(libro, resumenes) {
        const pdf = crearDocumentoPdf(`Resumen completo: ${libro.titulo}`, libro.titulo);
        agregarPortadaPdf(pdf, libro, "Resumen Completo", true);

        pdf.addPage();
        let y = agregarTituloSeccionPdf(pdf, "Índice de capítulos", 36);
        resumenes.forEach((resumen, indice) => {
          y = escribirTextoPdf(
            pdf,
            `${indice + 1}. Capítulo ${resumen.capitulo}: ${resumen.tituloCapitulo}`,
            22,
            y,
            pdf.internal.pageSize.getWidth() - 42,
            { tamano: 11, estilo: "bold", color: COLORES_PDF.texto },
          ) + 3;
        });

        resumenes.forEach((resumen) => {
          pdf.addPage();
          let yCapitulo = agregarTituloSeccionPdf(pdf, `Capítulo ${resumen.capitulo}`, 36);
          yCapitulo = escribirTextoPdf(
            pdf,
            resumen.tituloCapitulo,
            18,
            yCapitulo,
            pdf.internal.pageSize.getWidth() - 36,
            { tamano: 17, estilo: "bold", color: COLORES_PDF.azul, altoLinea: 8 },
          ) + 7;
          escribirTextoPdf(
            pdf,
            resumen.contenido,
            18,
            yCapitulo,
            pdf.internal.pageSize.getWidth() - 36,
            { tamano: 11, altoLinea: 5.7 },
          );
        });

        guardarDocumentoPdf(pdf, libro.titulo, crearNombreArchivoPdf(libro.titulo, "resumen-completo"));
      }

      /** Genera un glosario completo con separadores de letra y términos ordenados. */
      function descargarLexicoPdf(libro, terminos) {
        const listaOrdenada = [...terminos].sort((primero, segundo) =>
          primero.termino.localeCompare(segundo.termino, "es", { sensitivity: "base" }),
        );
        const pdf = crearDocumentoPdf(`Glosario de términos: ${libro.titulo}`, libro.titulo);
        agregarPortadaPdf(pdf, libro, "Glosario de Términos");
        pdf.addPage();
        let y = agregarTituloSeccionPdf(pdf, "Términos en orden alfabético", 36);
        let letraActual = "";

        listaOrdenada.forEach((termino) => {
          const inicial = String(termino.termino || "#").charAt(0).toLocaleUpperCase("es-AR");
          const letra = inicial === "Ñ"
            ? inicial
            : inicial.normalize("NFD").replace(/[\u0300-\u036f]/gu, "") || "#";
          if (letra !== letraActual) {
            letraActual = letra;
            y += 3;
            y = escribirTextoPdf(pdf, letra, 18, y, 175, {
              tamano: 13,
              estilo: "bold",
              color: COLORES_PDF.dorado,
              altoLinea: 7,
            }) + 2;
            pdf.setDrawColor(...COLORES_PDF.borde);
            pdf.setLineWidth(0.35);
            pdf.line(18, y, pdf.internal.pageSize.getWidth() - 18, y);
            y += 6;
          }
          y = escribirTextoPdf(pdf, termino.termino, 19, y, pdf.internal.pageSize.getWidth() - 38, {
            tamano: 12,
            estilo: "bold",
            color: COLORES_PDF.azul,
            altoLinea: 6,
          }) + 1;
          y = escribirTextoPdf(pdf, termino.definicion, 19, y, pdf.internal.pageSize.getWidth() - 38, {
            tamano: 10.5,
            altoLinea: 5.3,
          }) + 1;
          if (termino.ejemplo) {
            y = escribirTextoPdf(pdf, `Ejemplo: ${termino.ejemplo}`, 19, y, pdf.internal.pageSize.getWidth() - 38, {
              tamano: 10,
              estilo: "italic",
              color: COLORES_PDF.suave,
              altoLinea: 5,
            }) + 3;
          } else {
            y += 3;
          }
        });

        guardarDocumentoPdf(pdf, libro.titulo, crearNombreArchivoPdf(libro.titulo, "glosario"));
      }

      /** Divide etiquetas de nodos en líneas que caben dentro de una caja de canvas. */
      function envolverTextoCanvas(contexto, texto, anchoMaximo) {
        const palabras = String(texto || "").split(/\s+/u).filter(Boolean);
        const lineas = [];
        let lineaActual = "";
        palabras.forEach((palabra) => {
          const lineaPrueba = lineaActual ? `${lineaActual} ${palabra}` : palabra;
          if (lineaActual && contexto.measureText(lineaPrueba).width > anchoMaximo) {
            lineas.push(lineaActual);
            lineaActual = palabra;
          } else {
            lineaActual = lineaPrueba;
          }
        });
        if (lineaActual) lineas.push(lineaActual);
        return lineas.length ? lineas : [""];
      }

      /** Dibuja una caja redondeada usando trazos canvas compatibles. */
      function dibujarCajaRedondeadaCanvas(contexto, x, y, ancho, alto, radio) {
        contexto.beginPath();
        contexto.moveTo(x + radio, y);
        contexto.lineTo(x + ancho - radio, y);
        contexto.quadraticCurveTo(x + ancho, y, x + ancho, y + radio);
        contexto.lineTo(x + ancho, y + alto - radio);
        contexto.quadraticCurveTo(x + ancho, y + alto, x + ancho - radio, y + alto);
        contexto.lineTo(x + radio, y + alto);
        contexto.quadraticCurveTo(x, y + alto, x, y + alto - radio);
        contexto.lineTo(x, y + radio);
        contexto.quadraticCurveTo(x, y, x + radio, y);
        contexto.closePath();
      }

      /** Renderiza nodos y conexiones del mapa en canvas para insertarlos como imagen. */
      function crearCanvasMapaPdf(mapa) {
        const canvas = document.createElement("canvas");
        canvas.width = 1600;
        canvas.height = 960;
        const contexto = canvas.getContext("2d");
        if (!contexto) throw new Error("El navegador no pudo crear el canvas del mapa.");

        const nodos = mapa.datosNodos || [];
        const posiciones = ubicarNodos(nodos).map((posicion) => {
          const ancho = 270;
          contexto.font = "600 26px Arial, sans-serif";
          const lineas = envolverTextoCanvas(contexto, posicion.nodo.etiqueta, ancho - 34);
          const alto = Math.max(100, lineas.length * 34 + 32);
          return {
            ...posicion,
            x: posicion.x * canvas.width / 100,
            y: posicion.y * canvas.height / 100,
            ancho,
            alto,
            lineas,
          };
        });
        const posicionesPorId = Object.fromEntries(
          posiciones.map((posicion) => [posicion.nodo.id, posicion]),
        );

        contexto.fillStyle = "#fcfcfe";
        contexto.fillRect(0, 0, canvas.width, canvas.height);
        contexto.fillStyle = "rgba(95, 98, 122, 0.16)";
        for (let y = 24; y < canvas.height; y += 36) {
          for (let x = 24; x < canvas.width; x += 36) {
            contexto.beginPath();
            contexto.arc(x, y, 2, 0, Math.PI * 2);
            contexto.fill();
          }
        }

        /** Traza conexiones antes de las cajas para que los nodos queden por encima. */
        (mapa.datosConexiones || []).forEach((conexion) => {
          const origen = posicionesPorId[conexion.origen];
          const destino = posicionesPorId[conexion.destino];
          if (!origen || !destino) return;
          const diferenciaX = destino.x - origen.x;
          const diferenciaY = destino.y - origen.y;
          const factorOrigen = 1 / Math.max(
            Math.abs(diferenciaX) / (origen.ancho / 2),
            Math.abs(diferenciaY) / (origen.alto / 2),
            0.001,
          );
          const factorDestino = 1 / Math.max(
            Math.abs(diferenciaX) / (destino.ancho / 2),
            Math.abs(diferenciaY) / (destino.alto / 2),
            0.001,
          );
          const inicioX = origen.x + diferenciaX * factorOrigen;
          const inicioY = origen.y + diferenciaY * factorOrigen;
          const finX = destino.x - diferenciaX * factorDestino;
          const finY = destino.y - diferenciaY * factorDestino;
          const angulo = Math.atan2(finY - inicioY, finX - inicioX);

          contexto.strokeStyle = "#bd974d";
          contexto.fillStyle = "#bd974d";
          contexto.lineWidth = 4;
          contexto.beginPath();
          contexto.moveTo(inicioX, inicioY);
          contexto.lineTo(finX, finY);
          contexto.stroke();
          contexto.beginPath();
          contexto.moveTo(finX, finY);
          contexto.lineTo(finX - 20 * Math.cos(angulo - 0.48), finY - 20 * Math.sin(angulo - 0.48));
          contexto.lineTo(finX - 20 * Math.cos(angulo + 0.48), finY - 20 * Math.sin(angulo + 0.48));
          contexto.closePath();
          contexto.fill();

          if (conexion.etiqueta) {
            const centroX = (inicioX + finX) / 2;
            const centroY = (inicioY + finY) / 2 - 13;
            contexto.font = "600 19px Arial, sans-serif";
            const anchoEtiqueta = contexto.measureText(conexion.etiqueta).width + 20;
            contexto.fillStyle = "#fcfcfe";
            contexto.fillRect(centroX - anchoEtiqueta / 2, centroY - 21, anchoEtiqueta, 28);
            contexto.fillStyle = "#76602f";
            contexto.textAlign = "center";
            contexto.textBaseline = "middle";
            contexto.fillText(conexion.etiqueta, centroX, centroY - 7, anchoEtiqueta - 10);
          }
        });

        /** Dibuja cada nodo con el mismo estilo azul y dorado de la interfaz. */
        posiciones.forEach((posicion, indice) => {
          const x = posicion.x - posicion.ancho / 2;
          const y = posicion.y - posicion.alto / 2;
          contexto.save();
          contexto.shadowColor = "rgba(26, 26, 46, 0.12)";
          contexto.shadowBlur = 20;
          contexto.shadowOffsetY = 8;
          dibujarCajaRedondeadaCanvas(contexto, x, y, posicion.ancho, posicion.alto, 22);
          contexto.fillStyle = "#ffffff";
          contexto.fill();
          contexto.shadowColor = "transparent";
          contexto.lineWidth = 3;
          contexto.strokeStyle = indice % 2 === 0 ? "#ead8b3" : "#d8dce8";
          contexto.stroke();
          contexto.fillStyle = "#1a1a2e";
          contexto.font = "600 26px Arial, sans-serif";
          contexto.textAlign = "center";
          contexto.textBaseline = "middle";
          const altoTexto = 34;
          const inicioY = posicion.y - ((posicion.lineas.length - 1) * altoTexto) / 2;
          posicion.lineas.forEach((linea, indiceLinea) => {
            contexto.fillText(linea, posicion.x, inicioY + indiceLinea * altoTexto, posicion.ancho - 34);
          });
          contexto.restore();
        });

        return canvas;
      }

      /** Descarga el mapa seleccionado como imagen de canvas dentro de un PDF apaisado. */
      function descargarMapaConceptualPdf(libro, mapa, resumenes) {
        const canvasMapa = crearCanvasMapaPdf(mapa);
        const pdf = crearDocumentoPdf(`Mapa conceptual: ${mapa.titulo}`, libro.titulo, "landscape");
        const anchoPagina = pdf.internal.pageSize.getWidth();
        const altoPagina = pdf.internal.pageSize.getHeight();
        const resumen = resumenes.find((elemento) => elemento.id === mapa.resumenId);
        const capitulo = resumen
          ? `Capítulo ${resumen.capitulo}: ${resumen.tituloCapitulo}`
          : "Sin capítulo asociado";

        pdf.setFont("helvetica", "bold");
        pdf.setFontSize(16);
        pdf.setTextColor(...COLORES_PDF.azul);
        const lineasTitulo = pdf.splitTextToSize(mapa.titulo, anchoPagina - 30);
        pdf.text(lineasTitulo, 15, 34, { lineHeightFactor: 1.1 });
        const yCapitulo = 34 + lineasTitulo.length * 7.5;
        pdf.setFont("helvetica", "normal");
        pdf.setFontSize(9);
        pdf.setTextColor(...COLORES_PDF.suave);
        pdf.text(capitulo, 15, yCapitulo);

        const anchoDisponible = anchoPagina - 30;
        const yImagen = yCapitulo + 8;
        const altoDisponible = altoPagina - yImagen - 20;
        const factorEscala = Math.min(anchoDisponible / canvasMapa.width, altoDisponible / canvasMapa.height);
        const anchoImagen = canvasMapa.width * factorEscala;
        const altoImagen = canvasMapa.height * factorEscala;
        const imagenX = (anchoPagina - anchoImagen) / 2;
        pdf.addImage(canvasMapa.toDataURL("image/png"), "PNG", imagenX, yImagen, anchoImagen, altoImagen);
        guardarDocumentoPdf(pdf, libro.titulo, crearNombreArchivoPdf(libro.titulo, "mapa-conceptual"));
      }

      /** Encuentra la palabra que contiene un índice de carácter. */
      function rangoDePalabra(texto, indice) {
        let inicio = Math.max(0, Math.min(texto.length, indice));
        while (inicio < texto.length && /\s/u.test(texto[inicio])) inicio += 1;
        if (inicio >= texto.length) return null;
        let fin = inicio;
        while (fin < texto.length && !/\s/u.test(texto[fin])) fin += 1;
        return { inicio, fin };
      }

      /** Administra una única reproducción, voces en español, resaltado actual y audio en segundo plano. */
      function usarReproductorVoz() {
        const disponible = typeof window !== "undefined" &&
          "speechSynthesis" in window &&
          "SpeechSynthesisUtterance" in window;
        const sintetizador = disponible ? window.speechSynthesis : null;
        const [voces, establecerVoces] = React.useState([]);
        const [vozSeleccionada, seleccionarVoz] = React.useState("");
        const [velocidad, establecerVelocidad] = React.useState(1);
        const [estado, establecerEstado] = React.useState("inactiva");
        const [origen, establecerOrigen] = React.useState(null);
        const [rango, establecerRango] = React.useState(null);
        const secuencia = React.useRef(0);
        const intervaloEstimado = React.useRef(null);
        const esperaEstimado = React.useRef(null);
        const avanceEstimado = React.useRef(null);
        const audioFondoRef = React.useRef(null);
        const textoActualRef = React.useRef("");
        const identificadorActualRef = React.useRef(null);

        // Inicializa un elemento de audio silencioso en bucle para habilitar la sesión de audio en segundo plano en iOS y Android
        React.useEffect(() => {
          if (typeof document === "undefined") return;
          const audio = document.createElement("audio");
          audio.src = "data:audio/wav;base64,UklGRigAAABXQVZFZm10IBIAAAABAAEARKwAAIhYAQACABAAAABkYXRhAgAAAAEA";
          audio.loop = true;
          audio.preload = "auto";
          audio.setAttribute("playsinline", "");
          audio.setAttribute("webkit-playsinline", "");
          audioFondoRef.current = audio;
          return () => {
            try { audio.pause(); } catch {}
          };
        }, []);

        // Mantiene activa la sesión multimedia en segundo plano y en la pantalla de bloqueo
        function activarSesionSegundoPlano(titulo = "Lectura BiblioTeca", autor = "BiblioTeca Digital") {
          if (audioFondoRef.current) {
            audioFondoRef.current.play().catch(() => {});
          }
          if (typeof navigator !== "undefined" && "mediaSession" in navigator) {
            try {
              navigator.mediaSession.metadata = new MediaMetadata({
                title,
                artist: autor,
                album: "BiblioTeca PWA",
                artwork: [
                  { src: "/icon-192.png", sizes: "192x192", type: "image/png" },
                  { src: "/icon-512.png", sizes: "512x512", type: "image/png" }
                ]
              });
              navigator.mediaSession.playbackState = "playing";
            } catch {}
          }
        }

        function pausarSesionSegundoPlano() {
          if (audioFondoRef.current) {
            try { audioFondoRef.current.pause(); } catch {}
          }
          if (typeof navigator !== "undefined" && "mediaSession" in navigator) {
            try { navigator.mediaSession.playbackState = "paused"; } catch {}
          }
        }

        function detenerSesionSegundoPlano() {
          if (audioFondoRef.current) {
            try {
              audioFondoRef.current.pause();
              audioFondoRef.current.currentTime = 0;
            } catch {}
          }
          if (typeof navigator !== "undefined" && "mediaSession" in navigator) {
            try { navigator.mediaSession.playbackState = "none"; } catch {}
          }
        }

        React.useEffect(() => {
          if (!sintetizador) return undefined;
          const cargarVoces = () => {
            const vocesEspanol = sintetizador.getVoices().filter((voz) =>
              /^es(?:[-_]|$)/iu.test(voz.lang || ""),
            );
            establecerVoces(vocesEspanol);
          };
          cargarVoces();
          sintetizador.addEventListener("voiceschanged", cargarVoces);
          const reintento = window.setTimeout(cargarVoces, 300);
          return () => {
            window.clearTimeout(reintento);
            sintetizador.removeEventListener("voiceschanged", cargarVoces);
          };
        }, [sintetizador]);

        React.useEffect(() => {
          if (voces.length && !voces.some((voz) => voz.voiceURI === vozSeleccionada)) {
            seleccionarVoz(voces[0].voiceURI);
          }
        }, [voces, vozSeleccionada]);

        // Keep-alive para navegadores móviles (evita que el motor de voz se congele a los 15s)
        React.useEffect(() => {
          if (!sintetizador) return undefined;
          const temporizador = window.setInterval(() => {
            if (sintetizador.speaking && !sintetizador.paused) {
              sintetizador.pause();
              sintetizador.resume();
            }
          }, 12000);
          return () => window.clearInterval(temporizador);
        }, [sintetizador]);

        function limpiarEstimadores() {
          if (intervaloEstimado.current !== null) {
            window.clearInterval(intervaloEstimado.current);
            intervaloEstimado.current = null;
          }
          if (esperaEstimado.current !== null) {
            window.clearTimeout(esperaEstimado.current);
            esperaEstimado.current = null;
          }
        }

        function comenzarEstimador(token) {
          const avance = avanceEstimado.current;
          if (!avance || avance.token !== token || avance.tieneLimites) return;
          if (!avance.inicio) avance.inicio = Date.now();
          if (intervaloEstimado.current !== null) {
            window.clearInterval(intervaloEstimado.current);
          }
          intervaloEstimado.current = window.setInterval(() => {
            const estadoEstimado = avanceEstimado.current;
            if (!estadoEstimado || estadoEstimado.token !== secuencia.current) return;
            const transcurrido = estadoEstimado.transcurrido +
              (estadoEstimado.inicio ? Date.now() - estadoEstimado.inicio : 0);
            const proporcion = Math.min(0.98, transcurrido / estadoEstimado.duracion);
            const caracter = Math.floor(proporcion * estadoEstimado.texto.length);
            const palabra = rangoDePalabra(estadoEstimado.texto, caracter);
            if (palabra) establecerRango({ origen: estadoEstimado.origen, ...palabra });
          }, 180);
        }

        const detener = React.useCallback(() => {
          secuencia.current += 1;
          limpiarEstimadores();
          avanceEstimado.current = null;
          textoActualRef.current = "";
          identificadorActualRef.current = null;
          detenerSesionSegundoPlano();
          if (sintetizador) sintetizador.cancel();
          establecerEstado("inactiva");
          establecerOrigen(null);
          establecerRango(null);
        }, [sintetizador]);

        React.useEffect(() => () => {
          secuencia.current += 1;
          limpiarEstimadores();
          detenerSesionSegundoPlano();
          if (sintetizador) sintetizador.cancel();
        }, [sintetizador]);

        const reproducir = React.useCallback((texto, identificador, alFinalizar, metadatos) => {
          if (!sintetizador || !texto) return;
          const token = secuencia.current + 1;
          secuencia.current = token;
          limpiarEstimadores();
          sintetizador.cancel();

          textoActualRef.current = texto;
          identificadorActualRef.current = identificador;
          activarSesionSegundoPlano(metadatos?.titulo || "Lectura BiblioTeca", metadatos?.autor || "BiblioTeca Digital");

          const locucion = new SpeechSynthesisUtterance(texto);
          const voz = voces.find((elemento) => elemento.voiceURI === vozSeleccionada);
          if (voz) locucion.voice = voz;
          locucion.lang = voz?.lang || "es-ES";
          locucion.rate = Number(velocidad);
          locucion.pitch = 1;
          locucion.volume = 1;
          avanceEstimado.current = {
            token,
            texto,
            origen: identificador,
            inicio: 0,
            transcurrido: 0,
            duracion: Math.max(1200, (texto.length / (14 * Number(velocidad))) * 1000),
            tieneLimites: false,
          };
          establecerOrigen(identificador);
          establecerEstado("reproduciendo");
          establecerRango(null);

          locucion.onstart = () => {
            if (token !== secuencia.current) return;
            establecerEstado("reproduciendo");
            activarSesionSegundoPlano(metadatos?.titulo || "Lectura BiblioTeca", metadatos?.autor || "BiblioTeca Digital");
            esperaEstimado.current = window.setTimeout(() => {
              comenzarEstimador(token);
            }, 350);
          };
          locucion.onboundary = (evento) => {
            if (token !== secuencia.current) return;
            if (evento.name && evento.name !== "word") return;
            const palabra = rangoDePalabra(texto, evento.charIndex || 0);
            if (!palabra) return;
            avanceEstimado.current.tieneLimites = true;
            limpiarEstimadores();
            establecerRango({ origen: identificador, ...palabra });
          };
          locucion.onpause = () => {
            if (token !== secuencia.current) return;
            const avance = avanceEstimado.current;
            if (avance?.inicio) {
              avance.transcurrido += Date.now() - avance.inicio;
              avance.inicio = 0;
            }
            limpiarEstimadores();
            pausarSesionSegundoPlano();
            establecerEstado("pausada");
          };
          locucion.onresume = () => {
            if (token !== secuencia.current) return;
            establecerEstado("reproduciendo");
            activarSesionSegundoPlano();
            if (!avanceEstimado.current?.tieneLimites) comenzarEstimador(token);
          };
          locucion.onend = () => {
            if (token !== secuencia.current) return;
            limpiarEstimadores();
            avanceEstimado.current = null;
            textoActualRef.current = "";
            identificadorActualRef.current = null;
            detenerSesionSegundoPlano();
            establecerEstado("inactiva");
            establecerOrigen(null);
            establecerRango(null);
            if (alFinalizar) alFinalizar();
          };
          locucion.onerror = () => {
            if (token !== secuencia.current) return;
            limpiarEstimadores();
            avanceEstimado.current = null;
            textoActualRef.current = "";
            identificadorActualRef.current = null;
            detenerSesionSegundoPlano();
            establecerEstado("inactiva");
            establecerOrigen(null);
            establecerRango(null);
          };

          sintetizador.speak(locucion);
        }, [sintetizador, voces, vozSeleccionada, velocidad]);

        const alternar = React.useCallback((texto, identificador, alFinalizar, metadatos) => {
          if (!sintetizador) return;
          if (origen === identificador && estado === "reproduciendo") {
            sintetizador.pause();
            const avance = avanceEstimado.current;
            if (avance?.inicio) {
              avance.transcurrido += Date.now() - avance.inicio;
              avance.inicio = 0;
            }
            limpiarEstimadores();
            pausarSesionSegundoPlano();
            establecerEstado("pausada");
            return;
          }
          if (origen === identificador && estado === "pausada") {
            sintetizador.resume();
            const avance = avanceEstimado.current;
            if (avance && !avance.tieneLimites) {
              avance.inicio = Date.now();
              comenzarEstimador(avance.token);
            }
            activarSesionSegundoPlano(metadatos?.titulo || "Lectura BiblioTeca", metadatos?.autor || "BiblioTeca Digital");
            establecerEstado("reproduciendo");
            return;
          }
          reproducir(texto, identificador, alFinalizar, metadatos);
        }, [sintetizador, origen, estado, reproducir]);

        // Vinculación de los controles de la pantalla de bloqueo (Media Session API)
        React.useEffect(() => {
          if (typeof navigator === "undefined" || !("mediaSession" in navigator)) return;
          try {
            navigator.mediaSession.setActionHandler("play", () => {
              if (sintetizador && sintetizador.paused) {
                sintetizador.resume();
                activarSesionSegundoPlano();
                establecerEstado("reproduciendo");
              } else if (textoActualRef.current && identificadorActualRef.current) {
                reproducir(textoActualRef.current, identificadorActualRef.current);
              }
            });
            navigator.mediaSession.setActionHandler("pause", () => {
              if (sintetizador && sintetizador.speaking) {
                sintetizador.pause();
                pausarSesionSegundoPlano();
                establecerEstado("pausada");
              }
            });
            navigator.mediaSession.setActionHandler("stop", () => {
              detener();
            });
          } catch {}
          return () => {
            try {
              navigator.mediaSession.setActionHandler("play", null);
              navigator.mediaSession.setActionHandler("pause", null);
              navigator.mediaSession.setActionHandler("stop", null);
            } catch {}
          };
        }, [sintetizador, reproducir, detener]);

        return {
          disponible,
          voces,
          vozSeleccionada,
          seleccionarVoz,
          velocidad,
          establecerVelocidad,
          estado,
          origen,
          rango,
          alternar,
          reproducir,
          detener,
        };
      }

      /** Muestra el tramo de texto que los eventos de voz indican como actual. */
      function TextoConResaltado({ texto, rango }) {
        if (!rango || rango.inicio >= rango.fin) return <>{texto}</>;
        return <>{texto.slice(0, rango.inicio)}<mark className="texto-voz-resaltado">{texto.slice(rango.inicio, rango.fin)}</mark>{texto.slice(rango.fin)}</>;
      }

      /** Botón compacto de voz usado junto a resúmenes y términos. */
      function BotonVozInline({ texto, identificador, etiqueta, reproductor }) {
        const activo = reproductor.origen === identificador;
        const icono = activo && reproductor.estado === "reproduciendo"
          ? "pausa"
          : activo && reproductor.estado === "pausada"
            ? "play"
            : "altavoz";
        const accion = activo && reproductor.estado === "reproduciendo"
          ? `Pausar ${etiqueta}`
          : activo && reproductor.estado === "pausada"
            ? `Reanudar ${etiqueta}`
            : `Escuchar ${etiqueta}`;
        return (
          <button
            className={`voz-boton-inline ${activo ? `activo ${reproductor.estado}` : ""}`}
            type="button"
            aria-label={accion}
            title={accion}
            aria-pressed={activo}
            disabled={!reproductor.disponible || !texto}
            onClick={() => reproductor.alternar(texto, identificador)}
          >
            <Icono nombre={icono} tamano={15} />
          </button>
        );
      }

      /** Dibuja los trazos SVG locales para no depender de otro paquete de iconos. */
      function Icono({ nombre, tamano = 18, grosor = 1.8 }) {
        const trazos = {
          menu: <><path d="M4 6h16M4 12h16M4 18h16"/></>,
          grafico: <><path d="M3 3v18h18"/><path d="m7 14 4-4 4 3 6-7"/><path d="M17 6h4v4"/></>,
          examen: <><rect x="5" y="3" width="14" height="18" rx="2"/><path d="M9 8h6M9 12h6M9 16h3"/></>,
          trofeo: <><path d="M8 21h8m-4-4v4M7 4h10v5a5 5 0 0 1-10 0z"/><path d="M7 7H4v2a4 4 0 0 0 4 4M17 7h3v2a4 4 0 0 1-4 4"/></>,
          libro: <><path d="M4 5.5A2.5 2.5 0 0 1 6.5 3H20v17H6.5A2.5 2.5 0 0 0 4 22z"/><path d="M4 5.5v14A2.5 2.5 0 0 1 6.5 17H20M8 7h8M8 10h8"/></>,
          buscar: <><circle cx="10.8" cy="10.8" r="6.3"/><path d="m16 16 4.2 4.2"/></>,
          cerrar: <><path d="m6 6 12 12M18 6 6 18"/></>,
          descargar: <><path d="M12 3v12m0 0 4-4m-4 4-4-4"/><path d="M5 17v3h14v-3"/></>,
          flecha: <><path d="m9 18 6-6-6-6"/></>,
          atras: <><path d="M19 12H5m0 0 7 7m-7-7 7-7"/></>,

          play: <path d="m8 5 11 7-11 7z"/>,
          pausa: <><path d="M7 5h4v14H7zM15 5h4v14h-4z"/></>,
          detener: <rect x="6" y="6" width="12" height="12" rx="2"/>,
          campana: <><path d="M18 8a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9"/><path d="M10 21h4"/></>,
          check: <path d="m5 12 4 4L19 6"/>,
          cruz: <path d="m6 6 12 12M18 6 6 18"/>,
          papelera: <><path d="M4 7h16M10 11v6M14 11v6M6 7l1 14h10l1-14M9 7V4h6v3"/></>,
          eliminar: <><path d="M4 7h16M10 11v6M14 11v6M6 7l1 14h10l1-14M9 7V4h6v3"/></>,
          usuario: <><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></>,
          corona: <><path d="m2 4 3 12h14l3-12-6 7-4-7-4 7-6-7zm3 16h14"/></>,
          editar: <><path d="m4 16.5-.8 4.3 4.3-.8L19.8 7.7a2.1 2.1 0 0 0-3-3z"/><path d="m14.9 6.6 2.5 2.5"/></>,
          guardar: <><path d="M5 4h12l3 3v13H4V4z"/><path d="M8 4v6h8V4M8 20v-6h8v6"/></>,
          brillo: <><path d="m12 3 1.8 5.2L19 10l-5.2 1.8L12 17l-1.8-5.2L5 10l5.2-1.8z"/><path d="m19 15 .9 2.1L22 18l-2.1.9L19 21l-.9-2.1L16 18l2.1-.9z"/></>,
          aviso: <><circle cx="12" cy="12" r="9"/><path d="M12 8v4M12 16h.01"/></>,
          mas: <><path d="M12 5v14M5 12h14"/></>,
          documento: <><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6"/><path d="M16 13H8M16 17H8M10 9H8"/></>,
          subir: <><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="m17 8-5-5-5 5M12 3v12"/></>,
          traduccion: <><path d="m5 8 6 6M4 14l6-6 2-3M2 5h12M7 2h1M22 22l-5-10-5 10M14 18h6"/></>,
          sol: <><circle cx="12" cy="12" r="5"/><path d="M12 1v2M12 21v2M4.2 4.2l1.4 1.4M18.4 18.4l1.4 1.4M1 12h2M21 12h2M4.2 19.8l1.4-1.4M18.4 5.6l1.4-1.4"/></>,
          luna: <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>,
          fuente: <><path d="M4 7V4h16v3M9 20h6M12 4v16"/></>,

        return (
          <svg
            width={tamano}
            height={tamano}
            viewBox="0 0 24 24"

            stroke="currentColor"

            aria-hidden="true"
          >
            {trazos[nombre] || trazos.libro}
          </svg>
        );
      }

      /** Presenta un mensaje temporal accesible y anuncia el éxito con un check. */
      function ToastGlobal({ notificacion, alCerrar }) {
        React.useEffect(() => {
          if (!notificacion) return undefined;
          const temporizador = window.setTimeout(alCerrar, 3600);
          return () => window.clearTimeout(temporizador);
        }, [notificacion, alCerrar]);

        if (!notificacion) return null;
        const esError = notificacion.tipo === "error";
        return (
          <div className="zona-toasts" aria-live={esError ? "assertive" : "polite"} aria-atomic="true">
            <div key={notificacion.id} className={`toast-notificacion ${esError ? "error" : "exito"}`} role={esError ? "alert" : "status"}>
              <span className={`toast-icono ${esError ? "error" : "exito"}`}><Icono nombre={esError ? "cruz" : "check"} tamano={17} grosor={2.4} /></span>
              <p>{notificacion.mensaje}</p>
              <button className="toast-cerrar" type="button" aria-label="Cerrar notificación" onClick={alCerrar}>
                <Icono nombre="cerrar" tamano={14} />
              </button>
            </div>
          </div>
        );
      }

      /** Convierte una fecha guardada a fecha y hora local para presentarla. */
      function formatearFechaHora(fechaHora) {
        const fecha = new Date(fechaHora);
        if (Number.isNaN(fecha.getTime())) return String(fechaHora || "Fecha sin especificar");
        return new Intl.DateTimeFormat("es-AR", { dateStyle: "medium", timeStyle: "short" }).format(fecha);
      }

      /** Separa un instante en valores locales que aceptan los controles del formulario. */
      function separarFechaHoraLocal(fechaHora) {
        const fecha = new Date(fechaHora);
        if (Number.isNaN(fecha.getTime())) return { fecha: "", hora: "" };
        const dosDigitos = (numero) => String(numero).padStart(2, "0");
        return {
          fecha: `${fecha.getFullYear()}-${dosDigitos(fecha.getMonth() + 1)}-${dosDigitos(fecha.getDate())}`,
          hora: `${dosDigitos(fecha.getHours())}:${dosDigitos(fecha.getMinutes())}`,
        };
      }

      /** Campana global que actualiza pendientes, avisos y títulos de sus libros. */
      function CampanaRecordatorios({ alAbrirLibro }) {
        const [abierto, establecerAbierto] = React.useState(false);
        const [pendientes, establecerPendientes] = React.useState([]);
        const [titulosLibros, establecerTitulosLibros] = React.useState({});
        const [avisos, establecerAvisos] = React.useState([]);
        const [error, establecerError] = React.useState("");
        const [operacion, establecerOperacion] = React.useState("");
        const contenedor = React.useRef(null);
        const titulosActuales = React.useRef({});
        const recordatoriosPresentados = React.useRef(new Set());
        const temporizadoresAvisos = React.useRef(new Map());
        const componenteMontado = React.useRef(false);

        /** Cierra un aviso y limpia el temporizador asociado a su recordatorio. */
        function cerrarAviso(recordatorioId) {
          const temporizador = temporizadoresAvisos.current.get(recordatorioId);
          if (temporizador !== undefined) window.clearTimeout(temporizador);
          temporizadoresAvisos.current.delete(recordatorioId);
          establecerAvisos((actuales) => actuales.filter((aviso) => aviso.id !== recordatorioId));
        }

        /** Abre el libro al seleccionar una notificación del sistema operativo. */
        function configurarClicDeNotificacion(notificacion, recordatorio) {
          notificacion.onclick = () => {
            window.focus();
            establecerAbierto(false);
            alAbrirLibro(recordatorio.libroId);
            notificacion.close();
          };
        }

        /** Presenta Notification si tiene permiso y usa un aviso local como alternativa. */
        function anunciarRecordatorio(recordatorio) {
          const tituloLibro = titulosActuales.current[recordatorio.libroId] || `Libro ${recordatorio.libroId}`;
          if (typeof window.Notification !== "undefined" && window.Notification.permission === "granted") {
            try {
              const notificacion = new window.Notification(`Hora de leer: ${tituloLibro}`, {
                body: recordatorio.mensaje,
                tag: `recordatorio-${recordatorio.id}`,
              });
              configurarClicDeNotificacion(notificacion, recordatorio);
              return;
            } catch (_falloNotificacion) {
              // Si falla la notificación nativa, se muestra el mismo aviso dentro de la página.
            }
          }

          establecerAvisos((actuales) => [
            ...actuales,
            { id: recordatorio.id, libroId: recordatorio.libroId, tituloLibro, mensaje: recordatorio.mensaje },
          ]);
          const temporizador = window.setTimeout(() => cerrarAviso(recordatorio.id), 10000);
          temporizadoresAvisos.current.set(recordatorio.id, temporizador);
        }

        /** Recarga los vencidos y presenta solo los que no se avisaron en esta sesión. */
        async function consultarPendientes(mostrarAvisos = true) {
          const perfilConsultado = usuarioIdActual;
          try {
            const listaPendientes = await serviciosApi.obtenerRecordatoriosPendientes();
            if (!componenteMontado.current || perfilConsultado !== usuarioIdActual) return;
            establecerPendientes(listaPendientes);
            establecerError("");
            const idsPendientes = new Set(listaPendientes.map((recordatorio) => recordatorio.id));
            recordatoriosPresentados.current.forEach((recordatorioId) => {
              if (!idsPendientes.has(recordatorioId)) recordatoriosPresentados.current.delete(recordatorioId);
            });
            if (mostrarAvisos) {
              listaPendientes.forEach((recordatorio) => {
                if (recordatoriosPresentados.current.has(recordatorio.id)) return;
                recordatoriosPresentados.current.add(recordatorio.id);
                anunciarRecordatorio(recordatorio);
              });
            }
          } catch (fallo) {
            if (componenteMontado.current && perfilConsultado === usuarioIdActual) {
              establecerError(fallo.message || "No se pudieron cargar los recordatorios.");
            }
          }
        }

        React.useEffect(() => {
          componenteMontado.current = true;
          let cancelado = false;

          /** Carga los títulos una vez para completar el texto de los recordatorios. */
          async function cargarTitulos() {
            try {
              const libros = await serviciosApi.obtenerTitulosDeLibros();
              if (cancelado) return;
              const titulos = Object.fromEntries(libros.map((libro) => [libro.id, libro.titulo]));
              titulosActuales.current = titulos;
              establecerTitulosLibros(titulos);
            } catch (_falloTitulos) {
              // Si esta consulta falla, el panel identifica cada libro por su ID.
            }
          }

          /** Refresca enseguida al crear, borrar o completar avisos en otra vista. */
          const escucharCambios = () => consultarPendientes(true);
          /** Vuelve a cargar los avisos después de alternar entre REST y MCP. */
          const escucharCambioModoConexion = () => consultarPendientes(false);
          /** Cambia la campana al perfil seleccionado sin anunciar avisos antiguos. */
          const escucharCambioPerfil = () => {
            recordatoriosPresentados.current.clear();
            consultarPendientes(false);
          };
          cargarTitulos().finally(() => {
            if (!cancelado) consultarPendientes(true);
          });
          const intervalo = window.setInterval(() => consultarPendientes(true), 60000);
          window.addEventListener("biblioteca:recordatorios-actualizados", escucharCambios);
          window.addEventListener("biblioteca:modo-conexion-cambiado", escucharCambioModoConexion);
          window.addEventListener("biblioteca:perfil-cambiado", escucharCambioPerfil);

          return () => {
            cancelado = true;
            componenteMontado.current = false;
            window.clearInterval(intervalo);
            window.removeEventListener("biblioteca:recordatorios-actualizados", escucharCambios);
            window.removeEventListener("biblioteca:modo-conexion-cambiado", escucharCambioModoConexion);
            window.removeEventListener("biblioteca:perfil-cambiado", escucharCambioPerfil);
            temporizadoresAvisos.current.forEach((temporizador) => window.clearTimeout(temporizador));
            temporizadoresAvisos.current.clear();
          };
        }, [alAbrirLibro]);

        React.useEffect(() => {
          if (!abierto) return undefined;
          const cerrarAlHacerClicAfuera = (evento) => {
            if (!contenedor.current?.contains(evento.target)) establecerAbierto(false);
          };
          const cerrarConEscape = (evento) => {
            if (evento.key === "Escape") establecerAbierto(false);
          };
          document.addEventListener("mousedown", cerrarAlHacerClicAfuera);
          window.addEventListener("keydown", cerrarConEscape);
          return () => {
            document.removeEventListener("mousedown", cerrarAlHacerClicAfuera);
            window.removeEventListener("keydown", cerrarConEscape);
          };
        }, [abierto]);

        /** Marca un aviso leído y sincroniza la campana con el detalle del libro. */
        async function marcarLeido(recordatorioId) {
          establecerOperacion(`leer-${recordatorioId}`);
          establecerError("");
          try {
            await serviciosApi.marcarRecordatorioComoNotificado(recordatorioId);
            cerrarAviso(recordatorioId);
            serviciosApi.emitirCambioRecordatorios();
          } catch (fallo) {
            establecerError(fallo.message || "No se pudo marcar como leído.");
          } finally {
            establecerOperacion("");
          }
        }

        /** Borra un aviso y actualiza sus listas en todas las vistas abiertas. */
        async function eliminarPendiente(recordatorioId) {
          establecerOperacion(`eliminar-${recordatorioId}`);
          establecerError("");
          try {
            await serviciosApi.eliminarRecordatorio(recordatorioId);
            cerrarAviso(recordatorioId);
            serviciosApi.emitirCambioRecordatorios();
          } catch (fallo) {
            establecerError(fallo.message || "No se pudo eliminar el recordatorio.");
          } finally {
            establecerOperacion("");
          }
        }

        /** Navega al libro enlazado y cierra el panel que contiene la lista. */
        function abrirLibro(libroId) {
          establecerAbierto(false);
          alAbrirLibro(libroId);
        }

        return (
          <>
            <div className="contenedor-campana" ref={contenedor}>
              <button
                className="boton-campana"
                type="button"
                aria-label={`Recordatorios pendientes: ${pendientes.length}`}
                aria-expanded={abierto}
                aria-haspopup="dialog"
                onClick={() => establecerAbierto((actual) => !actual)}
              >
                <Icono nombre="campana" tamano={19} />
                {pendientes.length > 0 && (
                  <span className="campana-conteo">{pendientes.length > 99 ? "99+" : pendientes.length}</span>
                )}
              </button>
              {abierto && (
                <section className="panel-recordatorios" role="dialog" aria-label="Recordatorios pendientes">
                  <header className="panel-recordatorios-cabecera">
                    <h2>Recordatorios</h2>
                    <span>{pendientes.length} pendientes</span>
                  </header>
                  <div className="lista-recordatorios-pendientes" aria-live="polite">
                    {error && <p className="recordatorios-error" role="alert">{error}</p>}
                    {pendientes.length === 0 ? (
                      <p className="recordatorios-vacios" role="status">No hay recordatorios pendientes.</p>
                    ) : pendientes.map((recordatorio) => (
                      <article className="recordatorio-pendiente" key={recordatorio.id}>
                        <button className="enlace-libro-recordatorio" type="button" onClick={() => abrirLibro(recordatorio.libroId)}>
                          {titulosLibros[recordatorio.libroId] || `Libro ${recordatorio.libroId}`}
                        </button>
                        <p className="recordatorio-pendiente-mensaje">{recordatorio.mensaje}</p>
                        <time className="recordatorio-pendiente-fecha" dateTime={recordatorio.fechaHora}>
                          {formatearFechaHora(recordatorio.fechaHora)}
                        </time>
                        <div className="recordatorio-acciones">
                          <button className="boton-recordatorio-accion" type="button" disabled={Boolean(operacion)} onClick={() => marcarLeido(recordatorio.id)}>
                            <Icono nombre="check" tamano={13} /> Marcar como leído
                          </button>
                          <button className="boton-recordatorio-accion" type="button" aria-label="Eliminar recordatorio" title="Eliminar recordatorio" disabled={Boolean(operacion)} onClick={() => eliminarPendiente(recordatorio.id)}>
                            <Icono nombre="papelera" tamano={13} /> Eliminar
                          </button>
                        </div>
                      </article>
                    ))}
                  </div>
                </section>
              )}
            </div>
            {avisos.length > 0 && (
              <div className="avisos-recordatorios" aria-live="polite" aria-label="Avisos de lectura">
                {avisos.map((aviso) => (
                  <article className="aviso-recordatorio" key={aviso.id}>
                    <span className="aviso-recordatorio-icono"><Icono nombre="campana" tamano={16} /></span>
                    <div className="aviso-recordatorio-contenido">
                      <strong>{aviso.tituloLibro}</strong>
                      <p>{aviso.mensaje}</p>
                      <button className="enlace-libro-recordatorio" type="button" onClick={() => abrirLibro(aviso.libroId)}>Abrir libro</button>
                    </div>
                    <button className="aviso-recordatorio-cerrar" type="button" aria-label="Cerrar aviso" onClick={() => cerrarAviso(aviso.id)}>
                      <Icono nombre="cerrar" tamano={14} />
                    </button>
                  </article>
                ))}
              </div>
            )}
          </>
        );
      }

      /** Botón pequeño reutilizable con un icono SVG accesible. */
      function Boton({ icono, texto, etiqueta, variante = "sutil", onClick, tipo = "button" }) {
        return (
          <button
            className={`boton boton-${variante}`}
            type={tipo}
            aria-label={etiqueta || texto}
            title={etiqueta || texto}
            onClick={onClick}
          >
            {icono && <Icono nombre={icono} tamano={15} />}
            {texto && <span>{texto}</span>}
          </button>
        );
      }

      /** Badge reusable para distinguir visualmente cada categoría. */
      function BadgeCategoria({ nombre, icono }) {
        return (
          <span className="badge-categoria">
            <span className="badge-categoria-icono" aria-hidden="true">{icono || "📚"}</span>
            <span>{nombre || "Sin categoría"}</span>
          </span>
        );
      }

      /** Indicador accesible que combina una barra y un porcentaje. */
      function IndicadorProgreso({ porcentaje = 0 }) {
        const valor = Math.max(0, Math.min(100, Number(porcentaje) || 0));
        return (
          <div aria-label={`Progreso de lectura: ${valor}%`}>
            <div className="progreso-etiquetas">
              <span>Progreso de lectura</span>
              <span className="progreso-porcentaje">{valor}%</span>
            </div>
            <div className="progreso-pista" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow={valor}>
              <div className="progreso-relleno" style={{ width: `${valor}%` }} />
            </div>
          </div>
        );
      }

      /** Entrada de búsqueda reutilizable con acción para limpiar el texto. */
      function BarraBusqueda({ valor, alCambiar, alLimpiar, placeholder = "Buscar por título, autor o categoría..." }) {
        return (
          <div className="busqueda">
            <span className="solo-lectores">{placeholder}</span>
            <Icono nombre="buscar" tamano={17} />
            <input
              type="search"
              aria-label={placeholder}
              value={valor}
              placeholder={placeholder}
              onChange={(evento) => alCambiar(evento.target.value)}
            />
            {valor && <Boton icono="cerrar" etiqueta="Limpiar búsqueda" onClick={alLimpiar} />}
          </div>
        );
      }

      /** Escapa texto antes de insertarlo en el SVG de portada alternativo. */
      function escaparXml(texto) {
        return String(texto || "")
          .replace(/&/gu, "&amp;")
          .replace(/</gu, "&lt;")
          .replace(/>/gu, "&gt;")
          .replace(/"/gu, "&quot;")
          .replace(/'/gu, "&apos;");
      }

      /** Crea una portada ilustrada de respaldo cuando la URL no está disponible. */
      function crearPortadaAlternativa(libro) {
        const colores = ["#273451", "#465776", "#76603c", "#314d50", "#665276", "#8c5c49"];
        const color = colores[(Number(libro.categoriaId) || 0) % colores.length];
        const titulo = escaparXml(libro.titulo);
        const categoria = escaparXml(libro.categoriaNombre);
        const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="640" height="420" viewBox="0 0 640 420"><rect width="640" height="420" fill="${color}"/><circle cx="550" cy="58" r="145" fill="#e2b04a" fill-opacity=".16"/><circle cx="-15" cy="370" r="155" fill="#ffffff" fill-opacity=".07"/><path d="M76 74h488v272H76z" fill="none" stroke="#e2b04a" stroke-opacity=".55" stroke-width="2"/><path d="M101 101h438v218H101z" fill="none" stroke="#ffffff" stroke-opacity=".18"/><text x="118" y="147" fill="#e2b04a" font-family="Georgia,serif" font-size="18" letter-spacing="5">BIBLIOTECA DIGITAL</text><text x="118" y="213" fill="#ffffff" font-family="Georgia,serif" font-size="39" font-weight="bold">${titulo.slice(0, 34)}</text><text x="118" y="258" fill="#ffffff" fill-opacity=".76" font-family="Arial,sans-serif" font-size="18">${categoria}</text><path d="M118 292h80" stroke="#e2b04a" stroke-width="4"/></svg>`;
        return `data:image/svg+xml;charset=UTF-8,${encodeURIComponent(svg)}`;
      }

      /** Tarjeta de catálogo con portada, categoría, autor y avance. */
      function TarjetaLibro({ libro, alAbrir, alEditar, alEliminar, esAdmin, style }) {
        const portadaAlternativa = crearPortadaAlternativa(libro);
        return (
          <article className="tarjeta-libro" style={style}>
            <button className="boton-abrir-libro" type="button" aria-label={`Ver detalles de ${libro.titulo}`} onClick={() => alAbrir(libro)} />
            <div className="portada-marco">
              <img
                className="portada-imagen"
                src={libro.portadaUrl || portadaAlternativa}
                alt={`Portada de ${libro.titulo}`}
                loading="lazy"
                onError={(evento) => {
                  evento.currentTarget.onerror = null;
                  evento.currentTarget.src = portadaAlternativa;
                }}
              />
              <span className="portada-brillo" />
              <div className="acciones-tarjeta-libro">
                <button
                  className="boton-editar-libro"
                  type="button"
                  aria-label={`Editar ${libro.titulo}`}
                  title={`Editar ${libro.titulo}`}
                  onClick={(evento) => { evento.stopPropagation(); alEditar(libro); }}
                >
                  <Icono nombre="editar" tamano={15} />
                </button>
                {esAdmin && alEliminar && (
                  <button
                    className="boton-eliminar-libro-tarjeta"
                    type="button"
                    aria-label={`Eliminar ${libro.titulo}`}
                    title={`Eliminar ${libro.titulo}`}
                    onClick={(evento) => {
                      evento.stopPropagation();
                      if (window.confirm(`¿Estás seguro de que deseas eliminar "${libro.titulo}"?`)) {
                        alEliminar(libro);
                      }
                    }}
                  >
                    <Icono nombre="eliminar" tamano={15} />
                  </button>
                )}
              </div>
            </div>
            <div className="contenido-tarjeta">
              <div className="fila-badge">
                <BadgeCategoria nombre={libro.categoriaNombre} icono={libro.categoriaIcono} />
              </div>
              <h3 className="libro-titulo">{libro.titulo}</h3>
              <p className="libro-autor">{libro.autor}</p>
              <IndicadorProgreso porcentaje={libro.porcentaje} />
            </div>
          </article>
        );
      }

      /** Modal reutilizable con cierre por botón, fondo o tecla Escape. */
      function Modal({ abierto, titulo, alCerrar, children, clase = "" }) {
        React.useEffect(() => {
          if (!abierto) return undefined;
          const escucharTecla = (evento) => {
            if (evento.key === "Escape") alCerrar();
          };
          window.addEventListener("keydown", escucharTecla);
          return () => window.removeEventListener("keydown", escucharTecla);
        }, [abierto, alCerrar]);

        if (!abierto) return null;
        return (
          <div className="modal-fondo" onMouseDown={(evento) => evento.target === evento.currentTarget && alCerrar()}>
            <section className={`modal ${clase}`} role="dialog" aria-modal="true" aria-label={titulo}>
              <header className="modal-encabezado">
                <h2>{titulo}</h2>
                <Boton icono="cerrar" etiqueta="Cerrar" onClick={alCerrar} />
              </header>
              <div className="modal-contenido">{children}</div>
            </section>
          </div>
        );
      }

      /** Modal para crear o editar los campos principales de un libro con subida de PDF/TXT y creación de categorías. */
      function FormularioLibroModal({ abierto, libro, categorias, alCerrar, alGuardar, alEliminar, esAdmin, alCrearCategoria, autoAbrirSelector }) {
        const notificar = React.useContext(ContextoNotificaciones);
        const [campos, establecerCampos] = React.useState({});
        const [guardando, establecerGuardado] = React.useState(false);
        const [error, establecerError] = React.useState("");

        // Estado para carga de archivo PDF / TXT
        const [procesandoArchivo, establecerProcesandoArchivo] = React.useState(false);
        const [estadoProcesamiento, establecerEstadoProcesamiento] = React.useState("");
        const [arrastrandoArchivo, establecerArrastrandoArchivo] = React.useState(false);
        const [archivoCargadoInfo, establecerArchivoCargadoInfo] = React.useState(null);
        const inputArchivoRef = React.useRef(null);

        // Estado para creación rápida de categorías
        const [creandoCategoria, establecerCreandoCategoria] = React.useState(false);
        const [nuevaCatNombre, establecerNuevaCatNombre] = React.useState("");
        const [nuevaCatIcono, establecerNuevaCatIcono] = React.useState("📚");
        const [nuevaCatDescripcion, establecerNuevaCatDescripcion] = React.useState("");
        const [guardandoCat, establecerGuardandoCat] = React.useState(false);

        // Cada apertura parte de los valores del libro elegido o de un formulario vacío.
        React.useEffect(() => {
          if (!abierto) return;
          establecerCampos({
            titulo: libro?.titulo || "",
            autor: libro?.autor || "",
            categoriaId: libro?.categoriaId ? String(libro.categoriaId) : (categorias[0]?.id ? String(categorias[0].id) : ""),
            totalPaginas: libro?.totalPaginas ?? "",
            portadaUrl: libro?.portadaUrl || "",
            descripcion: libro?.descripcion || "",
            contenidoCompleto: libro?.contenidoCompleto || "",
          });
          establecerError("");
          establecerArchivoCargadoInfo(null);
          establecerCreandoCategoria(false);

          if (autoAbrirSelector) {
            const temporizador = setTimeout(() => {
              inputArchivoRef.current?.click();
            }, 180);
            return () => clearTimeout(temporizador);
          }
        }, [abierto, libro, categorias, autoAbrirSelector]);

        /** Guarda el valor de un control sin reemplazar los demás campos. */
        function cambiarCampo(evento) {
          const { name, value } = evento.target;
          establecerCampos((actuales) => ({ ...actuales, [name]: value }));
        }

        /** Procesa archivos PDF o TXT arrastrados o seleccionados */
        async function procesarArchivo(archivo) {
          if (!archivo) return;
          establecerProcesandoArchivo(true);
          establecerEstadoProcesamiento(`Leyendo ${archivo.name}...`);
          try {
            const nombreBase = archivo.name.replace(/\.(pdf|txt)$/i, "").replace(/[_-]/g, " ");
            const esPdf = archivo.type === "application/pdf" || archivo.name.toLowerCase().endsWith(".pdf");

            if (esPdf) {
              if (!window.pdfjsLib) {
                throw new Error("El lector PDF se está inicializando. Por favor espera unos segundos y reintenta.");
              }
              const buffer = await archivo.arrayBuffer();
              const loadingTask = window.pdfjsLib.getDocument({ data: buffer });
              const pdf = await loadingTask.promise;
              const totalPags = pdf.numPages;

              establecerEstadoProcesamiento(`Extrayendo texto de ${totalPags} páginas...`);
              const paginasTexto = [];
              for (let p = 1; p <= totalPags; p++) {
                if (p % 2 === 0 || p === totalPags) {
                  establecerEstadoProcesamiento(`Procesando página ${p} de ${totalPags}...`);
                }
                const pagina = await pdf.getPage(p);
                const contenidoTexto = await pagina.getTextContent();
                const lineas = contenidoTexto.items.map((item) => item.str).join(" ").trim();
                paginasTexto.push(`--- PÁGINA ${p}: Página ${p} ---\n${lineas || "(Página sin texto reconocible)"}`);
              }

              const textoCompleto = paginasTexto.join("\n\n");
              const textoSinMarcadores = textoCompleto.replace(/--- PÁGINA \d+:.*?---/g, "").trim();
              const primeraFrase = textoSinMarcadores.slice(0, 220);

              establecerCampos((actual) => ({
                ...actual,
                titulo: actual.titulo || nombreBase,
                autor: actual.autor || "Autor del documento",
                totalPaginas: totalPags,
                descripcion: actual.descripcion || (primeraFrase ? `${primeraFrase}...` : "Lectura importada desde documento PDF."),
                contenidoCompleto: textoCompleto,
              }));
              establecerArchivoCargadoInfo(`✓ PDF procesado: "${archivo.name}" (${totalPags} páginas extraídas con índice listo)`);
              notificar(`PDF procesado con éxito: ${totalPags} páginas extraídas.`);
            } else {
              // TXT
              const texto = await archivo.text();
              const palabras = texto.trim().split(/\s+/u).filter(Boolean);
              let textoFormateado = texto;
              let totalPags = Math.max(1, Math.ceil(palabras.length / 220));

              if (!texto.includes("--- PÁGINA")) {
                const bloques = [];
                for (let i = 0; i < palabras.length; i += 220) {
                  const num = Math.floor(i / 220) + 1;
                  bloques.push(`--- PÁGINA ${num}: Página ${num} ---\n` + palabras.slice(i, i + 220).join(" "));
                }
                textoFormateado = bloques.join("\n\n");
              }

              establecerCampos((actual) => ({
                ...actual,
                titulo: actual.titulo || nombreBase,
                autor: actual.autor || "Autor del documento",
                totalPaginas: totalPags,
                descripcion: actual.descripcion || (texto.slice(0, 200) + "..."),
                contenidoCompleto: textoFormateado,
              }));
              establecerArchivoCargadoInfo(`✓ Archivo de texto: "${archivo.name}" (${totalPags} páginas preparadas)`);
              notificar(`Archivo de texto cargado con éxito: ${totalPags} páginas preparadas.`);
            }
          } catch (fallo) {
            const msj = fallo.message || "Error al procesar el archivo seleccionado.";
            establecerError(msj);
            notificar(msj, "error");
          } finally {
            establecerProcesandoArchivo(false);
            establecerEstadoProcesamiento("");
          }
        }

        /** Manejadores de arrastrar y soltar archivo */
        function manejarDragOver(evento) {
          evento.preventDefault();
          establecerArrastrandoArchivo(true);
        }
        function manejarDragLeave(evento) {
          evento.preventDefault();
          establecerArrastrandoArchivo(false);
        }
        function manejarDrop(evento) {
          evento.preventDefault();
          establecerArrastrandoArchivo(false);
          const archivo = evento.dataTransfer?.files?.[0];
          if (archivo) procesarArchivo(archivo);
        }

        /** Guarda una nueva categoría desde el formulario del libro */
        async function guardarNuevaCategoria() {
          if (!nuevaCatNombre.trim()) {
            establecerError("Ingresa el nombre de la categoría.");
            return;
          }
          establecerGuardandoCat(true);
          try {
            const categoriaCreada = await serviciosApi.crearCategoria({
              nombre: nuevaCatNombre.trim(),
              descripcion: nuevaCatDescripcion.trim() || `Libros de ${nuevaCatNombre.trim()}`,
              icono: nuevaCatIcono || "📚",
            });
            if (alCrearCategoria) {
              alCrearCategoria(categoriaCreada);
            }
            establecerCampos((actual) => ({ ...actual, categoriaId: String(categoriaCreada.id) }));
            establecerNuevaCatNombre("");
            establecerNuevaCatDescripcion("");
            establecerCreandoCategoria(false);
            notificar(`Categoría "${categoriaCreada.nombre}" creada y seleccionada.`);
          } catch (fallo) {
            notificar(fallo.message || "No se pudo crear la categoría.", "error");
          } finally {
            establecerGuardandoCat(false);
          }
        }

        /** Envía el formulario al servicio padre y conserva errores de la API. */
        async function enviarFormulario(evento) {
          evento.preventDefault();
          establecerGuardado(true);
          establecerError("");
          try {
            await alGuardar({
              ...campos,
              portadaUrl: (campos.portadaUrl && campos.portadaUrl.trim()) ? campos.portadaUrl.trim() : "https://images.unsplash.com/photo-1544716278-ca5e3f4abd8c?auto=format&fit=crop&w=600&q=80",
              categoriaId: Number(campos.categoriaId),
              totalPaginas: Number(campos.totalPaginas) || 1,
            }, libro?.id);
            notificar(libro ? "Libro actualizado." : "Libro agregado a la biblioteca.");
            alCerrar();
          } catch (fallo) {
            const mensaje = fallo.message || "No se pudo guardar el libro.";
            establecerError(mensaje);
            notificar(mensaje, "error");
          } finally {
            establecerGuardado(false);
          }
        }

        return (
          <Modal
            abierto={abierto}
            titulo={libro ? "Editar libro" : "Agregar libro a tu biblioteca"}
            alCerrar={alCerrar}
            clase="modal-libro-admin"
          >
            <form className="formulario-contenido" onSubmit={enviarFormulario}>
              {/* Zona de carga de archivos PDF / TXT */}
              <div
                className={`zona-carga-archivo ${arrastrandoArchivo ? "arrastrando" : ""}`}
                onDragOver={manejarDragOver}
                onDragLeave={manejarDragLeave}
                onDrop={manejarDrop}
                onClick={() => inputArchivoRef.current?.click()}
              >
                <input
                  ref={inputArchivoRef}
                  type="file"
                  accept=".pdf,.txt,application/pdf,text/plain"
                  style={{ display: "none" }}
                  onChange={(e) => {
                    const arc = e.target.files?.[0];
                    if (arc) procesarArchivo(arc);
                  }}
                />
                <div className="zona-carga-icono">
                  <Icono nombre={procesandoArchivo ? "brillo" : "subir"} tamano={22} />
                </div>
                <div className="zona-carga-texto">
                  <strong>{procesandoArchivo ? estadoProcesamiento : "Cargar libro desde archivo (PDF o TXT)"}</strong>
                  <p>Arrastra aquí tu documento o haz clic para seleccionarlo. Se extraerán automáticamente las páginas, el título y el texto listo para leer con índice interactivo.</p>
                  <button
                    type="button"
                    className="boton boton-primario boton-explorar-pdf"
                    onClick={(e) => {
                      e.stopPropagation();
                      inputArchivoRef.current?.click();
                    }}
                  >
                    <Icono nombre="buscar" tamano={15} /> <span>Buscar PDF en mi equipo (Explorador de archivos)</span>
                  </button>
                </div>
                {archivoCargadoInfo && (
                  <div className="estado-archivo-cargado" onClick={(e) => e.stopPropagation()}>
                    <Icono nombre="check" tamano={14} /> <span>{archivoCargadoInfo}</span>
                  </div>
                )}
              </div>

              <div className="formulario-fila formulario-fila-doble">
                <label className="campo-admin">Título<input autoFocus name="titulo" required maxLength="220" value={campos.titulo || ""} onChange={cambiarCampo} placeholder="Ej: Don Quijote de la Mancha" /></label>
                <label className="campo-admin">Autor<input name="autor" required maxLength="180" value={campos.autor || ""} onChange={cambiarCampo} placeholder="Ej: Miguel de Cervantes" /></label>
              </div>

              <div className="formulario-fila formulario-fila-doble">
                <div className="campo-admin">
                  <div className="formulario-fila-encabezado">
                    <label>Categoría</label>
                    <button
                      type="button"
                      className="boton-enlace-accion"
                      onClick={() => establecerCreandoCategoria(!creandoCategoria)}
                    >
                      {creandoCategoria ? "✕ Cancelar" : "+ Nueva categoría"}
                    </button>
                  </div>
                  <select name="categoriaId" required value={campos.categoriaId || ""} onChange={cambiarCampo}>
                    <option value="" disabled>Selecciona una categoría</option>
                    {categorias.map((categoria) => <option key={categoria.id} value={categoria.id}>{categoria.icono || "📚"} {categoria.nombre}</option>)}
                  </select>
                </div>
                <label className="campo-admin">Páginas<input name="totalPaginas" type="number" min="1" step="1" required value={campos.totalPaginas ?? ""} onChange={cambiarCampo} /></label>
              </div>

              {/* Panel inline para crear nueva categoría si no existe */}
              {creandoCategoria && (
                <div className="panel-nueva-categoria" role="region" aria-label="Crear nueva categoría">
                  <div className="panel-nueva-categoria-titulo">
                    <span>➕ Crear nueva categoría</span>
                    <button type="button" className="boton-enlace-accion" onClick={() => establecerCreandoCategoria(false)}>Cerrar</button>
                  </div>
                  <div className="formulario-fila formulario-fila-doble">
                    <label className="campo-admin">Nombre de categoría
                      <input
                        value={nuevaCatNombre}
                        placeholder="Ej: Novelas, Finanzas, Biología..."
                        onChange={(e) => establecerNuevaCatNombre(e.target.value)}
                        maxLength="50"
                      />
                    </label>
                    <div className="campo-admin">
                      <label>Ícono</label>
                      <div className="selector-icono-categoria">
                        <input
                          value={nuevaCatIcono}
                          placeholder="📚"
                          style={{ width: "45px", textAlign: "center", fontSize: "16px" }}
                          onChange={(e) => establecerNuevaCatIcono(e.target.value)}
                          maxLength="4"
                        />
                        <div className="emojis-rapidos">
                          {["📚", "🔬", "🏺", "💻", "🎨", "🚀", "🧠", "📖", "🌍", "💼", "🎭", "⚡"].map((emoji) => (
                            <button
                              key={emoji}
                              type="button"
                              className={`boton-emoji ${nuevaCatIcono === emoji ? "seleccionado" : ""}`}
                              onClick={() => establecerNuevaCatIcono(emoji)}
                            >
                              {emoji}
                            </button>
                          ))}
                        </div>
                      </div>
                    </div>

      /** Layout común con encabezado, selector lateral, navegación para pulgar y área de contenido. */
      function Layout({ categorias, categoriaSeleccionada, alSeleccionarCategoria, cantidadTotal, alAbrirLibroRecordatorio, dashboardActivo, alCambiarDashboard, catalogoActivo, alAgregarLibro, modoConexion, estadoConexionMcp, alCambiarModoConexion, usuarios, usuarioActivo, alCambiarPerfil, alAbrirGestionUsuarios, alIrACatalogo, alCrearCategoria, alEliminarCategoria, children }) {
        const notificar = React.useContext(ContextoNotificaciones);
        const [menuLateralAbierto, establecerMenuLateralAbierto] = React.useState(false);
        const [esMovil, establecerEsMovil] = React.useState(() => window.matchMedia?.("(max-width: 767px)").matches ?? false);
        const botonMenuRef = React.useRef(null);
        const toqueInicioRef = React.useRef(null);

        // Estado del modal de nueva categoría en el menú lateral
        const [modalNuevaCatAbierto, establecerModalNuevaCatAbierto] = React.useState(false);
        const [catNombre, establecerCatNombre] = React.useState("");
        const [catIcono, establecerCatIcono] = React.useState("📚");
        const [catDesc, establecerCatDesc] = React.useState("");
        const [guardandoCat, establecerGuardandoCat] = React.useState(false);

        async function enviarNuevaCat(e) {
          e.preventDefault();
          if (!catNombre.trim()) return;
          establecerGuardandoCat(true);
          try {
            const nueva = await serviciosApi.crearCategoria({
              nombre: catNombre.trim(),
              descripcion: catDesc.trim() || `Libros de ${catNombre.trim()}`,
              icono: catIcono || "📚",
            });
            if (alCrearCategoria) alCrearCategoria(nueva);
            establecerModalNuevaCatAbierto(false);
            establecerCatNombre("");
            establecerCatDesc("");
            notificar(`Categoría "${nueva.nombre}" creada con éxito.`);
          } catch (f) {
            notificar(f.message || "Error al crear la categoría.", "error");
          } finally {
            establecerGuardandoCat(false);
          }
        }

        // El cajón solo se oculta del teclado y de lectores de pantalla en móvil.
        React.useEffect(() => {
          const consultaMovil = window.matchMedia("(max-width: 767px)");
          function actualizarAncho() {
            establecerEsMovil(consultaMovil.matches);
            if (!consultaMovil.matches) establecerMenuLateralAbierto(false);
          }
          consultaMovil.addEventListener("change", actualizarAncho);
          return () => consultaMovil.removeEventListener("change", actualizarAncho);
        }, []);

        // Escape cierra el cajón móvil igual que cualquier otro panel temporal.
        React.useEffect(() => {
          function cerrarMenuConEscape(evento) {
            if (evento.key === "Escape" && menuLateralAbierto) cerrarMenuLateral();

          window.addEventListener("keydown", cerrarMenuConEscape);
          return () => window.removeEventListener("keydown", cerrarMenuConEscape);
